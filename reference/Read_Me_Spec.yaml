                      description: |
                        The amount of the virtual asset to be transferred.
                      example: '0.024'
                    isExceedingThreshold:
                      type: boolean
                      description: >
                        A boolean field to check whether the fiat-converted
                        amount of the virtual asset to be transferred exceeds
                        the legal threshold.   If the value is false, User
                        Verification for the transaction is not mandatory.  
                        (Legal threshold: 1,000 USD or 1,000,000 KRW.)
                      example: true
