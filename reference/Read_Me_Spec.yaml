          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                  - page
                  - rpp
                  - verifications
                properties:
                  count:
                    type: number
                    description: |
                      Total number of items.
                    example: 25
                  page:
                    type: number
                    description: |
                      The page number in the paginated response.
                    example: 1
                  rpp:
                    type: number
                    description: |
                      The number of records per page in the paginated response.
                    example: 10
                  verifications:
