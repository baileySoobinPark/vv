        example: '0x1234567890123456789012345678901234567890'
    Params_BeneficiaryAccountNumber:
      name: beneficiaryAccountNumber
      in: query
      schema:
        type: string
        description: |
          Wallet address of teh Beneficiary.
        example: '0x1234567890123456789012345678901234567890'
    Params_Page:
      name: page
      in: query
      schema:
        type: number
        description: |
          Number of the page.
        example: 1
    Params_Rpp:
      name: rpp
      in: query
      schema:
        type: number
        description: |
          Number of the records.
        example: 10
