                                  person.
                                properties:
                                  naturalPerson:
                                    type: object
                                    required:
                                      - name
                                    description: >
                                      An object containing details about the
                                      natural person.
                                    properties:
                                      name:
                                        type: object
                                        required:
                                          - nameIdentifier
                                        description: |
                                          An object with name details.
                                        properties:
                                          nameIdentifier:
                                            type: array
                                            description: >-
                                              An array containing the name
                                              information.
                                            items:
                                              type: object
                                              required:
                                                - primaryIdentifier
                                                - nameIdentifierType
                                              properties:
                                                primaryIdentifier:
                                                  type: string
                                                  description: >
                                                    The basic representation of a last
                                                    name.   By default, this field is used
                                                    to enter the last name. However, if
                                                    separating the last name and first name
                                                    is not feasible, the full name can be
                                                    entered in this field.
                                                  example: James
                                                secondaryIdentifier:
                                                  type: string
                                                  description: >
                                                    The basic representation of a first
                                                    name.   This field is primarily used to
                                                    enter the first name. If a middle name
                                                    also needs to be included, it can be
                                                    combined with the first name in this
                                                    field.
                                                  example: James || Jeffry James
                                                nameIdentifierType:
                                                  type: string
                                                  enum:
                                                    - ALIA
                                                    - BIRT
                                                    - MAID
                                                    - LEGL
                                                    - MISC
                                                  description: >
                                                    The type of name identifier.  
                                                      
                                                    Refer to the details below for
                                                    information about each type of name
                                                    identifier:   The following values can
                                                    be included:  
                                                      **ALIA**: An alias name, commonly known apart from the legal name.  

                                                      **BIRT**: A birth name.  

                                                      **MAID**: The original name used before a surname change due to marriage.  

                                                      **LEGL**: A legally or officially registered name.  

                                                      **MISC**: Other names that do not fall under the above categories.
                                              example: LEGL
                            accountNumber:
                              type: array
                              description: |
                                An array containing wallet addresses.
                              items:
                                type: string
            examples:
              requestexamples:
                summary: example of a verification request
                description: >
                  A complete example of a request for user account verification,
