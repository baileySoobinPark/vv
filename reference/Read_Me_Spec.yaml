    Result:
      type: string
      enum:
        - VERIFIED
        - DENIED
        - ERROR
      description: |
        Result of User Account Verification or User Verification.
      example: VERIFIED
    Reason:
      type: string
      enum:
        - UNKNOWN-SYMBOL
        - UNKNOWN-NETWORK
        - UNKNOWN-ADDRESS
        - MISMATCHED-NAME
        - UNDEFINED-ERROR
        - BLACKLISTED
        - UNVERIFIED-KYC
      description: |
        Error codes indicating the reason for verification failure.
      example: UNKNOWN-ADDRESS
    UserVerificationReason:
      type: string
      enum:
        - OK
        - UNKNOWN-SYMBOL
        - UNKNOWN-NETWORK
        - UNKNOWN-ADDRESS
        - MISMATCHED-NAME
        - LACK-OF-INFORMATION
        - UNAVAILABLE-INFORMATION
        - BLACKLISTED
        - UNVERIFIED-KYC
        - NOT-ALLOWED
        - UNDEFINED-ERROR
      description: |
        Error codes of the reason for the verification failure
      example: UNKNOWN-ADDRESS
    CallbackReason:
      type: string
      enum:
        - OK
        - UNKNOWN-SYMBOL
        - UNKNOWN-NETWORK
        - UNKNOWN-ADDRESS
        - MISMATCHED-NAME
        - LACK-OF-INFORMATION
        - UNAVAILABLE-INFORMATION
        - BLACKLISTED
        - UNVERIFIED-KYC
        - NOT-ALLOWED
        - UNDEFINED-ERROR
        - BENEFICIARY-ACCOUNT-NOT-MATCHED
        - REQUEST-TIMEOUT
      description: |
        Error codes of the reason for the verification failure
      example: UNKNOWN-ADDRESS
    CreatedAt:
      type: string
      description: >
        The timestamp when the user verification was requested.   This field
        must follow the UTC ISO 8601 datetime representation standard.  
          
        **Recommendations**  

        To ensure consistency across systems, we strongly recommend using the
        extended format "YYYY-MM-DDThh:mm:ss.sssZ", which includes milliseconds
        and clearly specifies the UTC timezone.  
          
        Other ISO 8601 Acceptable Formats:  
          - Basic format("YYYYMMDDThhmmss.sssZ")  
          - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")  
          
        **Implementation Note**  
          
        While the extended format is recommended, your implementation should
        account for requests from external VASPs that may use the other two
        formats. Ensure your system can handle and correctly interpret all three
        formats to maintain compatibility.
      example: '2024-11-25T15:30:00.000Z'
    Message:
      type: string
      description: |
        Additional information about the verification result.
      example: An unidentifiable wallet address.
    OriginatingVaspId:
      type: string
      description: |
        Unique identifier of Originating VASP.
      example: '123456789098765'
    Symbol:
      type: string
      description: |
        Symbol of the virtual asset to be transferred.
      example: ETH
    Network:
      type: string
      description: >
        The network of the virtual asset to be transferred.   The network field
        can be implemented conditionally. Valid values for this field can be
        found here.  
          
        **Conditional Use of 'network' Field:**  
          When the Beneficiary VASP requires the network field:  
          If the Originating VASP does not provide a network value in the request, the response will include: result as **DENIED** and reason as **UNKNOWN-NETWORK**.  
            
          When the Beneficiary VASP makes the network field optional:  
          Even if the Originating VASP omits the network value, the Beneficiary VASP can infer the network based on the symbol and return the verification result.
      example: Ethereum
    VerificationUuid:
      type: string
      description: |
        A unique identifier for the User Verification request.  
        The format of **verificationUuid** must follow the UUID v4 standard.
      example: 4bc03a8f-5679-4358-815c-906aae5557f4
    Version:
      type: string
      description: |
        The version of the IVMS101 messaging protocol being used.
      example: '1.0'
    IVMS101_RequestUserAccountVerification:
      type: object
      description: >
        An object with IVMS101-formatted data containing information about the
        Originator, OriginatingVASP, Beneficiary, and BeneficiaryVASP.
      required:
        - beneficiary
      properties:
        beneficiary:
          $ref: '#/components/schemas/Beneficiary_RequestUserAccountVerification'
    IVMS101_Request_RequestUserVerification:
      type: object
      description: >
        An object with IVMS101-formatted data that may include information about
        the Originator, Originating VASP, Beneficiary, and Beneficiary VASP for
        sending the request.
      required:
        - originator
        - beneficiary
      properties:
        originator:
          $ref: '#/components/schemas/Originator'
        beneficiary:
          $ref: '#/components/schemas/Request_Beneficiary_RequestUserVerification'
    IVMS101_Response_RequestUserVerification:
      type: object
      description: >
        An object containing IVMS101-formatted data, which may include
        information about the Originator, Originating VASP, Beneficiary, and
        Beneficiary VASP.
      required:
        - beneficiary
      properties:
        beneficiary:
          $ref: '#/components/schemas/Response_Beneficiary_RequestUserVerification'
    CallbackType:
      type: string
      enum:
        - VERIFICATION_RESULT
        - TX_REPORT
        - ERROR_REPORT
        - CHAINALYSIS_KYT_RESULT
        - REFINITIV_WCO_RESULT
      description: >
        A type used to identify a callback request.   For request body examples
        by callbackType, refer to the Functional Requirements section above.
      example: VERIFICATION_RESULT
    Originator:
      type: object
      required:
        - originatorPersons
        - accountNumber
      description: |
        An object containing the Originator information.
      properties:
        originatorPersons:
          $ref: '#/components/schemas/OriginatorPersons'
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
    OriginatorPersons:
      type: array
      description: |
        An array containing the Originator's personal information.
      items:
        $ref: '#/components/schemas/NaturalPerson'
    AccountNumber:
      type: array
      description: |
        An array containing wallet addresses.
      items:
        type: string
    Amount:
      type: string
      description: |
        The amount of the virtual asset to be transferred.
      example: '0.024'
    IsExceedingThreshold:
      type: boolean
      description: >
        A boolean field to check whether the fiat-converted amount of the
        virtual asset to be transferred exceeds the legal threshold.   If the
        value is false, User Verification for the transaction is not
        mandatory.   (Legal threshold: 1,000 USD or 1,000,000 KRW.)
      example: true
    TradePrice:
      type: string
      description: >
        The amount of virtual assets to be transferred, converted into fiat
        currency.
      example: '2439800'
    TradeCurrency:
      type: string
      description: |
        The code of the fiat currency into which the virtual asset is converted.
      example: KRW
    TradeISODateTime:
      type: string
      description: >
        The timestamp used as the exchange rate reference when converting the
        virtual asset to fiat currency.   This field must follow the UTC ISO
        8601 datetime representation standard.  
          
        **Recommendations**  
          
        To ensure consistency across systems, we strongly recommend using the
        extended format "YYYY-MM-DDThh:mm:ss.sssZ", which includes milliseconds
        and clearly specifies the UTC timezone.   Other ISO 8601 Acceptable
        Formats:  
          - Basic format("YYYYMMDDThhmmss.sssZ")    
          - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")    
          
        **Implementation Note**  
          
        While the extended format is recommended, your implementation should
        account for requests from external VASPs that may use the other two
        formats. Ensure your system can handle and correctly interpret all three
        formats to maintain compatibility.
      example: '2024-11-25T15:30:00.000Z'
    NaturalPerson:
      type: object
      required:
        - naturalPerson
      description: |
        An object containing details about the natural person.
      properties:
        naturalPerson:
          $ref: '#/components/schemas/NaturalPersonEntity'
    Optional_NaturalPerson:
      type: object
      description: |
        An object containing details about the natural person.
      properties:
        naturalPerson:
          $ref: '#/components/schemas/Optional_NaturalPersonEntity'
    NaturalPersonEntity:
      type: object
      required:
        - name
      description: |
        An object containing details about the natural person.
      properties:
        name:
          $ref: '#/components/schemas/Name'
    Optional_NaturalPersonEntity:
      type: object
      description: |
        An object containing details about the natural person.
      properties:
        name:
          $ref: '#/components/schemas/Name'
        geographicAddress:
          $ref: '#/components/schemas/GeographicAddress'
        nationalIdentification:
          $ref: '#/components/schemas/NationalIdentification'
        customerIdentification:
          $ref: '#/components/schemas/CustomerIdentification'
        dateAndPlaceOfBirth:
          $ref: '#/components/schemas/DateAndPlaceOfBirth'
        countryOfResidence:
          $ref: '#/components/schemas/CountryOfResidence'
    Name:
      type: object
      required:
        - nameIdentifier
      description: |
        An object with name details.
      properties:
        nameIdentifier:
          $ref: '#/components/schemas/NameIdentifier'
    AccountVerificationResult:
      type: string
      enum:
        - VERIFIED
        - DENIED
      description: >
        Result of User Account Verification:  
          
        If the result is **DENIED**, the reason field should provide the
        specific reason.
      example: VERIFIED
    BooleanResult:
      type: boolean
      description: |
        A boolean indicating the verification result.  
          
        true represents that the result is **VERIFIED**.
      example: true
    CallbackResult:
      type: boolean
      description: |
        A static result field for callback response. Return **true** always.
      example: true
    VerifiedAt:
      type: string
      description: >
        The timestamp when the verification was completed.  
          
        This field must follow the UTC ISO 8601 datetime representation
        standard.
          
        **Recommendations**  
          
        To ensure consistency across systems, we strongly recommend using the
        extended format "YYYY-MM-DDThh:mm:ss.sssZ", which includes milliseconds
        and clearly specifies the UTC timezone.   Other ISO 8601 Acceptable
        Formats:  
          - Basic format("YYYYMMDDThhmmss.sssZ")  
          - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")  
          
        **Implementation Note**  
          
        While the extended format is recommended, your implementation should
        account for requests from external VASPs that may use the other two
        formats. Ensure your system can handle and correctly interpret all three
        formats to maintain compatibility.
      example: '2024-11-25T15:30:00.000Z'
    NameIdentifier:
      type: array
      description: An array containing the name information.
      items:
        type: object
        required:
          - primaryIdentifier
          - nameIdentifierType
        properties:
          primaryIdentifier:
            type: string
            description: >
              The basic representation of a last name.   By default, this field
              is used to enter the last name. However, if separating the last
              name and first name is not feasible, the full name can be entered
              in this field.
            example: James
          secondaryIdentifier:
            type: string
            description: >
              The basic representation of a first name.   This field is
              primarily used to enter the first name. If a middle name also
              needs to be included, it can be combined with the first name in
              this field.
            example: James || Jeffry James
          nameIdentifierType:
            type: string
            enum:
              - ALIA
              - BIRT
              - MAID
              - LEGL
              - MISC
            description: >
              The type of name identifier.  
                
              Refer to the details below for information about each type of name
              identifier:   The following values can be included:  
                **ALIA**: An alias name, commonly known apart from the legal name.  

                **BIRT**: A birth name.  

                **MAID**: The original name used before a surname change due to marriage.  

                **LEGL**: A legally or officially registered name.  

                **MISC**: Other names that do not fall under the above categories.
        example: LEGL
    LocalNameIdentifier:
      type: array
      items:
        type: object
        required:
          - primaryIdentifier
          - nameIdentifierType
        properties:
          primaryIdentifier:
            type: string
            description: >

              The basic representation of a last name in the local language.  

              If separating the name into first and last names is not feasible,
              the full name can be entered in the <code>primaryIdentifier</code>
              field.
            example: 김 || 김재원
          secondaryIdentifier:
            type: string
            description: >

              The basic representation of a first name in the local language.  

              This field is used to enter the first name. If a middle name also
              needs to be included, it can be combined with the first name in
              this field.
            example: 재원
          nameIdentifierType:
            type: string
            enum:
              - ALIA
              - BIRT
              - MAID
              - LEGL
              - MISC
            description: >

              The type of name identifier.  

              Refer to the details below for more information about the types of
              name identifiers:   The following values can be included:  
                **ALIA**: An alias name, commonly known apart from the legal name.  
                
                **BIRT**: A birth name.  
                
                **MAID**: The original name used before a surname change due to marriage.  
                
                **LEGL**: A legally or officially registered name.  
                
                **MISC**: Other names that do not fall under the above categories.
        example: LEGL
    GeographicAddress:
      type: array
      description: >

        An array containing address information.  

        To use this field, at least one of the following conditions must be
        met:   Required conditions  
          1. At least one addressLinemust be present.  
          
          2. Both streetName and buildingName must be present.  
          
          3. Both streetName and buildingNumber must be present.  
        </details>
      items:
        type: object
        properties:
          addressType:
            type: string
            enum:
              - HOME
              - BIZZ
              - GEOG
            description: |
              The type of geographic address.   Allowed values:  
                HOME: Home address.  
                BIZZ: Business address.  
                GEOG: Geographic address.
            example: GEOG
          townName:
            type: string
            description: |

              The name of the town or district.
            example: Yeoksam-dong
          addressLine:
            type: array
            items:
              type: string
            description: >

              A free-form address that identifies a specific location.   If
              dividing the address into components (e.g., province, city, street
              name) is difficult, the full address can be entered as a single
              string in addressLine.
            example:
              - 14 Teheran-ro 4-gil
              - Gangnam-gu
              - 4th floor
          country:
            type: string
            description: >
              The country code of the country of residence (ISO 3166-1 alpha-2
              format).
            example: KR
    NationalIdentification:
      type: object
      description: |
        An object containing National Identification information.
      properties:
        nationalIdentifier:
          type: string
          description: |
            National Identification Number.
          example: 12345-67890
        nationalIdentifierType:
          type: string
          enum:
            - ARNU
            - CCPT
            - RAID
            - DRLC
            - FIIN
            - TXID
            - SOCS
            - IDCD
            - LEIX
            - MISC
          description: |
            Type of National Identification.   Allowed values:  
              **ARNU**: Alien Registration Number (assigned to foreigners by the state).  
              **CCPT**: Passport Number.  
              **RAID**: (For corporations only) Corporate registration number (e.g., business registration number).  
              **DRLC**: Driver's License Number.  
              **FIIN**: Foreign Investor Identification Number.  
              **TXID**: Tax Identification Number (assigned by tax authorities).  
              **SOCS**: Social Security or Resident Registration Number.  
              **IDCD**: ID Card Number (assigned by a national authority).  
              **LEIX**: (For corporations only) Legal Entity Identifier (global identifier under ISO 17442).  
              **MISC**: Other types of national identification numbers not defined above.  

              Further details can be found in the [IVMS Guide](https://kr-verifyvasp.gitbook.io/verifyvasp/4SIXfxCm5FxXbkiB9pkY/references/ivms101-guide#nationalidentification-type).
      example: IDCD
    CustomerIdentification:
      type: string
      description: |

        Customer number of individual.
      example: '1234569999'
    DateAndPlaceOfBirth:
      type: object
      properties:
        dateOfBirth:
          type: string
          description: |
            Date of birth.  
            Allowed format: ISO 8601 ("YYYY-MM-DD").
          example: '1985-03-14'
        placeOfBirth:
          type: string
          description: |
            Place of birth.
          example: Nonsan
    CountryOfResidence:
      type: string
      description: |
        The country code of the country of residence.
      example: KR
    TransactionStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - WAIT-CONFIRM
        - CONFIRMED
        - CANCELED
      description: |
        Current status of the virtual asset transaction.  
          
        Details of each state:  
          **PENDING**: The Originating VASP has not yet executed the virtual asset transaction.  
          
          **PROCESSING**:The virtual asset transaction has been initiated and is awaiting mining.  
                        
          **WAIT-CONFIR**: The transaction has been mined but the block containing it has not achieved finality.  
          
          **CONFIRMED**: The virtual asset transaction has been mined, and the block containing the transaction has achieved finality.  
          
          **CANCELED**: The Originating VASP has permanently canceled the transaction for a specific reason.
      example: PROCESSING
    TxHash:
      type: string
      description: |
        Unique identifier of the transaction.
      example: 8a54d58ca4100112a5430818776d74898f2232770bae03046862575cb851a042
    Vout:
      type: string
      description: |
        Index of the output in a Bitcoin blockchain transaction.
      example: '2'
    InputKey:
      type: string
      description: >
        The Base64-encoded value of **VEGA_ENCRYPTION_KEY_BASE64**, as defined
        in the Enclave environment variables.
      example: Y9uIJCLAkzVi2XYZrUDmBYJp3szXlJIUwfLfbLsVeHU=
    OutputKey:
      type: string
      description: |
        The Base64-encoded database encryption key.
      example: d0odhtb/jD9qWWTA59koPGgw2jj0ptov56A3b3dfohY=
    VaspId:
      type: string
      description: |
        Unique identifier of VASP.
      example: '15952089931162060684'
    Health:
      type: string
      enum:
        - UP
        - DOWN
      description: |
        Current operational health status of the VASP Enclave server.
      example: UP
    VaspName:
      type: string
      description: |
        The name of VASP.
      example: A Exchange
    LegalName:
      type: string
      description: |
        The legal entity name of the VASP.
      example: A Exchange
    Jurisdiction:
      type: string
      description: >
        The country or region where the legal entity is incorporated
        (jurisdiction of incorporation).
      example: Singapore
    IsAlliance:
      type: boolean
      description: |
        A boolean field indicating whether the entity is a member of VerifyVASP.
      example: true
    Country:
      type: string
      description: |
        The name of the country where the VASP is incorporated.
      example: Singapore
    CountryCode:
      type: string
      description: >
        The ISO 3166-1 alpha-2 code of the country where the VASP is
        incorporated.
      example: SG
    Protocol:
      type: string
      enum:
        - VERIFYVASP
        - CODE
      description: |
        The Travel Rule Protocol used by the VASP.   Allowed values:  
          1. VERIFYVASP: Indicates that the VASP is a member of VerifyVASP.  
          2. CODE: Indicates that the VASP is a member of CODE.
      example: VERIFYVASP
    LicensedStatus:
      type: string
      enum:
        - Regulated
        - Unregulated
      description: |
        The VA License acquisition status of the VASP.
      example: Regulated
    VaspStatus:
      type: string
      enum:
        - UNVERIFIED
        - VERIFIED
        - VERIFIED-MEMBER
        - INTEROPERATED
      description: |
        The status of the VASP on VerifyVASP.   Allowed values:  
          **VERIFIED-MEMBER**: A member of the VerifyVASP Alliance with the Enclave server properly running, enabling transactions.  

          **VERIFIED**: Registered with VerifyVASP but not approved as an Alliance member, or an Alliance member without an installed Enclave server. 

          **UNVERIFIED**: Not registered with VerifyVASP.  

          **INTEROPERATED**: A member of another Travel Rule Protocol.
      example: VERIFIED-MEMBER
    CreateAt:
      type: string
      description: >
        The timestamp indicating when the VASP information was created.   This
        field must follow the UTC ISO 8601 datetime representation standard.  
          
        **Recommendations**:   To ensure consistency across systems, we strongly
        recommend using the extended format "YYYY-MM-DDThh:mm:ss.sssZ", which
        includes milliseconds and clearly specifies the UTC timezone.  
          
        Other ISO 8601 Acceptable Formats:  
          - Basic format("YYYYMMDDThhmmss.sssZ")  
          - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")  

        **Implementation Note**  
          
        While the extended format is recommended, your implementation should
        account for requests from external VASPs that may use the other two
        formats. Ensure your system can handle and correctly interpret all three
        formats to maintain compatibility.
      example: '2024-11-25T15:30:00.000Z'
    UpdatedAt:
      type: string
      description: >
        The timestamp when the information of VASP was updated.  
          
        This field must follow the UTC ISO 8601 datetime representation
        standard.  
          
        **Recommendations**:   To ensure consistency across systems, we strongly
        recommend using the extended format "YYYY-MM-DDThh:mm:ss.sssZ", which
        includes milliseconds and clearly specifies the UTC timezone.  
          
        Other ISO 8601 Acceptable Formats:
          - Basic format("YYYYMMDDThhmmss.sssZ")  
          - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")  
          
        **Implementation Note**  
          
        While the extended format is recommended, your implementation should
        account for requests from external VASPs that may use the other two
        formats. Ensure your system can handle and correctly interpret all three
        formats to maintain compatibility.
      example: '2024-11-25T15:30:00.000Z'
    KeyType:
      type: string
      enum:
        - PerVasp
        - PerAddress
        - PerVerification
      description: >
        The type of Public Key to be used for encrypting personal information.  

        The default value is **PerVasp**. PerAddress and PerVerification can
        also be entered.  

        The Beneficiary VASP must provide the Public Key corresponding to the
        Key Type specified by the Originating VASP in this field.  
          
        Explanation of allowed values:  
          
        **PerVasp**: A single key shared across all verifications for a VASP.  

        **PerAddress**: A unique key is generated for each beneficiary
        address.  

        **PerVerification**: A new key is generated for every verification
        request.
      example: PerVasp
    BeneficiaryVaspId:
      type: string
      description: |
        Unique identifier of Beneficiary VASP.
      example: '27372039731940770'
    BeneficiaryAccountNumber:
      type: string
      description: |
        Account Address of Beneficiary.
      example: '0x5811001506550d8356a215be229c15b6ef371a9a'
    OriginatorAccountNumber:
      type: string
      description: |
        Account Address of Originator.
      example: '0x5811001506550d8356a215be229c15b6ef371a9a'
    IVMS101_Originator:
      type: string
      description: |
        Originator Type written in IVMS101 format.
      example: >-
        {"originatorPersons":[{"naturalPerson":{"name":{"nameIdentifier":[{"primaryIdentifier":"Taylor","nameIdentifierType":"LEGL"}]},"geographicAddress":[{"addressType":"test","buildingName":"123","townName":"Yeoksam-dong","country":"KR"}]}}]}
    IVMS101_OriginatingVasp:
      type: string
      description: |
        OriginatingVASP Type written in IVMS101 format.
      example: >-
        {"legalPerson":{"name":{"nameIdentifier":[{"legalPersonName":"perftest1","legalPersonNameIdentifierType":"LEGL"}]},"geographicAddress":[{"addressType":"GEOG","postcode":"13525","townName":"Yeoksam-dong","addressLine":["Gangnam-gu",
        "Gangbuck-do","abc"],"country":"AF"}],"nationalIdentification":{"nationalIdentifier":"983746561","nationalIdentifierType":"RAID","registrationAuthority":"RA000025"}}}
    IVMS101_Beneficiary:
      type: string
      description: |
        Beneficiary Type written in IVMS101 format.
      example: >-
        {"beneficiaryPersons":[{"naturalPerson":{"name":{"nameIdentifier":[{"primaryIdentifier":"Taylor","secondaryIdentifier":"Robbins","nameIdentifierType":"LEGL"}]}}}],"accountNumber":["1G3qCGKP5dQtQ7secCPTCDPU9Wfjp9x3Hb"]}
    IVMS101_BeneficiaryVasp:
      type: string
      description: |
        BeneficiaryVASP Type written in IVMS101 format.
      example: >-
        {"legalPerson":{"name":{"nameIdentifier":[{"legalPersonName":"perftest2","legalPersonNameIdentifierType":"LEGL"}]},"geographicAddress":[{"addressType":"GEOG","postcode":"13525","townName":"Yeoksam-dong","addressLine":["14",
        "Teheran-ro",
        "4-gil","Gangnam-gu"],"country":"AF"}],"nationalIdentification":{"nationalIdentifier":"7612873123","nationalIdentifierType":"RAID","registrationAuthority":"RA000073"}}}
    OrderedAt:
      type: string
      description: >
        Timestamp indicating when the transaction hash was reported.  

        This field must follow the UTC ISO 8601 datetime representation
        standard.  

        Recommendations:  
          
        To ensure consistency across systems, we strongly recommend using the
        extended format "YYYY-MM-DDThh:mm:ss.sssZ", which includes milliseconds
        and clearly specifies the UTC timezone.  
          
        Other ISO 8601 Acceptable Formats:  
          - Basic format("YYYYMMDDThhmmss.sssZ")  
          - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")  

        **Implementation Note**  
          
        While the extended format is recommended, your implementation should
        account for requests from external VASPs that may use the other two
        formats. Ensure your system can handle and correctly interpret all three
        formats to maintain compatibility.
      example: '2024-11-25T15:30:00.000Z'
    Count:
      type: number
      description: |
        Total number of items.
      example: 25
    Page:
      type: number
      description: |
        The page number in the paginated response.
      example: 1
    Rpp:
      type: number
      description: |
        The number of records per page in the paginated response.
      example: 10
    VerificationId:
      type: string
      description: |
        Unique Identifier of User Verification Result.
      example: '12345'
    RequestId:
      type: string
      description: |
        A unique identifier used to distinguish the request for risk assessment.
      example: 398ace46-6baf-4488-a9f2-ee43680b413e
    CounterpartyVaspId:
      type: string
      description: |
        Unique identifer of the counterparty VASP.
      example: '15952089931162059995'
    Direction:
      type: string
      enum:
        - OUTGOING
        - INCOMING
      description: |
        A field indicating the direction of virtual asset movement.  
        **OUTGOING** is used for withdrawals, and INCOMING is used for deposits.
      example: OUTGOING
    Address:
      type: string
      description: |
        Account address.
      example: '0xBb3fd383d1C5540E52EF0A7bcb9433375793aEAF'
    ChainalysisStatus:
      type: string
      description: |
        Result of risk assessment.
      example: NOHIT
    Chainalysis_CallbackType:
      type: string
      enum:
        - CHAINALYSIS_KYT_RESULT
      description: |
        Callback type of Chainalysis API.
      example: CHAINALYSIS_KYT_RESULT
    Refinitiv_CallbackType:
      type: string
      enum:
        - REFINITIV_WCO_RESULT
      description: |
        Callback type of Refinitiv API.
      example: REFINITIV_WCO_RESULT
    ApiType:
      type: string
      description: |

        Unused
      example: ATTEMPT
    UserId:
      type: string
      description: >
        The userId value used when calling the Chainalysis KYT API or the
        counterparty VASP ID.
      example: '15952089931162059995'
    Asset:
      type: string
      description: >
        The type of virtual asset being transferred, or that has been
        transferred, Ticker.
      example: ETH
    UsdPrice:
      type: string
      description: |
        The price of the virtual asset converted into USD.
      example: '1820.17'
    TransferRef:
      type: string
      description: >
        If the value of apiType is TRANSFER, it represents the identifier of the
        asset transfer transaction subject to risk assessment.  

        It is returned in the format tx_hash:output_address.
      example: >-
        0x50377426410d3db14b93ae3b5001ad736e1a7832ab6b16dbf12a6d6905ea7682:0xBb3fd383d1C5540E52EF0A7bcb9433375793aEAF
    OutputAddress:
      type: string
      description: |
        The wallet address of the Beneficiary subject to risk assessment.
      example: bb3fd383d1c5540e52ef0a7bcb9433375793aeaf
    Timestamp:
      type: string
      description: >
        The time when the transaction subject to risk assessment occurred.  

        If the value of data.riskAssement.chainalysisKYT.apiType is ATTEMPT, it
        refers to the time when the KYT API was called.
      example: '2023-05-18T12:39:44.000Z'
    ExternalId:
      type: string
      description: >
        The identifier issued by Chainalysis to distinguish risk assessment
        requests.
      example: 79382ac9-c7be-3fab-ad56-8c61c654e2fc
    AlertCount:
      type: number
      description: >
        The number of KYT alerts generated as a result of the risk assessment.  

        If the value of alert is 1 or higher, details related to the alerts are
        provided in a separate array.  
          
        When data.riskAssement.chainalysisKYT.status is REGISTERED, the value is
        returned as null.
      example: 1
    AlertLevel:
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
        - SEVERE
      description: |
        Level of the risk.  
        It can have the values "LOW", "MEDIUM", "HIGH", or "SEVERE".
      example: MEDIUM
    EntityCategory:
      type: string
      description: |
        The entity category being tracked by the alert rule.
      example: high risk exchange
    ServiceName:
      type: string
      description: >
        The service name of the counterparty as defined by Chainalysis.   If the
        service name has not been identified or if it is an INDIRECT exposure,
        the value is returned as null.
      example: >-
        HIGH RISK EXCHANGE: SimpleSwap.io
        bb3fd383d1c5540e52ef0a7bcb9433375793aeaf
    ExposureType:
      type: string
      enum:
        - DIRECT
        - INDIRECT
      description: |
        Defines the direction of exposure.  
        Returns one of two values: "DIRECT" or "INDIRECT".
      example: DIRECT
    AlertId:
      type: string
      description: >
        A unique identifier assigned by Chainalysis to distinguish the KYT
        alert.
      example: 118b8cc8-f579-11ed-b86d-a3210c6ca9b8
    AlertAmount:
      type: string
      description: |
        The size of the funds subject to the KYT alert.  
        The value is in USD.
      example: '1820.17'
    CaseSystemId:
      type: string
      description: >
        A unique identifier assigned by Refinitiv to distinguish risk
        assessments.
      example: 5jb7r2c9xjfk1hoc95gfayv6m
    MatchStrength:
      type: string
      enum:
        - WEAK
        - MEDIUM
        - STRONG
        - EXACT
      description: >
        In cases where the risk assessment is successful, the match strength of
        the record with the highest match rate among the personal information
        matches.  

        It is displayed in the order: "WEAK", "MEDIUM", "STRONG", "EXACT".
      example: EXACT
    AggregatedSummaryResult:
      type: string
      description: >
        A summary of the results in cases where the risk assessment is
        successful.
      example: >-
        {"caseId":"69a310e6-810f-4a31-83d1-bcdafccf5304-INCOMING-1684413585757",
        ... }}}
    AssessedAt:
      type: string
      description: |
        Timestamp when the risk assessment results were generated.
      example: '2023-05-18T12:39:57.834Z'
  examples:
    example_RequestUserAccountVerification:
      value:
        originatingVaspId: '15952089931162060684'
        symbol: ETH
        network: Ethereum
        version: '1.0'
        ivms101:
          beneficiary:
            accountNumber:
              - '0x5811001506550d8356a215be229c15b6ef371a9b'
    example_Request_RequestUserVerification:
      summary: example of a verification request
      description: >
        A complete example of a request for user account verification, including
        asset information, originating VASP details, and IVMS101 data.
      value:
        verificationUuid: 4bc03a8f-5679-4358-815c-906aae5557f4
        assetInfo:
          symbol: ETH
          network: Ethereum
          amount: '0.024'
          isExceedingThreshold: true
          tradePrice: '2193200'
          tradeCurrency: KRW
          tradeISODatetime: '2022-02-06T23:13:43.513Z'
        requiredBeneficiaryInfo: ACCOUNT_NUMBER,NATURAL_PERSON_NAME
        originatingVaspId: '123456789098765'
        version: '1.0'
        ivms101:
          originator:
            originatorPersons:
              - naturalPerson:
                  name:
                    nameIdentifier:
                      - primaryIdentifier: James
                        secondaryIdentifier: Din
                        nameIdentifierType: LEGL
            accountNumber:
              - '0x5811001506550d8356a215be229c15b6ef371a9a'
          beneficiary:
            beneficiaryPersons:
              - naturalPerson:
                  name:
                    nameIdentifier:
                      - primaryIdentifier: James
                        nameIdentifierType: LEGL
            accountNumber:
              - '0xb0bFf9721871e22653358956cf59a5FdBF3D752F'
    example_Response_RequestUserVerification:
      summary: example of a successful verification response
      description: >
        A complete example of a successful verification response including
        IVMS101 beneficiary data.
      value:
        result: VERIFIED
        reason: OK
        message: ''
        version: '1.0'
        ivms101:
          beneficiary:
            beneficiaryPersons:
              - naturalPerson:
                  name:
                    nameIdentifier:
                      - primaryIdentifier: James
                        nameIdentifierType: LEGL
                    localNameIdentifier:
                      - primaryIdentifier: 김재원
                        nameIdentifierType: LEGL
                  geographicAddress:
                    - addressType: GEOG
                      townName: Yeoksam-dong
                      addressLine:
                        - 14 Teheran-ro 4-gil, Gangnam-gu
                        - 4th floor
                      country: KR
                  nationalIdentification:
                    nationalIdentifier: 12345-67890
                    nationalIdentifierType: IDCD
                  customerIdentification: '1234569999'
                  dateAndPlaceOfBirth:
                    dateOfBirth: '1985-03-14'
                    placeOfBirth: Nonsan
                  countryOfResidence: KR
            accountNumber:
              - '0xb0bFf9721871e22653358956cf59a5FdBF3D752F'
    example_Request_CheckTransactionStatus:
      value:
        originatingVaspId: '15952089931162060684'
    example_Response_CheckTransactionStatus:
      value:
        originatingVaspId: '15952089931162060684'
        transactionStatus: PROCESSING
        txHash: 8a54d58ca4100112a5430818776d74898f2232770bae03046862575cb851a042
        vout: '2'
    example_Request_Callback:
      value:
        callbackType: VERIFICATION_RESULT
        data:
          verificationUuid: 64ab871b-14a3-47df-9b80-368e29fe8180
          verificationResult: VERIFIED
          reason: OK
          message: ''
          ivms101:
            beneficiary:
              beneficiaryPersons:
                - naturalPerson:
                    name:
                      nameIdentifier:
                        - primaryIdentifier: James
                          nameIdentifierType: LEGL
                      localNameIdentifier:
                        - primaryIdentifier: 김재원
                          nameIdentifierType: LEGL
                    geographicAddress:
                      - addressType: GEOG
                        townName: Yeoksam-dong
                        addressLine:
                          - 14 Teheran-ro 4-gil, Gangnam-gu
                          - 4th floor
                        country: KR
                    nationalIdentification:
                      nationalIdentifier: 12345-67890
                      nationalIdentifierType: IDCD
                    customerIdentification: '1234569999'
                    dateAndPlaceOfBirth:
                      dateOfBirth: '1985-03-14'
                      placeOfBirth: Nonsan
                    countryOfResidence: KR
              accountNumber:
                - '0xb0bFf9721871e22653358956cf59a5FdBF3D752F'
    example_Response_Callback:
      value:
        result: true
    example_Request_GetDecryptedEncKey:
      value:
        inputKey: Y9uIJCLAkzVi2XYZrUDmBYJp3szXlJIUwfLfbLsVeHU=
    example_Response_GetDecryptedEncKey:
      value:
        outputKey: d0odhtb/jD9qWWTA59koPGgw2jj0ptov56A3b3dfohY=
    example_Response_GetVaspId:
      value:
        vaspId: '15952089931162058999'
    example_Response_ListVasp:
      value:
        vasps:
          - health: UP
            vaspId: '27372039731940770'
            vaspName: A Exchange
            legalName: A Exchange
            jurisdiction: Singapore
            isAlliance: true
            country: Singapore
            countryCode: SG
            protocol: VERIFYVASP
            licensedStatus: Regulated
            vaspStatus: VERIFIED-MEMBER
            createdAt: '2021-09-27T01:48:38.000Z'
            updatedAt: '2021-11-09T07:31:54.000Z'
          - health: UP
            vaspId: '27372039731940165'
            vaspName: B Exchange
            legalName: B Exchange
            jurisdiction: The Republic of Korea
            isAlliance: true
            country: The Republic of Korea
            countryCode: KR
            protocol: CODE
            licensedStatus: null
            vaspStatus: INTEROPERATED
            createdAt: '2021-09-27T01:48:38.000Z'
            updatedAt: '2022-01-13T15:27:50.000Z'
