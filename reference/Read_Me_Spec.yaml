  /v1/verifications/account:
    post:
      description: ''
      operationId: enclave_requestUserAccountVerification
      tags:
        - Enclave API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - keyType
                - beneficiaryVaspId
                - symbol
                - payload
              description: description
              properties:
                keyType:
                  type: string
                  enum:
                    - PerVasp
                    - PerAddress
                    - PerVerification
                  description: >
                    The type of Public Key to be used for encrypting personal
                    information.  

                    The default value is **PerVasp**. PerAddress and
                    PerVerification can also be entered.  

                    The Beneficiary VASP must provide the Public Key
                    corresponding to the Key Type specified by the Originating
                    VASP in this field.  
                      
                    Explanation of allowed values:  
                      
                    **PerVasp**: A single key shared across all verifications
                    for a VASP.  

                    **PerAddress**: A unique key is generated for each
                    beneficiary address.  

                    **PerVerification**: A new key is generated for every
                    verification request.
                  example: PerVasp
                beneficiaryVaspId:
                  type: string
                  description: |
                    Unique identifier of Beneficiary VASP.
                  example: '27372039731940770'
                symbol:
                  type: string
                  description: |
                    Symbol of the virtual asset to be transferred.
                  example: ETH
                network:
                  type: string
                  description: >
                    The network of the virtual asset to be transferred.   The
                    network field can be implemented conditionally. Valid values
                    for this field can be found here.  
                      
                    **Conditional Use of 'network' Field:**  
                      When the Beneficiary VASP requires the network field:  
                      If the Originating VASP does not provide a network value in the request, the response will include: result as **DENIED** and reason as **UNKNOWN-NETWORK**.  
                        
                      When the Beneficiary VASP makes the network field optional:  
                      Even if the Originating VASP omits the network value, the Beneficiary VASP can infer the network based on the symbol and return the verification result.
                  example: Ethereum
                payload:
                  type: object
                  required:
                    - version
                    - ivms101
                  description: Description
                  properties:
                    version:
                      type: string
                      description: >
                        The version of the IVMS101 messaging protocol being
                        used.
                      example: '1.0'
                    ivms101:
                      type: object
                      description: >
                        An object with IVMS101-formatted data containing
                        information about the Originator, OriginatingVASP,
                        Beneficiary, and BeneficiaryVASP.
                      required:
                        - beneficiary
                      properties:
                        beneficiary:
                          type: object
                          description: |
                            An object containing Beneficiary information.
                          required:
                            - accountNumber
                          properties:
                            accountNumber:
                              type: array
                              description: |
                                An array containing wallet addresses.
                              items:
                                type: string
            examples:
              requestexamples:
                value:
                  keyType: PerVasp
                  beneficiaryVaspId: '15952089931162060684'
                  symbol: ETH
                  network: Ethereum
                  payload:
                    version: '1.0'
                    ivms101:
                      beneficiary:
                        accountNumber:
                          - '0x5811001506550d8356a215be229c15b6ef371a9b'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                description: Description about this API
                required:
                  - accountVerificationResult
                  - verifiedAt
                properties:
                  accountVerificationResult:
                    type: string
                    enum:
                      - VERIFIED
                      - DENIED
                    description: >
                      Result of User Account Verification:  
                        
                      If the result is **DENIED**, the reason field should
                      provide the specific reason.
                    example: VERIFIED
                  reason:
                    type: string
                    enum:
                      - UNKNOWN-SYMBOL
                      - UNKNOWN-NETWORK
                      - UNKNOWN-ADDRESS
                      - MISMATCHED-NAME
                      - UNDEFINED-ERROR
                      - BLACKLISTED
                      - UNVERIFIED-KYC
                    description: >
                      Error codes indicating the reason for verification
                      failure.
                    example: UNKNOWN-ADDRESS
                  verifiedAt:
                    type: string
                    description: >
                      The timestamp when the verification was completed.  
                        
                      This field must follow the UTC ISO 8601 datetime
                      representation standard.
                        
                      **Recommendations**  
                        
                      To ensure consistency across systems, we strongly
                      recommend using the extended format
                      "YYYY-MM-DDThh:mm:ss.sssZ", which includes milliseconds
                      and clearly specifies the UTC timezone.   Other ISO 8601
                      Acceptable Formats:  
                        - Basic format("YYYYMMDDThhmmss.sssZ")  
                        - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")  

                        
                      **Implementation Note**  
                        
                      While the extended format is recommended, your
                      implementation should account for requests from external
                      VASPs that may use the other two formats. Ensure your
                      system can handle and correctly interpret all three
                      formats to maintain compatibility.
                    example: '2024-11-25T15:30:00.000Z'
              examples:
                successexample:
                  value:
                    vasps:
                      - health: UP
                        vaspId: '27372039731940770'
                        vaspName: A Exchange
                        legalName: A Exchange
                        jurisdiction: Singapore
                        isAlliance: true
