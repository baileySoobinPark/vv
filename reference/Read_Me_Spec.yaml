  /v1/verifications:
    post:
      description: ''
      operationId: enclave_requestUserVerification
      tags:
        - Enclave API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - keyType
                - beneficiaryVaspId
                - assetInfo
                - requiredBeneficiaryInfo
                - payload
              properties:
                keyType:
                  type: string
                  enum:
                    - PerVasp
                    - PerAddress
                    - PerVerification
                  description: >
                    The type of Public Key to be used for encrypting personal
                    information.  

                    The default value is **PerVasp**. PerAddress and
                    PerVerification can also be entered.  

                    The Beneficiary VASP must provide the Public Key
                    corresponding to the Key Type specified by the Originating
                    VASP in this field.  
                      
                    Explanation of allowed values:  
                      
                    **PerVasp**: A single key shared across all verifications
                    for a VASP.  

                    **PerAddress**: A unique key is generated for each
                    beneficiary address.  

                    **PerVerification**: A new key is generated for every
                    verification request.
                  example: PerVasp
                beneficiaryVaspId:
                  type: string
                  description: |
                    Unique identifier of Beneficiary VASP.
                  example: '27372039731940770'
                assetInfo:
                  type: object
                  required:
                    - symbol
                    - amount
                    - isExceedingThreshold
                    - tradePrice
                    - tradeCurrency
                    - tradeISODateTime
                  description: Asset information
                  properties:
                    symbol:
                      type: string
                      description: |
                        Symbol of the virtual asset to be transferred.
                      example: ETH
                    network:
                      type: string
                      description: >
                        The network of the virtual asset to be transferred.  
                        The network field can be implemented conditionally.
                        Valid values for this field can be found here.  
                          
                        **Conditional Use of 'network' Field:**  
                          When the Beneficiary VASP requires the network field:  
                          If the Originating VASP does not provide a network value in the request, the response will include: result as **DENIED** and reason as **UNKNOWN-NETWORK**.  
                            
                          When the Beneficiary VASP makes the network field optional:  
                          Even if the Originating VASP omits the network value, the Beneficiary VASP can infer the network based on the symbol and return the verification result.
                      example: Ethereum
                    amount:
                      type: string
                      description: |
                        The amount of the virtual asset to be transferred.
                      example: '0.024'
                    isExceedingThreshold:
                      type: boolean
                      description: >
                        A boolean field to check whether the fiat-converted
                        amount of the virtual asset to be transferred exceeds
                        the legal threshold.   If the value is false, User
                        Verification for the transaction is not mandatory.  
                        (Legal threshold: 1,000 USD or 1,000,000 KRW.)
                      example: true
                    tradePrice:
                      type: string
                      description: >
                        The amount of virtual assets to be transferred,
                        converted into fiat currency.
                      example: '2439800'
                    tradeCurrency:
                      type: string
                      description: >
                        The code of the fiat currency into which the virtual
                        asset is converted.
                      example: KRW
                    tradeISODateTime:
                      type: string
                      description: >
                        The timestamp used as the exchange rate reference when
                        converting the virtual asset to fiat currency.   This
                        field must follow the UTC ISO 8601 datetime
                        representation standard.  
                          
                        **Recommendations**  
                          
                        To ensure consistency across systems, we strongly
                        recommend using the extended format
                        "YYYY-MM-DDThh:mm:ss.sssZ", which includes milliseconds
                        and clearly specifies the UTC timezone.   Other ISO 8601
                        Acceptable Formats:  
                          - Basic format("YYYYMMDDThhmmss.sssZ")    
                          - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")    

                          
                        **Implementation Note**  
                          
                        While the extended format is recommended, your
                        implementation should account for requests from external
                        VASPs that may use the other two formats. Ensure your
                        system can handle and correctly interpret all three
                        formats to maintain compatibility.
                      example: '2024-11-25T15:30:00.000Z'
                requiredBeneficiaryInfo:
                  type: string
                  description: >
                    The list of personal information codes required by the
                    Originating VASP to verify the Beneficiary.   The
                    Beneficiary VASP must return the requested Beneficiary
                    personal information using the provided personal information
                    codes in the IVMS101 format.
                  example: NATURAL_PERSON_NAME,ACCOUNT_NUMBER
                payload:
                  type: object
                  required:
                    - version
                    - ivms101
                  description: Input Description
                  properties:
                    version:
                      type: string
                      description: >
                        The version of the IVMS101 messaging protocol being
                        used.
                      example: '1.0'
                    ivms101:
                      type: object
                      description: >
                        An object with IVMS101-formatted data that may include
                        information about the Originator, Originating VASP,
                        Beneficiary, and Beneficiary VASP for sending the
                        request.
                      required:
                        - originator
                        - beneficiary
                      properties:
                        originator:
                          type: object
                          required:
                            - originatorPersons
                            - accountNumber
                          description: |
                            An object containing the Originator information.
                          properties:
                            originatorPersons:
                              type: array
                              description: >
                                An array containing the Originator's personal
                                information.
                              items:
                                type: object
                                required:
                                  - naturalPerson
                                description: >
                                  An object containing details about the natural
                                  person.
                                properties:
                                  naturalPerson:
                                    type: object
                                    required:
                                      - name
                                    description: >
                                      An object containing details about the
                                      natural person.
                                    properties:
                                      name:
                                        type: object
                                        required:
                                          - nameIdentifier
                                        description: |
                                          An object with name details.
                                        properties:
                                          nameIdentifier:
                                            type: array
                                            description: >-
                                              An array containing the name
                                              information.
                                            items:
                                              type: object
                                              required:
                                                - primaryIdentifier
                                                - nameIdentifierType
                                              properties:
                                                primaryIdentifier:
                                                  type: string
                                                  description: >
                                                    The basic representation of a last
                                                    name.   By default, this field is used
                                                    to enter the last name. However, if
                                                    separating the last name and first name
                                                    is not feasible, the full name can be
                                                    entered in this field.
                                                  example: James
                                                secondaryIdentifier:
                                                  type: string
                                                  description: >
                                                    The basic representation of a first
                                                    name.   This field is primarily used to
                                                    enter the first name. If a middle name
                                                    also needs to be included, it can be
                                                    combined with the first name in this
                                                    field.
                                                  example: James || Jeffry James
                                                nameIdentifierType:
                                                  type: string
                                                  enum:
                                                    - ALIA
                                                    - BIRT
                                                    - MAID
                                                    - LEGL
                                                    - MISC
                                                  description: >
                                                    The type of name identifier.  
                                                      
                                                    Refer to the details below for
                                                    information about each type of name
                                                    identifier:   The following values can
                                                    be included:  
                                                      **ALIA**: An alias name, commonly known apart from the legal name.  

                                                      **BIRT**: A birth name.  

                                                      **MAID**: The original name used before a surname change due to marriage.  

                                                      **LEGL**: A legally or officially registered name.  

                                                      **MISC**: Other names that do not fall under the above categories.
                                              example: LEGL
                            accountNumber:
                              type: array
                              description: |
                                An array containing wallet addresses.
                              items:
                                type: string
                        beneficiary:
                          type: object
                          description: |
                            An object containing Beneficiary information.
                          required:
                            - beneficiaryPersons
                            - accountNumber
                          properties:
                            beneficiaryPersons:
                              type: array
                              description: >
