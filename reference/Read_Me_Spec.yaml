        example: Bearer <VEGA_VERIFICATION_AUTHORIZATION_TOKEN>
    Path_Uuid:
      name: uuid
      in: path
      required: true
      schema:
        type: string
        description: >
          Unique identifier of User Verification.   The format of **uuid** must
          follow UUID V4 standard.
        example: 4615aa9d-ac64-4997-a9e6-0e772c57c7ef
    Params_Protocol:
      name: protocol
      in: query
      schema:
        type: string
        enum:
          - VERIFYVASP
          - CODE
          - ALL
        description: >
          Name of the protocol.   "VERIFYVASP", "CODE", "ALL" can input in this
          field, Default is "ALL".
        example: VERIFYVASP
    Params_FromDate:
      name: fromDate
      in: query
      schema:
        type: string
        description: >
          The start date for querying a specific point in time.   The format of
          formDate must follow ISO 8601(YYYY-MM-DD) standard.
        example: '2022-01-01'
    Params_ToDate:
      name: toDate
      in: query
      schema:
        type: string
        description: >
          The end date for querying a specific point in time.   The format of
          toDate must follow ISO 8601(YYYY-MM-DD) standard.
