  /v1/verifications/tx:
    post:
      summary: Report Transaction Result API
      tags:
        - Enclave API
      operationId: travelrule-enclave-report-Transaction-Result
      x-readme:
        explorer-enabled: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - verificationUuid
                - txHash
              properties:
                verificationUuid:
                  type: string
                  description: >
                    A unique identifier for the User Verification request.  

                    The format of **verificationUuid** must follow the UUID v4
                    standard.
                  example: 4bc03a8f-5679-4358-815c-906aae5557f4
                txHash:
                  type: string
                  description: |
                    Unique identifier of the transaction.
                  example: >-
                    8a54d58ca4100112a5430818776d74898f2232770bae03046862575cb851a042
                vout:
                  type: string
                  description: |
                    Index of the output in a Bitcoin blockchain transaction.
                  example: '2'
            examples:
              requestexamples:
                value:
                  verificationUuid: 8557f2b2-985e-431f-8d52-75c2e5a01e46
                  txHash: >-
                    8a54d58ca4100112a5430818776d74898f2232770bae03046862575cb851a042
                  vout: '2'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    type: boolean
                    description: |
                      A boolean indicating the verification result.  
                        
                      true represents that the result is **VERIFIED**.
                    example: true
              examples:
                Successful Example:
                  value:
                    result: true
        '400':
          description: Error Response of Transaction Result Report API
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      400 Error message.  

                      - Invalid input parameters - Missing Required Parameters -
                      Inactive VASP
                    example: MISSING-VERIFICATION-UUID
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in code
                    example: verificationUuid is required.
              examples:
                Missing Mandatory Field Example:
                  value:
                    code: MISSING-VERIFICATION-UUID
                    message: '`verificationUuid` is required.'
                Invalid Verification UUID Example:
                  value:
                    code: VERIFICATION-NOT-FOUND
                    message: >-
                      Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not
                      found
