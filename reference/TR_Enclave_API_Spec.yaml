                        - assetInfo
                        - txHash
                        - originatingVaspId
                        - originatorAccountNumber
                        - ivms101Originator
                        - ivms101OriginatingVasp
                        - beneficiaryVaspId
                        - beneficiaryAccountNumber
                        - ivms101Beneficiary
                        - ivms101BeneficiaryVasp
                        - verifiedAt
                        - orderedAt
                        - createdAt
