openapi: 3.0.1
info:
  title: TR Integration Steps
  version: '1.0'
  description: Management of VerifyVASP API Spec.
servers:
  - url: https://<enclave-endpoint>
paths:
  /v1/vasps/self:
    get:
      summary: Get VASP ID API
      tags:
        - Enclave API
      description: Get VASP ID API
      operationId: travelrule-get-Vasp-Id
      x-readme:
        explorer-enabled: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - vaspId
                properties:
                  vaspId:
                    type: string
                    description: |
                      Unique identifier of VASP.
                    example: '15952089931162060684'
              examples:
                Successful Example:
                  value:
                    vaspId: '15952089931162058999'
  /v1/vasps:
    get:
      summary: List VASP API
      tags:
        - Enclave API
      operationId: travelrule-list-Vasp-ids
      x-readme:
        explorer-enabled: false
      parameters:
        - name: protocol
          in: query
          schema:
            type: string
            enum:
              - VERIFYVASP
              - CODE
              - ALL
            description: >
              Name of the protocol.   "VERIFYVASP", "CODE", "ALL" can input in
              this field, Default is "ALL".
            example: VERIFYVASP
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                description: Description about this API
                required:
                  - vasps
                properties:
                  vasps:
                    type: array
                    items:
                      type: object
                      description: description
                      required:
                        - health
                        - vaspId
                        - vaspName
                        - protocol
                        - vaspStatus
                        - createdAt
                        - updatedAt
                      properties:
                        health:
                          type: string
                          enum:
                            - UP
                            - DOWN
                          description: >
                            Current operational health status of the VASP
                            Enclave server.
                          example: UP
                        vaspId:
                          type: string
                          description: |
                            Unique identifier of VASP.
                          example: '15952089931162060684'
                        vaspName:
                          type: string
                          description: |
                            The name of VASP.
                          example: A Exchange
                        legalName:
                          type: string
                          description: |
                            The legal entity name of the VASP.
                          example: A Exchange
                        jurisdiction:
                          type: string
                          description: >
                            The country or region where the legal entity is
                            incorporated (jurisdiction of incorporation).
                          example: Singapore
                        isAlliance:
                          type: boolean
                          description: >
                            A boolean field indicating whether the entity is a
                            member of VerifyVASP.
                          example: true
                        country:
                          type: string
                          description: >
                            The name of the country where the VASP is
                            incorporated.
                          example: Singapore
                        countryCode:
                          type: string
                          description: >
                            The ISO 3166-1 alpha-2 code of the country where the
                            VASP is incorporated.
                          example: SG
                        protocol:
                          type: string
                          enum:
                            - VERIFYVASP
                            - CODE
                          description: >
                            The Travel Rule Protocol used by the VASP.   Allowed
                            values:  
                              1. VERIFYVASP: Indicates that the VASP is a member of VerifyVASP.  
                              2. CODE: Indicates that the VASP is a member of CODE.
                          example: VERIFYVASP
                        licensedStatus:
                          type: string
                          enum:
                            - Regulated
                            - Unregulated
                          description: |
                            The VA License acquisition status of the VASP.
                          example: Regulated
                        vaspStatus:
                          type: string
                          enum:
                            - UNVERIFIED
                            - VERIFIED
                            - VERIFIED-MEMBER
                            - INTEROPERATED
                          description: >
                            The status of the VASP on VerifyVASP.   Allowed
                            values:  
                              **VERIFIED-MEMBER**: A member of the VerifyVASP Alliance with the Enclave server properly running, enabling transactions.  

                              **VERIFIED**: Registered with VerifyVASP but not approved as an Alliance member, or an Alliance member without an installed Enclave server. 

                              **UNVERIFIED**: Not registered with VerifyVASP.  

                              **INTEROPERATED**: A member of another Travel Rule Protocol.
                          example: VERIFIED-MEMBER
                        createdAt:
                          type: string
                          description: >
                            Timestamp of the VASP Information creation. This
                            field must follow the UTC ISO 8601 datetime
                            representation standard.  
                              
                            **Recommendations**:   To ensure consistency across
                            systems, we strongly recommend using the extended
                            format "YYYY-MM-DDThh:mm:ss.sssZ", which includes
                            milliseconds and clearly specifies the UTC
                            timezone.  
                              
                            Other ISO 8601 Acceptable Formats:  
                              - Basic format("YYYYMMDDThhmmss.sssZ")  
                              - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")
                          example: '2024-11-25T15:30:00.000Z'
                        updatedAt:
                          type: string
                          description: >
                            Timestamp of the last update to the VASP
                            Information. This field must follow the UTC ISO 8601
                            datetime representation standard.  
                              
                            **Recommendations**:   To ensure consistency across
                            systems, we strongly recommend using the extended
                            format "YYYY-MM-DDThh:mm:ss.sssZ", which includes
                            milliseconds and clearly specifies the UTC
                            timezone.  
                              
                            Other ISO 8601 Acceptable Formats:
                              - Basic format("YYYYMMDDThhmmss.sssZ")  
                              - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")
                          example: '2024-11-25T15:30:00.000Z'
              examples:
                Successful Example:
                  value:
                    vasps:
                      - health: UP
                        vaspId: '27372039731940770'
                        vaspName: A Exchange
                        legalName: A Exchange
                        jurisdiction: Singapore
                        isAlliance: true
                        country: Singapore
                        countryCode: SG
                        protocol: VERIFYVASP
                        licensedStatus: Regulated
                        vaspStatus: VERIFIED-MEMBER
                        createdAt: '2021-09-27T01:48:38.000Z'
                        updatedAt: '2021-11-09T07:31:54.000Z'
                      - health: UP
                        vaspId: '27372039731940165'
                        vaspName: B Exchange
                        legalName: B Exchange
                        jurisdiction: The Republic of Korea
                        isAlliance: true
                        country: The Republic of Korea
                        countryCode: KR
                        protocol: CODE
                        licensedStatus: null
                        vaspStatus: INTEROPERATED
                        createdAt: '2021-09-27T01:48:38.000Z'
                        updatedAt: '2022-01-13T15:27:50.000Z'
  /v1/verifications/account:
    post:
      summary: Request User Account Verification API
      tags:
        - Enclave API
      operationId: travelrule-Enclave-User-Account-Verification
      x-readme:
        explorer-enabled: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - keyType
                - beneficiaryVaspId
                - symbol
                - payload
              description: description
              properties:
                keyType:
                  type: string
                  enum:
                    - PerVasp
                    - PerAddress
                    - PerVerification
                  description: >
                    The type of Public Key to be used for encrypting personal
                    information.  

                    The default value is **PerVasp**. `PerAddress` and
                    `PerVerification` can also be entered.  

                    The Beneficiary VASP must provide the Public Key
                    corresponding to the Key Type specified by the Originating
                    VASP in this field.  
                      
                    Explanation of allowed values:  
                      
                    **PerVasp**: A single key shared across all verifications
                    for a VASP.  

                    **PerAddress**: A unique key is generated for each
                    beneficiary address.  

                    **PerVerification**: A new key is generated for every
                    verification request.
                  example: PerVasp
                beneficiaryVaspId:
                  type: string
                  description: |
                    Unique identifier of Beneficiary VASP.
                  example: '27372039731940770'
                symbol:
                  type: string
                  description: |
                    Symbol of the virtual asset.
                  example: ETH
                network:
                  type: string
                  description: >
                    The network of the virtual asset.   The network field can be
                    implemented conditionally. 
                      
                    **Conditional Use of 'network' Field:**  
                      1. If the network field is required by the Beneficiary VASP:  
                      If the Originating VASP does not provide a network value in the request, it could be returned as **DENIED** and **UNKNOWN-NETWORK**.  
                        
                      2. If the network field is optional by the Beneficiary VASP:  
                      if the Originating VASP omits the network value, the Beneficiary VASP can infer the network based on the symbol and return the verification result.
                  example: Ethereum
                payload:
                  type: object
                  required:
                    - version
                    - ivms101
                  description: Description
                  properties:
                    version:
                      type: string
                      description: >
                        The version of the IVMS101 messaging protocol being
                        used.
                      example: '1.0'
                    ivms101:
                      type: object
                      description: >
                        An object with IVMS101-formatted data containing
                        information about the Originator, OriginatingVASP,
                        Beneficiary, and BeneficiaryVASP.
                      required:
                        - beneficiary
                      properties:
                        beneficiary:
                          type: object
                          description: |
                            An object containing Beneficiary information.
                          required:
                            - accountNumber
                          properties:
                            accountNumber:
                              type: array
                              description: |
                                An array containing wallet addresses.
                              items:
                                type: string
            examples:
              requestexamples:
                value:
                  keyType: PerVasp
                  beneficiaryVaspId: '15952089931162060684'
                  symbol: ETH
                  network: Ethereum
                  payload:
                    version: '1.0'
                    ivms101:
                      beneficiary:
                        accountNumber:
                          - '0x5811001506550d8356a215be229c15b6ef371a9b'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                description: Description about this API
                required:
                  - accountVerificationResult
                  - verifiedAt
                properties:
                  accountVerificationResult:
                    type: string
                    enum:
                      - VERIFIED
                      - DENIED
                    description: >
                      Result of User Account Verification:  

                      If the result is **DENIED**, the reason field should
                      provide the specific reason.
                    example: VERIFIED
                  reason:
                    type: string
                    enum:
                      - UNKNOWN-SYMBOL
                      - UNKNOWN-NETWORK
                      - UNKNOWN-ADDRESS
                      - MISMATCHED-NAME
                      - UNDEFINED-ERROR
                      - BLACKLISTED
                      - UNVERIFIED-KYC
                    description: |
                      This field provides the reason for verification failure.
                    example: UNKNOWN-ADDRESS
                  verifiedAt:
                    type: string
                    description: >
                      The timestamp when the verification was completed.  
                        
                      This field must follow the UTC ISO 8601 datetime
                      representation standard.
                        
                      **Recommendations**  
                        
                      To ensure consistency across systems, we strongly
                      recommend using the extended format
                      "YYYY-MM-DDThh:mm:ss.sssZ", which includes milliseconds
                      and clearly specifies the UTC timezone.   Other ISO 8601
                      Acceptable Formats:  
                        - Basic format("YYYYMMDDThhmmss.sssZ")  
                        - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")
                    example: '2024-11-25T15:30:00.000Z'
              examples:
                Verified Example:
                  value:
                    accountVerificationResult: DENIED
                    reason: UNKNOWN-ADDRESS
                    verifiedAt: '2022-03-03T12:45:34.085Z'
                Unknown Symbol Example:
                  value:
                    accountVerificationResult: DENIED
                    reason: UNKNOWN-SYMBOL
                    verifiedAt: '2022-03-03T12:45:34.085Z'
                Unknown Network Example:
                  value:
                    accountVerificationResult: DENIED
                    reason: UNKNOWN-NETWORK
                    message: '`network` is necessary'
                    verifiedAt: '2022-03-03T12:45:34.085Z'
                Unknown Address Example:
                  value:
                    accountVerificationResult: DENIED
                    reason: UNKNOWN-ADDRESS
                    verifiedAt: '2022-03-03T12:45:34.085Z'
                Mismatched Name Example:
                  value:
                    accountVerificationResult: DENIED
                    reason: MISMATCHED-NAME
                    verifiedAt: '2022-03-03T12:45:34.085Z'
        '400':
          description: Error Response of Verification Account API
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      400 Error message.  

                      - Invalid input parameters - Missing Required Parameters -
                      Inactive VASP
                    example: MISSING-VERIFICATION-UUID
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in code
                    example: verificationUuid is required.
              examples:
                Missing Mandatory Field Example:
                  value:
                    code: MISSING-VASP
                    message: '`beneficiaryVaspId` is required.'
                Invalid Parameter Example:
                  value:
                    code: INVALID-KEY-TYPE
                    message: '`keyType` is invalid value.'
                Non Alliance Member Example:
                  value:
                    code: ALLIANCE-NOT-FOUND
                    message: Alliance is not found in given vendor
                Inactive Vasp Example:
                  value:
                    code: ALLIANCE-NOT-ACTIVE
                    message: Alliance is not active now
        '404':
          description: 404 Resource Not Found Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      404 Error message.  

                      It could be returned in the following cases:   - When
                      request with a non-existent resources is provided.
                    example: VERIFICATION-NOT-FOUND
                  message:
                    type: string
                    description: >
                      Explanation about the error that is returned in the code
                      field.
                    example: >-
                      Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not
                      found
              examples:
                404 Error Example:
                  value:
                    code: VERIFICATION-NOT-FOUND
                    message: >-
                      Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not
                      found
        '408':
          description: 408 Request Timeout Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      408 Error message.  

                      It could be returned in the following cases:   When a
                      timeout occurs during the processing of a request.
                    example: REQUEST-TIMEOUT
                  message:
                    type: string
                    description: >
                      Explanation about the error that is returned in the code
                      field.
                    example: timeout of 5000ms exceeded
              examples:
                408 Error Example:
                  value:
                    code: REQUEST-TIMEOUT
                    message: timeout of 5000ms exceeded
  /v1/verifications:
    post:
      summary: Request User Verification API
      tags:
        - Enclave API
      operationId: travelrule-encalve-request-User-Verification
      x-readme:
        explorer-enabled: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - keyType
                - beneficiaryVaspId
                - assetInfo
                - requiredBeneficiaryInfo
                - payload
              properties:
                keyType:
                  type: string
                  enum:
                    - PerVasp
                    - PerAddress
                    - PerVerification
                  description: >
                    The type of Public Key to be used for encrypting personal
                    information.  

                    The default value is **PerVasp**. `PerAddress` and
                    `PerVerification` can also be entered.  

                    The Beneficiary VASP must provide the Public Key
                    corresponding to the Key Type specified by the Originating
                    VASP in this field.  
                      
                    Explanation of allowed values:  
                      
                    **PerVasp**: A single key shared across all verifications
                    for a VASP.  

                    **PerAddress**: A unique key is generated for each
                    beneficiary address.  

                    **PerVerification**: A new key is generated for every
                    verification request.
                  example: PerVasp
                beneficiaryVaspId:
                  type: string
                  description: |
                    Unique identifier of Beneficiary VASP.
                  example: '27372039731940770'
                assetInfo:
                  type: object
                  required:
                    - symbol
                    - amount
                    - isExceedingThreshold
                    - tradePrice
                    - tradeCurrency
                    - tradeISODateTime
                  description: The object of asset information
                  properties:
                    symbol:
                      type: string
                      description: |
                        Symbol of the virtual asset.
                      example: ETH
                    network:
                      type: string
                      description: >
                        The network of the virtual asset.   The network field
                        can be implemented conditionally. 
                          
                        **Conditional Use of 'network' Field:**  
                          1. If the network field is required by the Beneficiary VASP:  
                          If the Originating VASP does not provide a network value in the request, it could be returned as **DENIED** and **UNKNOWN-NETWORK**.  
                            
                          2. If the network field is optional by the Beneficiary VASP:  
                          if the Originating VASP omits the network value, the Beneficiary VASP can infer the network based on the symbol and return the verification result.
                      example: Ethereum
                    amount:
                      type: string
                      description: |
                        The amount of the virtual asset to be transferred.
                      example: '0.024'
                    isExceedingThreshold:
                      type: boolean
                      description: >
                        A boolean field to check whether the fiat-converted
                        amount of the virtual asset to be transferred exceeds
                        the legal threshold.  

                        If the value is false, User Verification for the
                        transaction is not mandatory.   (Legal threshold: 1,000
                        USD or 1,000,000 KRW.)
                      example: true
                    tradePrice:
                      type: string
                      description: >
                        The amount of virtual assets to be transferred,
                        converted into fiat currency.
                      example: '2439800'
                    tradeCurrency:
                      type: string
                      description: >
                        The code of the fiat currency into which the virtual
                        asset is converted.
                      example: KRW
                    tradeISODateTime:
                      type: string
                      description: >
                        The timestamp used as the exchange rate reference when
                        converting the virtual asset to fiat currency.   This
                        field must follow the UTC ISO 8601 datetime
                        representation standard.  
                          
                        **Recommendations**  
                          
                        To ensure consistency across systems, we strongly
                        recommend using the extended format
                        "YYYY-MM-DDThh:mm:ss.sssZ", which includes milliseconds
                        and clearly specifies the UTC timezone.   Other ISO 8601
                        Acceptable Formats:  
                          - Basic format("YYYYMMDDThhmmss.sssZ")    
                          - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")
                      example: '2024-11-25T15:30:00.000Z'
                requiredBeneficiaryInfo:
                  type: string
                  description: >
                    The list of personal information codes required by the
                    Originating VASP to verify the Beneficiary.  

                    The Beneficiary VASP must return the requested Beneficiary
                    personal information using the provided personal information
                    codes in the IVMS101 format.
                  example: NATURAL_PERSON_NAME,ACCOUNT_NUMBER
                payload:
                  type: object
                  required:
                    - version
                    - ivms101
                  description: Input Description
                  properties:
                    version:
                      type: string
                      description: >
                        The version of the IVMS101 messaging protocol being
                        used.
                      example: '1.0'
                    ivms101:
                      type: object
                      description: >
                        An object with IVMS101-formatted data that may include
                        information about the Originator, Originating VASP,
                        Beneficiary, and Beneficiary VASP for sending the
                        request.
                      required:
                        - originator
                        - beneficiary
                      properties:
                        originator:
                          type: object
                          required:
                            - originatorPersons
                            - accountNumber
                          description: |
                            An object containing the Originator information.
                          properties:
                            originatorPersons:
                              type: array
                              description: >
                                An array containing the Originator's personal
                                information.
                              items:
                                type: object
                                required:
                                  - naturalPerson
                                description: >
                                  An object containing details about the natural
                                  person.
                                properties:
                                  naturalPerson:
                                    type: object
                                    required:
                                      - name
                                    description: >
                                      An object containing details about the
                                      natural person.
                                    properties:
                                      name:
                                        type: object
                                        required:
                                          - nameIdentifier
                                        description: |
                                          An object with name details.
                                        properties:
                                          nameIdentifier:
                                            type: array
                                            description: >-
                                              An array containing the name
                                              information.
                                            items:
                                              type: object
                                              required:
                                                - primaryIdentifier
                                                - nameIdentifierType
                                              properties:
                                                primaryIdentifier:
                                                  type: string
                                                  description: >
                                                    The basic representation of a last
                                                    name.  

                                                    By default, this field is used to enter
                                                    the last name. However, if separating
                                                    the last name and first name is not
                                                    feasible, the full name can be entered
                                                    in this field.
                                                  example: James
                                                secondaryIdentifier:
                                                  type: string
                                                  description: >
                                                    The basic representation of a first
                                                    name.  

                                                    This field is primarily used to enter
                                                    the first name. If a middle name also
                                                    needs to be included, it can be combined
                                                    with the first name in this field.
                                                  example: James || Jeffry James
                                                nameIdentifierType:
                                                  type: string
                                                  enum:
                                                    - ALIA
                                                    - BIRT
                                                    - MAID
                                                    - LEGL
                                                    - MISC
                                                  description: >
                                                    The type of name identifier.  
                                                      
                                                    Refer to the details below for
                                                    information about each type of name
                                                    identifier:   The following values can
                                                    be included:  
                                                      **ALIA**: An alias name, commonly known apart from the legal name.  

                                                      **BIRT**: A birth name.  

                                                      **MAID**: The original name used before a surname change due to marriage.  

                                                      **LEGL**: A legally or officially registered name.  

                                                      **MISC**: Other names that do not fall under the above categories.
                                              example: LEGL
                            accountNumber:
                              type: array
                              description: |
                                An array containing wallet addresses.
                              items:
                                type: string
                        beneficiary:
                          type: object
                          description: |
                            An object containing Beneficiary information.
                          required:
                            - beneficiaryPersons
                            - accountNumber
                          properties:
                            beneficiaryPersons:
                              type: array
                              description: >
                                An array for personal information of
                                Beneficiary.  
                                  
                                Name, address, etc. information for individuals
                                or corporations are included.
                              items:
                                type: object
                                required:
                                  - naturalPerson
                                description: >
                                  An object containing details about the natural
                                  person.
                                properties:
                                  naturalPerson:
                                    type: object
                                    required:
                                      - name
                                    description: >
                                      An object containing details about the
                                      natural person.
                                    properties:
                                      name:
                                        type: object
                                        required:
                                          - nameIdentifier
                                        description: |
                                          An object with name details.
                                        properties:
                                          nameIdentifier:
                                            type: array
                                            description: >-
                                              An array containing the name
                                              information.
                                            items:
                                              type: object
                                              required:
                                                - primaryIdentifier
                                                - nameIdentifierType
                                              properties:
                                                primaryIdentifier:
                                                  type: string
                                                  description: >
                                                    The basic representation of a last
                                                    name.  

                                                    By default, this field is used to enter
                                                    the last name. However, if separating
                                                    the last name and first name is not
                                                    feasible, the full name can be entered
                                                    in this field.
                                                  example: James
                                                secondaryIdentifier:
                                                  type: string
                                                  description: >
                                                    The basic representation of a first
                                                    name.  

                                                    This field is primarily used to enter
                                                    the first name. If a middle name also
                                                    needs to be included, it can be combined
                                                    with the first name in this field.
                                                  example: James || Jeffry James
                                                nameIdentifierType:
                                                  type: string
                                                  enum:
                                                    - ALIA
                                                    - BIRT
                                                    - MAID
                                                    - LEGL
                                                    - MISC
                                                  description: >
                                                    The type of name identifier.  
                                                      
                                                    Refer to the details below for
                                                    information about each type of name
                                                    identifier:   The following values can
                                                    be included:  
                                                      **ALIA**: An alias name, commonly known apart from the legal name.  

                                                      **BIRT**: A birth name.  

                                                      **MAID**: The original name used before a surname change due to marriage.  

                                                      **LEGL**: A legally or officially registered name.  

                                                      **MISC**: Other names that do not fall under the above categories.
                                              example: LEGL
                            accountNumber:
                              type: array
                              description: |
                                An array containing wallet addresses.
                              items:
                                type: string
            examples:
              requestexamples:
                summary: example of a verification request
                description: >
                  A complete example of a request for user account verification,
                  including asset information, originating VASP details, and
                  IVMS101 data.
                value:
                  keyType: PreVasp
                  beneficiaryVaspId: '15952089931162060684'
                  assetInfo:
                    symbol: ETH
                    network: Ethereum
                    amount: '0.024'
                    isExceedingThreshold: true
                    tradePrice: '2193200'
                    tradeCurrency: KRW
                    tradeISODatetime: '2022-02-06T23:13:43.513Z'
                  requiredBeneficiaryInfo: ACCOUNT_NUMBER,NATURAL_PERSON_NAME
                  originatingVaspId: '123456789098765'
                  payload:
                    version: '1.0'
                    ivms101:
                      originator:
                        originatorPersons:
                          - naturalPerson:
                              name:
                                nameIdentifier:
                                  - primaryIdentifier: James
                                    secondaryIdentifier: Din
                                    nameIdentifierType: LEGL
                        accountNumber:
                          - '0x5811001506550d8356a215be229c15b6ef371a9a'
                      beneficiary:
                        beneficiaryPersons:
                          - naturalPerson:
                              name:
