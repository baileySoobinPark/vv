    post:
      summary: Check Transaction Status API
      tags:
        - Enclave API
      operationId: travelrule-enclave-check-Transaction-Status
      x-readme:
        explorer-enabled: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - verificationUuid
              properties:
                verificationUuid:
                  type: string
                  description: >
                    A unique identifier for the User Verification request.  

                    The format of **verificationUuid** must follow the UUID v4
                    standard.
                  example: 4bc03a8f-5679-4358-815c-906aae5557f4
            examples:
              requestexamples:
                value:
                  verificationUuid: 8557f2b2-985e-431f-8d52-75c2e5a01e46
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - verificationUuid
                  - transactionStatus
                properties:
                  verificationUuid:
                    type: string
                    description: >
                      A unique identifier for the User Verification request.  

                      The format of **verificationUuid** must follow the UUID v4
                      standard.
                    example: 4bc03a8f-5679-4358-815c-906aae5557f4
                  transactionStatus:
                    type: string
                    enum:
                      - PENDING
                      - PROCESSING
                      - WAIT-CONFIRM
                      - CONFIRMED
                      - CANCELED
                    description: |
                      Current status of the virtual asset transaction.  
                        
                      Details of each state:  
                        **PENDING**: The Originating VASP has not yet executed the virtual asset transaction.  
                        
                        **PROCESSING**:The virtual asset transaction has been initiated and is awaiting mining.  
                                      
                        **WAIT-CONFIR**: The transaction has been mined but the block containing it has not achieved finality.  
                        
                        **CONFIRMED**: The virtual asset transaction has been mined, and the block containing the transaction has achieved finality.  
                        
                        **CANCELED**: The Originating VASP has permanently canceled the transaction for a specific reason.
                    example: PROCESSING
                  txHash:
                    type: string
                    description: |
                      Unique identifier of the transaction.
                    example: >-
                      8a54d58ca4100112a5430818776d74898f2232770bae03046862575cb851a042
                  vout:
                    type: string
                    description: |
                      Index of the output in a Bitcoin blockchain transaction.
                    example: '2'
              examples:
                Successful Example:
                  value:
                    verificationUuid: 8557f2b2-985e-431f-8d52-75c2e5a01e46
                    transactionStatus: PROCESSING
                    txHash: >-
                      8a54d58ca4100112a5430818776d74898f2232770bae03046862575cb851a042
                    vout: '2'
        '400':
          description: Error Response of Check Transaction Status API
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      400 Error message.  

                      - Invalid input parameters - Missing Required Parameters -
                      Inactive VASP
                    example: MISSING-VERIFICATION-UUID
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in code
                    example: verificationUuid is required.
              examples:
                Missing Mandatory Field Example:
                  value:
                    code: MISSING-VERIFICATION-UUID
                    message: '`verificationUuid` is required.'
                Invalid Verification UUID Example:
                  value:
                    code: VERIFICATION-NOT-FOUND
                    message: >-
                      Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not
                      found
                Mismatched VASP Example:
                  value:
                    code: VASP-NOT-MATCHED
                    message: You are not the beneficiary VASP for the verification
