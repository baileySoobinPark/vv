    get:
      summary: List Verification Result API
      tags:
        - Enclave API
      operationId: travelrule-enclave-list-Verification-Result
      x-readme:
        explorer-enabled: false
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            description: >
              The start date for querying a specific point in time.   The format
              of formDate must follow ISO 8601(YYYY-MM-DD) standard.
            example: '2022-01-01'
        - name: toDate
          in: query
          schema:
            type: string
            description: >
              The end date for querying a specific point in time.   The format
              of toDate must follow ISO 8601(YYYY-MM-DD) standard.
            example: '2011-01-15'
        - name: symbol
          in: query
          schema:
            type: string
            description: |
              Symbol of the virtual asset.
            example: ETH
        - name: network
          in: query
          schema:
            type: string
            description: >
              The network of the virtual asset.   The network field can be
              implemented conditionally. 
                
              **Conditional Use of 'network' Field:**  
                1. If the network field is required by the Beneficiary VASP:  
                If the Originating VASP does not provide a network value in the request, it could be returned as **DENIED** and **UNKNOWN-NETWORK**.  
                  
                2. If the network field is optional by the Beneficiary VASP:  
                if the Originating VASP omits the network value, the Beneficiary VASP can infer the network based on the symbol and return the verification result.
            example: Ethereum
        - name: txHash
          in: query
          schema:
            type: string
            description: |
              Unique identifier of the transaction.
            example: 8a54d58ca4100112a5430818776d74898f2232770bae03046862575cb851a042
        - name: result
          in: query
          schema:
            type: string
            enum:
              - VERIFIED
              - DENIED
              - ERROR
            description: |
              Result of User Account Verification or User Verification.
            example: VERIFIED
        - name: actionType
          in: query
          schema:
            type: string
            enum:
              - SEND
              - RECEIVE
            description: >
              A field that defines the transaction action of the VASP.   When
              the VASP sends virtual assets, the value is set to "SEND". When
              the VASP receives virtual assets, the value is set to "RECEIVE".
            example: SEND
        - name: oppositeVaspId
          in: query
          schema:
            type: string
            description: >
              A unique identifier used to distinguish the counterpart VASP
              during user verification.
            example: '27372039731940175'
        - name: originatorAccountNumber
          in: query
          schema:
            type: string
            description: |
              Wallet address of teh Originator.
            example: '0x1234567890123456789012345678901234567890'
        - name: beneficiaryAccountNumber
          in: query
          schema:
            type: string
            description: |
              Wallet address of teh Beneficiary.
            example: '0x1234567890123456789012345678901234567890'
        - name: page
          in: query
          schema:
            type: number
            description: |
              Number of the page.
            example: 1
        - name: rpp
          in: query
          schema:
            type: number
            description: |
              Number of the records.
            example: 10
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                  - page
                  - rpp
                  - verifications
