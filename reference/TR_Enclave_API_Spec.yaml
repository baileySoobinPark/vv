                            - UNKNOWN-NETWORK
                            - UNKNOWN-ADDRESS
                            - MISMATCHED-NAME
                            - UNDEFINED-ERROR
                            - BLACKLISTED
                            - UNVERIFIED-KYC
                          description: >
                            This field provides the reason for verification
                            failure.
                          example: UNKNOWN-ADDRESS
                        assetInfo:
                          type: object
                          required:
                            - symbol
                            - amount
                            - isExceedingThreshold
                            - tradePrice
                            - tradeCurrency
                            - tradeISODateTime
                          description: The object of asset information
                          properties:
                            symbol:
                              type: string
                              description: |
