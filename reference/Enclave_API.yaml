openapi: '3.0.1'
info:
  title: Enclave API
  version: '1.0'
  description: Enclave API getOwnVASPID
###
### VASP ID
###
paths:
  /v1/vasps/self:
    get:
      summary: VASP ID
      description: >
        VASP (Virtual Asset Service Provider) can check its own VASP ID using this API.
      tags:
        - V1
      operationId: getVaspId
      responses:
        '200':
          description: 'Successful response'
          content:
            application/json:
              schema:
                type: object
                properties:
                  vaspId:
                    type: string
                    description: Unique identifier of the VASP.
                    example: '15952089931162058999'
              examples:
                successExample:
                  value:
                    vaspId: '15952089931162058999'
        '400':
          description: '400 Bad Request Error response'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.  
                      - Invalid input parameters  
                      - Missing Required Parameters  
                      - Inactive VASP
                    example: 'MISSING-VERIFICATION-UUID'
              examples:
                400Errorexample:
                  value:
                    code: 'MISSING-REQUIRED-BENEFICIARY-INFO'
                    message: '`requiredBeneficiaryInfo` is required.'
        '404':
          description: '404 Resource Not Found Error response'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.  
                      It could be returned in the following cases:  
                      - When request with a non-existent resource is provided.
                    example: 'VERIFICATION-NOT-FOUND'
                  message:
                    type: string
                    description: >
                      Explanation about the error that is returned in CODE.
                    example: 'Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not found'
              examples:
                404Errorexample:
                  value:
                    code: 'VERIFICATION-NOT-FOUND'
                    message: 'Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not found'
        '408':
          description: '408 Request Timeout Error response'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.  
                      It could be returned in the following cases:  
                      When a timeout occurs during the processing of a request.
                    example: 'REQUEST-TIMEOUT'
                  message:
                    type: string
                    description: >
                      Explanation about the error that is returned in code.
                    example: 'timeout of 5000ms exceeded'
              examples:
                408Errorexample:
                  value:
                    code: 'REQUEST-TIMEOUT'
                    message: 'timeout of 5000ms exceeded'
  ###
  ### VASP List
  ###
  /v1/vasps:
    get:
      summary: VASP List
      description: >
        This API returns the list of VASPs.

        When a withdrawal is requested to your VASP, your VASP can call this API to find the vaspId (ID of the VASP) of the Beneficiary VASP.

        Your VASP will only see list of VASP using Travel Rule protocol and be able to communicate with VASP in the list.
      tags:
        - V1
      operationId: listVasp
      parameters:
        - name: protocol
          in: query
          required: false
          schema:
            type: string
            enum:
              - VERIFYVASP
              - CODE
              - ALL
            description: >
              Name of the protocol.  
              "VERIFYVASP", "CODE", "ALL" can be input in this field. Default is "ALL".
            example: 'VERIFYVASP'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                description: Description about this API
                required:
                  - vasps
                properties:
                  vasps:
                    type: array
                    items:
                      type: object
                      description: description
                      required:
                        - health
                        - vaspId
                        - vaspName
                        - protocol
                        - vaspStatus
                        - createdAt
                        - updatedAt
                      properties:
                        health:
                          type: string
                          enum:
                            - UP
                            - DOWN
                          description: >
                            Current operational health status of the VASP Enclave server.
                          example: 'UP'
                        vaspId:
                          type: string
                          description: >
                            Unique identifier of VASP.
                          example: '15952089931162060684'
                        vaspName:
                          type: string
                          description: >
                            The name of VASP.
                          example: 'A Exchange'
                        legalName:
                          type: string
                          description: >
                            The legal entity name of the VASP.
                          example: 'A Exchange'
                        jurisdiction:
                          type: string
                          description: >
                            The country or region where the legal entity is incorporated (jurisdiction of incorporation).
                          example: 'Singapore'
                        isAlliance:
                          type: boolean
                          description: >
                            A boolean field indicating whether the entity is a member of VerifyVASP.
                          example: true
                        country:
                          type: string
                          description: >
                            The name of the country where the VASP is incorporated.
                          example: 'Singapore'
                        countryCode:
                          type: string
                          description: >
                            The ISO 3166-1 alpha-2 code of the country where the VASP is incorporated.
                          example: 'SG'
                        protocol:
                          type: string
                          enum:
                            - VERIFYVASP
                            - CODE
                          description: >
                            The Travel Rule Protocol used by the VASP.  
                            Allowed values:  
                              1. VERIFYVASP: Member of VerifyVASP Alliance.  
                              2. CODE: Member of CODE.
                          example: 'VERIFYVASP'
                        licensedStatus:
                          type: string
                          enum:
                            - Regulated
                            - Unregulated
                          description: >
                            The VA License acquisition status of the VASP.
                          example: 'Regulated'
                        vaspStatus:
                          type: string
                          enum:
                            - UNVERIFIED
                            - VERIFIED
                            - VERIFIED-MEMBER
                            - INTEROPERATED
                          description: >
                            The status of the VASP on VerifyVASP.  
                            Allowed values:  
                              - VERIFIED-MEMBER  
                              - VERIFIED  
                              - UNVERIFIED  
                              - INTEROPERATED
                          example: 'VERIFIED-MEMBER'
                        createdAt:
                          type: string
                          description: >
                            The timestamp indicating when the VASP information was created (ISO 8601 UTC).
                          example: '2024-11-25T15:30:00.000Z'
                        updatedAt:
                          type: string
                          description: >
                            The timestamp indicating when the VASP information was updated (ISO 8601 UTC).
                          example: '2024-11-25T15:30:00.000Z'
              examples:
                successExample:
                  value:
                    vasps:
                      - health: 'UP'
                        vaspId: '27372039731940770'
                        vaspName: 'A Exchange'
                        legalName: 'A Exchange'
                        jurisdiction: 'Singapore'
                        isAlliance: true
                        country: 'Singapore'
                        countryCode: 'SG'
                        protocol: 'VERIFYVASP'
                        licensedStatus: 'Regulated'
                        vaspStatus: 'VERIFIED-MEMBER'
                        createdAt: '2021-09-27T01:48:38.000Z'
                        updatedAt: '2021-11-09T07:31:54.000Z'
                      - health: 'UP'
                        vaspId: '27372039731940165'
                        vaspName: 'B Exchange'
                        legalName: 'B Exchange'
                        jurisdiction: 'The Republic of Korea'
                        isAlliance: true
                        country: 'The Republic of Korea'
                        countryCode: 'KR'
                        protocol: 'CODE'
                        licensedStatus: null
                        vaspStatus: 'INTEROPERATED'
                        createdAt: '2021-09-27T01:48:38.000Z'
                        updatedAt: '2022-01-13T15:27:50.000Z'
        '400':
          description: 400 Bad Request Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: |
                      Error message.  
                      - Invalid input parameters  
                      - Missing Required Parameters  
                      - Inactive VASP
                    example: 'MISSING-VERIFICATION-UUID'
              examples:
                400Errorexample:
                  value:
                    code: 'MISSING-REQUIRED-BENEFICIARY-INFO'
                    message: '`requiredBeneficiaryInfo` is required.'
        '404':
          description: 404 Resource Not Found Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: |
                      Error message.  
                      It could be returned when requesting with non-existent resource.
                    example: 'VERIFICATION-NOT-FOUND'
                  message:
                    type: string
                    description: >
                      Explanation about the error returned in the CODE.
                    example: 'Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not found'
              examples:
                404Errorexample:
                  value:
                    code: 'VERIFICATION-NOT-FOUND'
                    message: 'Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not found'
        '408':
          description: 408 Request Timeout Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message when timeout occurs.
                    example: 'REQUEST-TIMEOUT'
                  message:
                    type: string
                    description: >
                      Explanation about the error returned in the CODE.
                    example: 'timeout of 5000ms exceeded'
              examples:
                408Errorexample:
                  value:
                    code: 'REQUEST-TIMEOUT'
                    message: 'timeout of 5000ms exceeded'
  ###
  ### User Account Verification
  ###

  /v1/verifications/account:
    post:
      summary: Request User Account Verification
      description: >
        API to request user account verification to the beneficiary VASP.
      tags:
        - Enclave API
      operationId: enclave_requestUserAccountVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - keyType
                - beneficiaryVaspId
                - symbol
                - payload
              properties:
                keyType:
                  type: string
                  enum:
                    - PerVasp
                    - PerAddress
                    - PerVerification
                  description: Type of the encryption key to be used.
                  example: 'PerVasp'
                beneficiaryVaspId:
                  type: string
                  description: Unique identifier of the beneficiary VASP.
                  example: '15952089931162060684'
                symbol:
                  type: string
                  description: Symbol of the virtual asset.
                  example: 'ETH'
                network:
                  type: string
                  description: Network of the virtual asset.
                  example: 'Ethereum'
                payload:
                  type: object
                  required:
                    - version
                    - ivms101
                  properties:
                    version:
                      type: string
                      description: Version of the IVMS101 protocol.
                      example: '1.0'
                    ivms101:
                      type: object
                      required:
                        - beneficiary
                      properties:
                        beneficiary:
                          type: object
                          required:
                            - accountNumber
                          properties:
                            accountNumber:
                              type: array
                              description: Array containing wallet addresses.
                              items:
                                type: string
                              example:
                                - '0x5811001506550d8356a215be229c15b6ef371a9b'
            examples:
              requestExamples:
                value:
                  keyType: 'PerVasp'
                  beneficiaryVaspId: '15952089931162060684'
                  symbol: 'ETH'
                  network: 'Ethereum'
                  payload:
                    version: '1.0'
                    ivms101:
                      beneficiary:
                        accountNumber:
                          - '0x5811001506550d8356a215be229c15b6ef371a9b'
      responses:
        '200':
          description: Successful verification response
          content:
            application/json:
              schema:
                type: object
                required:
                  - accountVerificationResult
                  - verifiedAt
                properties:
                  accountVerificationResult:
                    type: string
                    enum:
                      - VERIFIED
                      - DENIED
                    description: >
                      Result of user account verification. If DENIED, the reason field provides the cause.
                    example: 'VERIFIED'
                  reason:
                    type: string
                    enum:
                      - UNKNOWN-SYMBOL
                      - UNKNOWN-NETWORK
                      - UNKNOWN-ADDRESS
                      - MISMATCHED-NAME
                      - UNDEFINED-ERROR
                      - BLACKLISTED
                      - UNVERIFIED-KYC
                    description: Error reason if verification is denied.
                    example: 'UNKNOWN-ADDRESS'
                  verifiedAt:
                    type: string
                    description: >
                      Timestamp when verification was completed. Must follow UTC ISO 8601 format.
                    example: '2024-11-25T15:30:00.000Z'
              examples:
                successExample:
                  value:
                    accountVerificationResult: 'VERIFIED'
                    verifiedAt: '2024-11-25T15:30:00.000Z'
        '400':
          description: 400 Bad Request Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error code: Invalid input, missing parameters, or inactive VASP.
                    example: 'MISSING-VERIFICATION-UUID'
                  message:
                    type: string
                    description: Description of the error.
                    example: '`requiredBeneficiaryInfo` is required.'
              examples:
                error400Example:
                  value:
                    code: 'MISSING-REQUIRED-BENEFICIARY-INFO'
                    message: '`requiredBeneficiaryInfo` is required.'
        '404':
          description: 404 Resource Not Found Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error code when requesting with a non-existent resource.
                    example: 'VERIFICATION-NOT-FOUND'
                  message:
                    type: string
                    description: Description about the error.
                    example: 'Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not found'
              examples:
                error404Example:
                  value:
                    code: 'VERIFICATION-NOT-FOUND'
                    message: 'Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not found'
        '408':
          description: 408 Request Timeout Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: Timeout error code.
                    example: 'REQUEST-TIMEOUT'
                  message:
                    type: string
                    description: Timeout explanation.
                    example: 'timeout of 5000ms exceeded'
              examples:
                error408Example:
                  value:
                    code: 'REQUEST-TIMEOUT'
                    message: 'timeout of 5000ms exceeded'
