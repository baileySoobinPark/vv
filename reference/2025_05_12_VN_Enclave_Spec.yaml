openapi: 3.0.1
info:
  title: VerifyName API
  version: 1.0.0
paths:
  /v2/vasps:
    get:
      operationId: VerifyNameListVASP
      summary: List VASP API
      description: |
        This API provides a list of VASPs registered with VerifyVASP.
        The list is used during the withdrawal process to select the Beneficiary VASP. After retrieving the VASP list through this API, the vaspId field of the selected VASP can be used when initiating a verification request.

        ### VASP Eligibility Criteria
          The list includes your VASP and other VASPs that meet the following criteria:
          - The VASP is a member of VerifyVASP or another Travel Rule vendor.
          - The VASP is capable of handling asset transfers.
      tags:
        - VN Enclave API
      parameters:
        - name: protocol
          in: query
          schema:
            type: string
            enum:
              - TRAVEL-RULE
              - VERIFY-NAME
            description: |
              Unique identifier of request verification.  
              Must be a UUID format.
            example: VERIFY-NAME
      responses:
        "200":
          description: 200 Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - verificationResult
                properties:
                  verificationResult:
                    type: object
                    description: |
                      The values of the **verification_result** has to be one of the following values.
                      - **MATCHED**: The value of request from beneficiary VASP is matched with the information from originating VASP. 
                      - **MISMATCHED**: The value of request from beneficiary VASP is mismatched with the information from originating VASP.
                      - **SKIPPED**: The beneficiary VASP does not provide the value of request or The originating VASP does not provide the value of request.
                    required:
                      - ticker
                      - network
                      - address
                      - tag
                      - dti
                      - tx_hash
                    properties:
                      ticker:
                        type: string
                        description: |
                          The symbol of the virtual asset to be transferred.
                        example: ETH
                      network:
                        type: string
                        description: |
                          The network of the virtual asset to be transferred. The network field can be implemented conditionally. Valid values for this field can be found [here]().
                        example: ETHEREUM
                      address:
                        type: string
                        description: |
                          The address of the wallet storing the virtual asset.
                        example: "0xBb3fd383d1C5540E52EF0A7bcb9433375793aEAF"
                      tag:
                        type: string
                        nullable: true
                        description: |
                          The wallet address tag(secondary address such as XRP, XLM, EOS, etc...), regardless VerifyOriginator or VerifyBeneficiary.
                        example: "3256697931"
                      dti:
                        type: string
                        description: |
                          Digital Token Identifier (DTI) based on the ISO 24165 standard.
                        example: 4H95J0R2X
                      tx_hash:
                        type: string
                        description: |
                          Unique identifier of the transaction. If the value of **VerifyOriginator** is **type**, this field must be required.
                        example: 8a54d58ca4100112a5430818776d74898f2232770bae03046862575cb851a042
                      debtor:
                        type: object
                        properties:
                          name:
                            type: string
                            example: JHON DOE
                          supplementary_data:
                            type: object
                        example:
                          name: JHON DOE
                          supplementary_data:
                            envelope:
                              name:
                                first_name: JHON
                                last_name: DOE
                          identification:
                            private_identification:
                              date_and_place_of_birth:
                                date_of_birth: 1990-01-01
              examples:
                successExample:
                  value:
                    verification_results:
                      ticker: MATCHED
                      network: MISMATCHED
                      address: SKIPPED
                      tag: SKIPPED
                      tx_hash: SKIPPED
                      dti: SKIPPED
                    debtor:
                      name: HONG KIL DONG
                      supplementary_data:
                        envelope:
                          name:
                            first_name: GIL DONG
                            last_name: HONG
                          identification:
                            private_identification:
                              date_and_place_of_birth:
                                birth_date: 2025-01-01
        "400":
          description: 400 Bad Request Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: |
                      Error message.  

                      It could be returned in the following cases.  
                        1. Invalid input parameters.  
                        2. Missing Required Parameters.
                    example: MISSING-VERIFICATION-UUID
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in **code**.
                    example: verificationUuid` is required.
              examples:
                401ErrorExample:
                  value:
                    code: INVALID-ENCLAVE-MODE
                    message: mode is invalid value. The allowed modes [TR, VN1_CALL, VN1_RESPONSE, VN2]
        "408":
          description: 408 Request Timeout Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: |
                      Error message.  

                      It could be returned in the following cases.   When a timeout occurs during the processing of a request.
                    example: REQUEST-TIMEOUT
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in **code**.
                    example: timeout of 5000ms exceeded
              examples:
                408ErrorExample:
                  value:
                    code: REQUEST-TIMEOUT
                    message: timeout of 5000ms exceeded
  /v1/vasps/self:
    get:
      summary: Get VASP ID API
      description: |
        This API returns your VASP's VASP ID.
      operationId: getVaspId
      tags:
        - VN Enclave API
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  vaspId:
                    type: string
                    description: |
                      Unique identifier of VASP.
                    example: "15952089931162060684"
              examples:
                successfulExample:
                  value:
                    vaspId: "15952089931162058999"
        "400":
          description: 400 Bad Request Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: |
                      Error message.   - Invalid input parameters - Missing Required Parameters - Inactive VASP
                    example: MISSING-VERIFICATION-UUID
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in code
                    example: verificationUuid is required.
              examples:
                400Errorexample:
                  value:
                    code: MISSING-REQUIRED-BENEFICIARY-INFO
                    message: "`requiredBeneficiaryInfo` is required."
        "404":
          description: 404 Resource Not Found Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: |
                      Error message.   It could be returned in the following cases:   - When request with a non-existent resources is provided.
                    example: VERIFICATION-NOT-FOUND
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in CODE.
                    example: Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not found
              examples:
                404Errorexample:
                  value:
                    code: VERIFICATION-NOT-FOUND
                    message: Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not found
        "408":
          description: 408 Request Timeout Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: |
                      Error message.   It could be returned in the following cases:   When a timeout occurs during the processing of a request.
                    example: REQUEST-TIMEOUT
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in code.
                    example: timeout of 5000ms exceeded
              examples:
                408Errorexample:
                  value:
                    code: REQUEST-TIMEOUT
                    message: timeout of 5000ms exceeded
  /v2/owner-verifications:
    post:
      operationId: VNrequestOwnerVerification
      tags:
        - VN Enclave API
      summary: Request Owner Verification API
      description: |
        - VASP can use this API to verify the Beneficiary address or TxHash of Originator.
        - Your VASP can verify details using optional fields such as network, tag, dti etc.
        - Your VASP can call this API to verify the originator when your VASP detect the deposit of virtual assets or verify the beneficiary before executing the virtual asset transfer transaction. 

        ### Owner Verification Result
        - The result of the verification is returned in the response body of the API.
        - The verification results for the following items — ticker, network, address, tx_hash, dti, name, birth_date, date_of_incorporation, and organisation_identification — can be returned as one of the following values: 
          - MATCHED
          - MISMATCHED
          - SKIPPED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - providerVaspId
                - type
                - symbol
                - txHash
                - payload
              description: ""
              properties:
                providerVaspId:
                  type: string
                  description: |
                    Unique identifier of VASP that supporting VerifyName.
                  example: "15952089931162060684"
                type:
                  type: string
                  enum:
                    - VerifyOriginator
                    - VerifyBeneficiary
                  description: |
                    Indication of verification type.  

                    Acceptable type values are one of **VerifyOriginator**, **VerifyBeneficiary**.
                  example: VerifyOriginator
                symbol:
                  type: string
                  description: |
                    Symbol of the virtual asset to be transferred.
                  example: ETH
                txHash:
                  type: string
                  description: |
                    Unique identifier of the transaction.  
                    It's required when **type** is **VerifyOriginator**.
                  example: 8a54d58ca4100112a5430818776d74898f2232770bae03046862575cb851a042
                payload:
                  type: object
                  required:
                    - version
                    - ivms101
                  description: |
                    An Object containing IVMS101 formatted data and the version of IVMS101 protocol.
                  properties:
                    version:
                      type: string
                      description: |
                        Version of IVMS101 messaging protocol.
                      example: "1.0"
                    ivms101:
                      type: object
                      required:
                        - beneficiary
                        - account
                      description: |
                        An object containing IVMS101 formatted data.  
                        It includes the information of the Beneficiary and the wallet address.
                      properties:
                        beneficiary:
                          type: object
                          required:
                            - beneficiaryPersons
                          description: |
                            An object containing information about the Beneficiary.
                          properties:
                            beneficiaryPersons:
                              type: array
                              description: |
                                An array containing information about the natural person.
                              items:
                                type: array
                                description: |
                                  Array for personal information of Beneficiary.  
                                  It includes the information of the name, address, etc, for individuals or corporations.
                                items:
                                  type: object
                                  enum:
                                    - naturalPerson
                                    - legalPerson
                                  description: |
                                    An object containing information about the Beneficiary.
                                  properties:
                                    naturalPerson:
                                      type: object
                                      required:
                                        - name
                                        - dateAndPlaceOfBirth
                                      description: |
                                        An object containing information about natural person.
                                      properties:
                                        name:
                                          type: object
                                          required:
                                            - nameIdentifier
                                          description: |
                                            An object containing information of name.
                                          properties:
                                            nameIdentifier:
                                              type: array
                                              description: Name identifier
                                              items:
                                                type: object
                                                required:
                                                  - primaryIdentifier
                                                  - nameIdentifierType
                                                properties:
                                                  primaryIdentifier:
                                                    type: string
                                                    description: |
                                                      The basic elements of a name.  
                                                      You must enter the last name of Beneficiary.  
                                                      If it is difficult to separate the name into first and last name, it is acceptable to enter the full name in the **primaryIdentifier**.
                                                    example: Hong
                                                  secondaryIdentifier:
                                                    type: string
                                                    description: |
                                                      The basic elements of a name.  
                                                      You must enter the first name of Beneficiary.   Alternatively, you can enter your middle name along with your first name in this field.
                                                    example: Gildong
                                                  nameIdentifierType:
                                                    type: string
                                                    enum:
                                                      - ALIA
                                                      - BIRT
                                                      - MAID
                                                      - LEGL
                                                      - MISC
                                                    description: |
                                                      The type of name identifier.    

                                                        The following values can be included:  
                                                        **ALIA:** An alias name commonly known apart from the legal name.  
                                                        **BIRT:** A birth name.  
                                                        **MAID:** The original name used before a surname change due to marriage.  
                                                        **LEGL:** A legally or officially registered name.  
                                                        **MISC:** Other names that do not fall under the above categories.
                                                    example: LEGL
                                            localNameIdentifier:
                                              type: array
                                              items:
                                                type: object
                                                required:
                                                  - primaryIdentifier
                                                  - nameIdentifierType
                                                properties:
                                                  primaryIdentifier:
                                                    type: string
                                                    description: |
                                                      The basic elements of a name expressed in the languages of each country.  
                                                      You must enter the last name of Beneficiary.  
                                                      If it is difficult to separate the name into first and last names, it is acceptable to enter the full name in the **primaryIdentifier**.
                                                    example: 홍
                                                  secondaryIdentifier:
                                                    type: string
                                                    description: |
                                                      The basic elements of a name expressed in the languages of each country.  
                                                      You must enter the first name of Beneficiary. Alternatively, you can enter your middle name along with your first name in this field.
                                                    example: 길동
                                                  nameIdentifierType:
                                                    type: string
                                                    enum:
                                                      - ALIA
                                                      - BIRT
                                                      - MAID
                                                      - LEGL
                                                      - MISC
                                                    description: |
                                                      The type of name identifier. 

                                                        The following values can be included:  
                                                        **ALIA:** An alias name commonly known apart from the legal name.  
                                                        **BIRT:** A birth name.  
                                                        **MAID:** The original name used before a surname change due to marriage.  
                                                        **LEGL:** A legally or officially registered name.  
                                                        **MISC:** Other names that do not fall under the above categories.
                                                    example: LEGL
                                        dateAndPlaceOfBirth:
                                          type: object
                                          enum:
                                            - dateOfBirth
                                          properties:
                                            dateOfBirth:
                                              type: string
                                              description: |
                                                Date of birth.  
                                                The format of this field must follow "YYYY-MM-DD"
                                              example: 1985-03-14
                        accountNumber:
                          type: array
                          description: |
                            An array containing the wallet address.
                          items:
                            type: string
            examples:
              requestExamples:
                value:
                  supplementarty_data:
                    envelope:
                      vasp_id: "15952089931162060684"
                      type: VerifyBeneficiary
                      ticker: ETH
                      network: ETH
                      address: "0x5811001506550d8356a215be229c15b6ef371a9b"
                  creditor:
                    name: HONG KIL DONG
                    supplementary_data:
                      envelope:
                        name:
                          first_name: GIL DONG
                          last_name: HONG
                        identification:
                          private_identification:
                            date_and_place_of_birth:
                              birth_date: 2025-01-01
      responses:
        "200":
          description: 200 Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - request_id
                  - verification_results
                  - verified_at
                properties:
                  request_id:
                    type: string
                    description: |
                      A unique identifier for the Owner Verification request.
                      The format of `request_id` must follow the UUID v4 standard.
                    example: 4615aa9d-ac64-4997-a9e6-0e772c57c7ef
                  verificateion_results:
                    type: object
                    description: |
                      The values of the **verification_result** has to be one of the following values.
                      - **MATCHED**: The value of request from beneficiary VASP is matched with the information from originating VASP. 
                      - **MISMATCHED**: The value of request from beneficiary VASP is mismatched with the information from originating VASP.
                      - **SKIPPED**: The beneficiary VASP does not provide the value of request or The originating VASP does not provide the value of request.
                    required:
                      - ticker
                      - network
                      - address
                      - tag
                      - dti
                      - tx_hash
                    properties:
                      ticker:
                        type: string
                        description: |
                          The symbol of the virtual asset to be transferred.
                        example: ETH
                      network:
                        type: string
                        description: |
                          The network of the virtual asset to be transferred. The network field can be implemented conditionally. Valid values for this field can be found [here]().
                        example: ETHEREUM
                      address:
                        type: string
                        description: |
                          The address of the wallet storing the virtual asset.
                        example: "0xBb3fd383d1C5540E52EF0A7bcb9433375793aEAF"
                      tag:
                        type: string
                        nullable: true
                        description: |
                          The wallet address tag(secondary address such as XRP, XLM, EOS, etc...), regardless VerifyOriginator or VerifyBeneficiary.
                        example: "3256697931"
                      dti:
                        type: string
                        description: |
                          Digital Token Identifier (DTI) based on the ISO 24165 standard.
                        example: 4H95J0R2X
                      tx_hash:
                        type: string
                        description: |
                          Unique identifier of the transaction. If the value of **VerifyOriginator** is **type**, this field must be required.
                        example: 8a54d58ca4100112a5430818776d74898f2232770bae03046862575cb851a042
                      debtor:
                        type: object
                        properties:
                          name:
                            type: string
                            example: JHON DOE
                          supplementary_data:
                            type: object
                        example:
                          name: JHON DOE
                          supplementary_data:
                            envelope:
                              name:
                                first_name: JHON
                                last_name: DOE
                          identification:
                            private_identification:
                              date_and_place_of_birth:
                                date_of_birth: 1990-01-01
                  verified_at:
                    type: string
                    description: |
                      The timestamp when the verification was verified.
                    example: 2021-09-27T01:48:40.326Z || 2021-09-27T01:48:40.326+00:00 || 20210927T014840.326Z
              examples:
                successExample1:
                  value:
                    mode: SYNC
                    verificationResult: VERIFIED
        "400":
          description: 400 Bad Request Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: |
                      Error message.  

                      It could be returned in the following cases.  
                        1. Invalid input parameters.  
                        2. Missing Required Parameters.
                    example: MISSING-VERIFICATION-UUID
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in **code**.
                    example: verificationUuid` is required.
              examples:
                401ErrorExample:
                  value:
                    code: MISSING-REQUIRED-BENEFICIARY-INFO
                    message: "`requiredBeneficiaryInfo` is required."
components:
  securitySchemes:
    Authorization:
      type: http
      scheme: bearer
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      description: |
        Bearer token for authorization.
      schema:
        type: string
        description: Bearer token for authorization.
        example: Bearer <VEGA_VERIFICATION_AUTHORIZATION_TOKEN>
