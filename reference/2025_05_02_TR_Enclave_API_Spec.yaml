  /v1/verifications/error:
    post:
      summary: Report Error API
      description: >
        The Originating VASP calls this API to report a transaction that has
        been permanently canceled to the VerifyVASP Central server. Through this
        process, the Beneficiary VASP can acknowledge the failure of the virtual
        asset transfer.


        ### Implementation Policy
          1. Use this API to report error situations specifically for canceled virtual asset transfers that have already undergone user verification.
          2. Call this API only if the Originating VASP has permanently canceled the virtual asset transfer.
          3. Clearly specify the reason for the cancellation in the request. Common reasons may include cases such as the Beneficiary being listed on a Sanction List.
      operationId: enclave_reportError
      tags:
        - Enclave API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - result
                - reason
                - verificationUuid
              properties:
                result:
                  type: string
                  enum:
                    - VERIFIED
                    - DENIED
                    - ERROR
                  description: |
                    Result of User Account Verification or User Verification.
                  example: VERIFIED
                reason:
                  type: string
                  enum:
                    - UNKNOWN-SYMBOL
                    - UNKNOWN-NETWORK
                    - UNKNOWN-ADDRESS
                    - MISMATCHED-NAME
                    - UNDEFINED-ERROR
                    - BLACKLISTED
                    - UNVERIFIED-KYC
                  description: |
                    Error codes indicating the reason for verification failure.
                  example: UNKNOWN-ADDRESS
                message:
                  type: string
                  description: |
                    Additional information about the verification result.
                  example: An unidentifiable wallet address.
                verificationUuid:
                  type: string
                  description: >
                    A unique identifier for the User Verification request.  

                    The format of **verificationUuid** must follow the UUID v4
                    standard.
                  example: 4bc03a8f-5679-4358-815c-906aae5557f4
            examples:
              requestexamples:
                value:
                  result: DENIED
                  reason: UNKNOWN-ADDRESS
                  message: The address is not found
                  verificationId: 8557f2b2-985e-431f-8d52-75c2e5a01e46
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    type: boolean
                    description: |
                      A boolean indicating the verification result.  
                        
                      true represents that the result is **VERIFIED**.
                    example: true
              examples:
                successfulExample:
                  value:
                    result: true
        "400":
