                                                nameIdentifierType:
                                                  type: string
                                                  enum:
                                                    - ALIA
                                                    - BIRT
                                                    - MAID
                                                    - LEGL
                                                    - MISC
                                                  description: >
                                                    The type of name
                                                    identifier.  
                                                      
                                                    Refer to the details below
