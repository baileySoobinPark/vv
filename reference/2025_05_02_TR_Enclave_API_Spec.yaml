                                                    type of name
                                                    identifier:   The following
                                                    values can be included:  
                                                      **ALIA**: An alias name, commonly known apart from the legal name.  

                                                      **BIRT**: A birth name.  

                                                      **MAID**: The original name used before a surname change due to marriage.  

                                                      **LEGL**: A legally or officially registered name.  

                                                      **MISC**: Other names that do not fall under the above categories.
                                              example: LEGL
                            accountNumber:
                              type: array
                              description: |
                                An array containing wallet addresses.
                              items:
                                type: string
            examples:
              requestexamples:
                value:
                  verificationUuid: d63398e3-c806-4300-bd99-170b54642080
                  payload:
                    version: "1.0"
                    ivms101:
                      originator:
                        originatorPersons:
                          - naturalPerson:
                              name:
                                nameIdentifier:
                                  - primaryIdentifier: James
                                    secondaryIdentifier: Din
                                    nameIdentifierType: LEGL
                        accountNumber:
                          - "0x5811001506550d8356a215be229c15b6ef371a9a"
                      beneficiary:
                        beneficiaryPersons:
                          - naturalPerson:
                              name:
                                nameIdentifier:
                                  - primaryIdentifier: James
                                    nameIdentifierType: LEGL
                        accountNumber:
