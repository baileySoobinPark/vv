openapi: 3.0.1
info:
  title: VerifyVASP API Spec
  version: "1.0"
  description: Management of VerifyVASP API Spec.
paths:
  /v1/vasps/self:
    get:
      summary: Get VASP ID API
      description: |
        This API returns your VASP's VASP ID.
      operationId: getVaspId
      tags:
        - Enclave API
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  vaspId:
                    type: string
                    description: |
                      Unique identifier of VASP.
                    example: "15952089931162060684"
              examples:
                successfulExample:
                  value:
                    vaspId: "15952089931162058999"
        "400":
          description: 400 Bad Request Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.   - Invalid input parameters - Missing
                      Required Parameters - Inactive VASP
                    example: MISSING-VERIFICATION-UUID
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in code
                    example: verificationUuid is required.
              examples:
                400Errorexample:
                  value:
                    code: MISSING-REQUIRED-BENEFICIARY-INFO
                    message: "`requiredBeneficiaryInfo` is required."
        "404":
          description: 404 Resource Not Found Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.   It could be returned in the following
                      cases:   - When request with a non-existent resources is
                      provided.
                    example: VERIFICATION-NOT-FOUND
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in CODE.
                    example: Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not found
              examples:
                404Errorexample:
                  value:
                    code: VERIFICATION-NOT-FOUND
                    message: Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not found
        "408":
          description: 408 Request Timeout Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.   It could be returned in the following
                      cases:   When a timeout occurs during the processing of a
                      request.
                    example: REQUEST-TIMEOUT
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in code.
                    example: timeout of 5000ms exceeded
              examples:
                408Errorexample:
                  value:
                    code: REQUEST-TIMEOUT
                    message: timeout of 5000ms exceeded
  /v1/vasps:
    get:
      summary: List VASP API
      description: >
        This API provides a list of VASPs registered with VerifyVASP.

        The list is used during the withdrawal process to select the Beneficiary
        VASP. After retrieving the VASP list through this API, the vaspId field
        of the selected VASP can be used when initiating a verification request.


        ### VASP Eligibility Criteria
          The list includes your VASP and other VASPs that meet the following criteria:
          - The VASP is a member of VerifyVASP or another Travel Rule protocol.
          - The VASP is capable of handling asset transfers.
      operationId: listVasp
      tags:
        - Enclave API
      parameters:
        - name: protocol
          in: query
          schema:
            type: string
            enum:
              - VERIFYVASP
              - CODE
              - ALL
            description: >
              Name of the protocol.   "VERIFYVASP", "CODE", "ALL" can input in
              this field, Default is "ALL".
            example: VERIFYVASP
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                description: Description about this API
                required:
                  - vasps
                properties:
                  vasps:
                    type: array
                    items:
                      type: object
                      description: description
                      required:
                        - health
                        - vaspId
                        - vaspName
                        - protocol
                        - vaspStatus
                        - createdAt
                        - updatedAt
                      properties:
                        health:
                          type: string
                          enum:
                            - UP
                            - DOWN
                          description: >
                            Current operational health status of the VASP
                            Enclave server.
                          example: UP
                        vaspId:
                          type: string
                          description: |
                            Unique identifier of VASP.
                          example: "15952089931162060684"
                        vaspName:
                          type: string
                          description: |
                            The name of VASP.
                          example: A Exchange
                        legalName:
                          type: string
                          description: |
                            The legal entity name of the VASP.
                          example: A Exchange
                        jurisdiction:
                          type: string
                          description: >
                            The country or region where the legal entity is
                            incorporated (jurisdiction of incorporation).
                          example: Singapore
                        isAlliance:
                          type: boolean
                          description: >
                            A boolean field indicating whether the entity is a
                            member of VerifyVASP.
                          example: true
                        country:
                          type: string
                          description: >
                            The name of the country where the VASP is
                            incorporated.
                          example: Singapore
                        countryCode:
                          type: string
                          description: >
                            The ISO 3166-1 alpha-2 code of the country where the
                            VASP is incorporated.
                          example: SG
                        protocol:
                          type: string
                          enum:
                            - VERIFYVASP
                            - CODE
                          description: >
                            The Travel Rule Protocol used by the VASP.   Allowed
                            values:  
                              1. VERIFYVASP: Indicates that the VASP is a member of VerifyVASP.  
                              2. CODE: Indicates that the VASP is a member of CODE.
                          example: VERIFYVASP
                        licensedStatus:
                          type: string
                          enum:
                            - Regulated
                            - Unregulated
                          description: |
                            The VA License acquisition status of the VASP.
                          example: Regulated
                        vaspStatus:
                          type: string
                          enum:
                            - UNVERIFIED
                            - VERIFIED
                            - VERIFIED-MEMBER
                            - INTEROPERATED
                          description: >
                            The status of the VASP on VerifyVASP.   Allowed
                            values:  
                              **VERIFIED-MEMBER**: A member of the VerifyVASP Alliance with the Enclave server properly running, enabling transactions.  

                              **VERIFIED**: Registered with VerifyVASP but not approved as an Alliance member, or an Alliance member without an installed Enclave server. 

                              **UNVERIFIED**: Not registered with VerifyVASP.  

                              **INTEROPERATED**: A member of another Travel Rule Protocol.
                          example: VERIFIED-MEMBER
                        createdAt:
                          type: string
                          description: >
                            The timestamp indicating when the VASP information
                            was created.   This field must follow the UTC ISO
                            8601 datetime representation standard.  
                              
                            **Recommendations**:   To ensure consistency across
                            systems, we strongly recommend using the extended
                            format "YYYY-MM-DDThh:mm:ss.sssZ", which includes
                            milliseconds and clearly specifies the UTC
                            timezone.  
                              
                            Other ISO 8601 Acceptable Formats:  
                              - Basic format("YYYYMMDDThhmmss.sssZ")  
                              - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")  

                            **Implementation Note**  
                              
                            While the extended format is recommended, your
                            implementation should account for requests from
                            external VASPs that may use the other two formats.
                            Ensure your system can handle and correctly
                            interpret all three formats to maintain
                            compatibility.
                          example: 2024-11-25T15:30:00.000Z
                        updatedAt:
                          type: string
                          description: >
                            The timestamp when the information of VASP was
                            updated.  
                              
                            This field must follow the UTC ISO 8601 datetime
                            representation standard.  
                              
                            **Recommendations**:   To ensure consistency across
                            systems, we strongly recommend using the extended
                            format "YYYY-MM-DDThh:mm:ss.sssZ", which includes
                            milliseconds and clearly specifies the UTC
                            timezone.  
                              
                            Other ISO 8601 Acceptable Formats:
                              - Basic format("YYYYMMDDThhmmss.sssZ")  
                              - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")  

                              
                            **Implementation Note**  
                              
                            While the extended format is recommended, your
                            implementation should account for requests from
                            external VASPs that may use the other two formats.
                            Ensure your system can handle and correctly
                            interpret all three formats to maintain
                            compatibility.
                          example: 2024-11-25T15:30:00.000Z
              examples:
                successfulExample:
                  value:
                    vasps:
                      - health: UP
                        vaspId: "27372039731940770"
                        vaspName: A Exchange
                        legalName: A Exchange
                        jurisdiction: Singapore
                        isAlliance: true
                        country: Singapore
                        countryCode: SG
                        protocol: VERIFYVASP
                        licensedStatus: Regulated
                        vaspStatus: VERIFIED-MEMBER
                        createdAt: 2021-09-27T01:48:38.000Z
                        updatedAt: 2021-11-09T07:31:54.000Z
                      - health: UP
                        vaspId: "27372039731940165"
                        vaspName: B Exchange
                        legalName: B Exchange
                        jurisdiction: The Republic of Korea
                        isAlliance: true
                        country: The Republic of Korea
                        countryCode: KR
                        protocol: CODE
                        licensedStatus: null
                        vaspStatus: INTEROPERATED
                        createdAt: 2021-09-27T01:48:38.000Z
                        updatedAt: 2022-01-13T15:27:50.000Z
        "400":
          description: 400 Bad Request Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.   - Invalid input parameters - Missing
                      Required Parameters - Inactive VASP
                    example: MISSING-VERIFICATION-UUID
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in code
                    example: verificationUuid is required.
              examples:
                400Errorexample:
                  value:
                    code: MISSING-REQUIRED-BENEFICIARY-INFO
                    message: "`requiredBeneficiaryInfo` is required."
        "404":
          description: 404 Resource Not Found Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.   It could be returned in the following
                      cases:   - When request with a non-existent resources is
                      provided.
                    example: VERIFICATION-NOT-FOUND
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in CODE.
                    example: Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not found
              examples:
                404Errorexample:
                  value:
                    code: VERIFICATION-NOT-FOUND
                    message: Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not found
        "408":
          description: 408 Request Timeout Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.   It could be returned in the following
                      cases:   When a timeout occurs during the processing of a
                      request.
                    example: REQUEST-TIMEOUT
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in code.
                    example: timeout of 5000ms exceeded
              examples:
                408Errorexample:
                  value:
                    code: REQUEST-TIMEOUT
                    message: timeout of 5000ms exceeded
  /v1/verifications/account:
    post:
      summary: Request User Account Verification API
      description: >
        The Originating VASP can initiate verification flow by validating the
        beneficiary account by calling this Enclave API. The verification
        ensures that the specified wallet address belongs to the Beneficiary
        VASP.

        ### Verification Result Description

        The verification result is provided in the accountVerificationResult
        field of the response. If the result is `DENIED`, the reason field
        specifies the reason for the rejection.


        | Reason Code         | Description |

        |---------------------|-------------|

        | `UNKNOWN-SYMBOL`    | Error code returned when the symbol provided by
        the Originating VASP corresponds to an asset not supported by the
        Beneficiary VASP. |

        | `UNKNOWN-NETWORK`   | The error code returned when the network
        provided by the Originating VASP is either not supported by the
        Beneficiary VASP or the network information is insufficient.<br><br>This
        error is also returned if the asset symbol provided by the Originating
        VASP matches a symbol supported by the Beneficiary VASP but corresponds
        to a different network.<br><br>_Example: If the Originating VASP sends a
        symbol field with USDT and a network field with `Ethereum` to the
        Beneficiary VASP, but the Beneficiary VASP only supports USDT on the
        Tron network. |

        | `UNKNOWN-ADDRESS`   | The error code returned when the Beneficiary's
        wallet address provided by the Originating VASP does not match any
        wallet address owned by the Beneficiary VASP or does not exist. |

        | `MISMATCHED-NAME`   | The error code returned when the Beneficiary's
        name provided by the Originating VASP does not match the name registered
        with the wallet address owned by the Beneficiary VASP or does not exist.
        |

        | `UNDEFINED-ERROR`   | The error code returned when an undefined error
        occurs outside of the four specified cases. |

        | `UNVERIFIED-KYC`    | Error code returned when the Beneficiary has not
        completed the KYC verification process with the Beneficiary VASP. |
      operationId: enclave_requestUserAccountVerification
      tags:
        - Enclave API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - keyType
                - beneficiaryVaspId
                - symbol
                - payload
              description: description
              properties:
                keyType:
                  type: string
                  enum:
                    - PerVasp
                    - PerAddress
                    - PerVerification
                  description: >
                    The type of Public Key to be used for encrypting personal
                    information.  

                    The default value is **PerVasp**. PerAddress and
                    PerVerification can also be entered.  

                    The Beneficiary VASP must provide the Public Key
                    corresponding to the Key Type specified by the Originating
                    VASP in this field.  
                      
                    Explanation of allowed values:  
                      
                    **PerVasp**: A single key shared across all verifications
                    for a VASP.  

                    **PerAddress**: A unique key is generated for each
                    beneficiary address.  

                    **PerVerification**: A new key is generated for every
                    verification request.
                  example: PerVasp
                beneficiaryVaspId:
                  type: string
                  description: |
                    Unique identifier of Beneficiary VASP.
                  example: "27372039731940770"
                symbol:
                  type: string
                  description: |
                    Symbol of the virtual asset to be transferred.
                  example: ETH
                network:
                  type: string
                  description: >
                    The network of the virtual asset to be transferred.   The
                    network field can be implemented conditionally. Valid values
                    for this field can be found here.  
                      
                    **Conditional Use of 'network' Field:**  
                      When the Beneficiary VASP requires the network field:  
                      If the Originating VASP does not provide a network value in the request, the response will include: result as **DENIED** and reason as **UNKNOWN-NETWORK**.  
                        
                      When the Beneficiary VASP makes the network field optional:  
                      Even if the Originating VASP omits the network value, the Beneficiary VASP can infer the network based on the symbol and return the verification result.
                  example: Ethereum
                payload:
                  type: object
                  required:
                    - version
                    - ivms101
                  description: Description
                  properties:
                    version:
                      type: string
                      description: >
                        The version of the IVMS101 messaging protocol being used.
                      example: "1.0"
                    ivms101:
                      type: object
                      description: >
                        An object with IVMS101-formatted data containing
                        information about the Originator, OriginatingVASP,
                        Beneficiary, and BeneficiaryVASP.
                      required:
                        - beneficiary
                      properties:
                        beneficiary:
                          type: object
                          description: |
                            An object containing Beneficiary information.
                          required:
                            - accountNumber
                          properties:
                            accountNumber:
                              type: array
                              description: |
                                An array containing wallet addresses.
                              items:
                                type: string
            examples:
              requestexamples:
                value:
                  keyType: PerVasp
                  beneficiaryVaspId: "15952089931162060684"
                  symbol: ETH
                  network: Ethereum
                  payload:
                    version: "1.0"
                    ivms101:
                      beneficiary:
                        accountNumber:
                          - "0x5811001506550d8356a215be229c15b6ef371a9b"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                description: Description about this API
                required:
                  - accountVerificationResult
                  - verifiedAt
                properties:
                  accountVerificationResult:
                    type: string
                    enum:
                      - VERIFIED
                      - DENIED
                    description: >
                      Result of User Account Verification:  
                        
                      If the result is **DENIED**, the reason field should
                      provide the specific reason.
                    example: VERIFIED
                  reason:
                    type: string
                    enum:
                      - UNKNOWN-SYMBOL
                      - UNKNOWN-NETWORK
                      - UNKNOWN-ADDRESS
                      - MISMATCHED-NAME
                      - UNDEFINED-ERROR
                      - BLACKLISTED
                      - UNVERIFIED-KYC
                    description: >
                      Error codes indicating the reason for verification failure.
                    example: UNKNOWN-ADDRESS
                  verifiedAt:
                    type: string
                    description: >
                      The timestamp when the verification was completed.  
                        
                      This field must follow the UTC ISO 8601 datetime
                      representation standard.
                        
                      **Recommendations**  
                        
                      To ensure consistency across systems, we strongly
                      recommend using the extended format
                      "YYYY-MM-DDThh:mm:ss.sssZ", which includes milliseconds
                      and clearly specifies the UTC timezone.   Other ISO 8601
                      Acceptable Formats:  
                        - Basic format("YYYYMMDDThhmmss.sssZ")  
                        - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")  

                        
                      **Implementation Note**  
                        
                      While the extended format is recommended, your
                      implementation should account for requests from external
                      VASPs that may use the other two formats. Ensure your
                      system can handle and correctly interpret all three
                      formats to maintain compatibility.
                    example: 2024-11-25T15:30:00.000Z
              examples:
                successfulExample:
                  value:
                    vasps:
                      - health: UP
                        vaspId: "27372039731940770"
                        vaspName: A Exchange
                        legalName: A Exchange
                        jurisdiction: Singapore
                        isAlliance: true
                        country: Singapore
                        countryCode: SG
                        protocol: VERIFYVASP
                        licensedStatus: Regulated
                        vaspStatus: VERIFIED-MEMBER
                        createdAt: 2021-09-27T01:48:38.000Z
                        updatedAt: 2021-11-09T07:31:54.000Z
                      - health: UP
                        vaspId: "27372039731940165"
                        vaspName: B Exchange
                        legalName: B Exchange
                        jurisdiction: The Republic of Korea
                        isAlliance: true
                        country: The Republic of Korea
                        countryCode: KR
                        protocol: CODE
                        licensedStatus: null
                        vaspStatus: INTEROPERATED
                        createdAt: 2021-09-27T01:48:38.000Z
                        updatedAt: 2022-01-13T15:27:50.000Z
        "400":
          description: 400 Bad Request Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.   - Invalid input parameters - Missing
                      Required Parameters - Inactive VASP
                    example: MISSING-VERIFICATION-UUID
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in code
                    example: verificationUuid is required.
              examples:
                400Errorexample:
                  value:
                    code: MISSING-REQUIRED-BENEFICIARY-INFO
                    message: "`requiredBeneficiaryInfo` is required."
        "404":
          description: 404 Resource Not Found Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.   It could be returned in the following
                      cases:   - When request with a non-existent resources is
                      provided.
                    example: VERIFICATION-NOT-FOUND
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in CODE.
                    example: Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not found
              examples:
                404Errorexample:
                  value:
                    code: VERIFICATION-NOT-FOUND
                    message: Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not found
        "408":
          description: 408 Request Timeout Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.   It could be returned in the following
                      cases:   When a timeout occurs during the processing of a
                      request.
                    example: REQUEST-TIMEOUT
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in code.
                    example: timeout of 5000ms exceeded
              examples:
                408Errorexample:
                  value:
                    code: REQUEST-TIMEOUT
                    message: timeout of 5000ms exceeded
  /v1/verifications:
    post:
      summary: Request User Verification API
      description: >
        The Originating VASP can request user verification by calling this
        Enclave API. This API verifies whether the personal information provided
        by the Originating VASP matches the account owner's information managed
        by the Beneficiary VASP.

        ### Asynchronous Operation

        This API operates asynchronously. Upon requesting a user verification,
        the response includes a verificationUuid, which uniquely identifies the
        requested verification. Once the Beneficiary VASP completes the user
        verification process, the result is delivered to the your VASP via the
        callback API, using the verificationUuid. The same UUID can also be used
        to retrieve the verification result at a later time if needed.
      operationId: enclave_requestUserVerification
      tags:
        - Enclave API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - keyType
                - beneficiaryVaspId
                - assetInfo
                - requiredBeneficiaryInfo
                - payload
              properties:
                keyType:
                  type: string
                  enum:
                    - PerVasp
                    - PerAddress
                    - PerVerification
                  description: >
                    The type of Public Key to be used for encrypting personal
                    information.  

                    The default value is **PerVasp**. PerAddress and
                    PerVerification can also be entered.  

                    The Beneficiary VASP must provide the Public Key
                    corresponding to the Key Type specified by the Originating
                    VASP in this field.  
                      
                    Explanation of allowed values:  
                      
                    **PerVasp**: A single key shared across all verifications
                    for a VASP.  

                    **PerAddress**: A unique key is generated for each
                    beneficiary address.  

                    **PerVerification**: A new key is generated for every
                    verification request.
                  example: PerVasp
                beneficiaryVaspId:
                  type: string
                  description: |
                    Unique identifier of Beneficiary VASP.
                  example: "27372039731940770"
                assetInfo:
                  type: object
                  required:
                    - symbol
                    - amount
                    - isExceedingThreshold
                    - tradePrice
                    - tradeCurrency
                    - tradeISODateTime
                  description: Asset information
                  properties:
                    symbol:
                      type: string
                      description: |
                        Symbol of the virtual asset to be transferred.
                      example: ETH
                    network:
                      type: string
                      description: >
                        The network of the virtual asset to be
                        transferred.   The network field can be implemented
                        conditionally. Valid values for this field can be found
                        here.  
                          
                        **Conditional Use of 'network' Field:**  
                          When the Beneficiary VASP requires the network field:  
                          If the Originating VASP does not provide a network value in the request, the response will include: result as **DENIED** and reason as **UNKNOWN-NETWORK**.  
                            
                          When the Beneficiary VASP makes the network field optional:  
                          Even if the Originating VASP omits the network value, the Beneficiary VASP can infer the network based on the symbol and return the verification result.
                      example: Ethereum
                    amount:
                      type: string
                      description: |
                        The amount of the virtual asset to be transferred.
                      example: "0.024"
                    isExceedingThreshold:
                      type: boolean
                      description: >
                        A boolean field to check whether the fiat-converted
                        amount of the virtual asset to be transferred exceeds
                        the legal threshold.   If the value is false, User
                        Verification for the transaction is not
                        mandatory.   (Legal threshold: 1,000 USD or 1,000,000
                        KRW.)
                      example: true
                    tradePrice:
                      type: string
                      description: >
                        The amount of virtual assets to be transferred,
                        converted into fiat currency.
                      example: "2439800"
                    tradeCurrency:
                      type: string
                      description: >
                        The code of the fiat currency into which the virtual
                        asset is converted.
                      example: KRW
                    tradeISODateTime:
                      type: string
                      description: >
                        The timestamp used as the exchange rate reference when
                        converting the virtual asset to fiat currency.   This
                        field must follow the UTC ISO 8601 datetime
                        representation standard.  
                          
                        **Recommendations**  
                          
                        To ensure consistency across systems, we strongly
                        recommend using the extended format
                        "YYYY-MM-DDThh:mm:ss.sssZ", which includes milliseconds
                        and clearly specifies the UTC timezone.   Other ISO 8601
                        Acceptable Formats:  
                          - Basic format("YYYYMMDDThhmmss.sssZ")    
                          - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")    

                          
                        **Implementation Note**  
                          
                        While the extended format is recommended, your
                        implementation should account for requests from external
                        VASPs that may use the other two formats. Ensure your
                        system can handle and correctly interpret all three
                        formats to maintain compatibility.
                      example: 2024-11-25T15:30:00.000Z
                requiredBeneficiaryInfo:
                  type: string
                  description: >
                    The list of personal information codes required by the
                    Originating VASP to verify the Beneficiary.   The
                    Beneficiary VASP must return the requested Beneficiary
                    personal information using the provided personal information
                    codes in the IVMS101 format.
                  example: NATURAL_PERSON_NAME,ACCOUNT_NUMBER
                payload:
                  type: object
                  required:
                    - version
                    - ivms101
                  description: Input Description
