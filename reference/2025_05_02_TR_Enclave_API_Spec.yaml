      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                description: Description about this API
                required:
                  - verificationUuid
                  - createdAt
                properties:
                  verificationUuid:
                    type: string
                    description: >
                      A unique identifier for the User Verification request.  

                      The format of **verificationUuid** must follow the UUID v4
                      standard.
                    example: 4bc03a8f-5679-4358-815c-906aae5557f4
                  createdAt:
                    type: string
                    description: >
                      The timestamp when the user verification was
                      requested.   This field must follow the UTC ISO 8601
                      datetime representation standard.  
                        
                      **Recommendations**  

                      To ensure consistency across systems, we strongly
                      recommend using the extended format
                      "YYYY-MM-DDThh:mm:ss.sssZ", which includes milliseconds
                      and clearly specifies the UTC timezone.  
                        
                      Other ISO 8601 Acceptable Formats:  
                        - Basic format("YYYYMMDDThhmmss.sssZ")  
                        - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")  

                        
                      **Implementation Note**  
                        
                      While the extended format is recommended, your
                      implementation should account for requests from external
                      VASPs that may use the other two formats. Ensure your
                      system can handle and correctly interpret all three
                      formats to maintain compatibility.
                    example: 2024-11-25T15:30:00.000Z
              examples:
                successfulExample:
                  value:
                    verificationUuid: 8557f2b2-985e-431f-8d52-75c2e5a01e46
                    createdAt: 2022-03-03T12:45:34.085Z
        "400":
          description: 400 Bad Request Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.   - Invalid input parameters - Missing
                      Required Parameters - Inactive VASP
                    example: MISSING-VERIFICATION-UUID
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in code
                    example: verificationUuid is required.
              examples:
                400Errorexample:
                  value:
                    code: MISSING-REQUIRED-BENEFICIARY-INFO
                    message: "`requiredBeneficiaryInfo` is required."
        "404":
          description: 404 Resource Not Found Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.   It could be returned in the following
                      cases:   - When request with a non-existent resources is
                      provided.
                    example: VERIFICATION-NOT-FOUND
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in CODE.
                    example: Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not found
              examples:
                404Errorexample:
                  value:
                    code: VERIFICATION-NOT-FOUND
                    message: Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not found
        "408":
          description: 408 Request Timeout Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.   It could be returned in the following
                      cases:   When a timeout occurs during the processing of a
                      request.
                    example: REQUEST-TIMEOUT
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in code.
                    example: timeout of 5000ms exceeded
              examples:
                408Errorexample:
                  value:
                    code: REQUEST-TIMEOUT
                    message: timeout of 5000ms exceeded
    get:
      summary: List Verification Result API
      description: >
        This API retrieves the history of all previously requested
        verifications.

        ### Query with Filters

        This API supports a variety of query parameters, enabling you to filter
        and retrieve verification records that match specific criteria. Filters
        are particularly useful for managing verification requests based on
        their status, timestamp, asset type, or counterparty VASP. Additionally,
        you can identify a specific verification record matched with an on-chain
        transaction using these filters.


        All query parameters are optional, and any specified parameters are
        applied using an AND operation to filter the results. For a detailed
        list of supported filters, refer to the Query Parameter section in the
        specification below.
      operationId: enclave_listVerificationResult
      tags:
        - Enclave API
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            description: >
              The start date for querying a specific point in time.   The format
              of formDate must follow ISO 8601(YYYY-MM-DD) standard.
            example: 2022-01-01
        - name: toDate
          in: query
          schema:
            type: string
            description: >
              The end date for querying a specific point in time.   The format
              of toDate must follow ISO 8601(YYYY-MM-DD) standard.
            example: 2011-01-15
        - name: symbol
          in: query
          schema:
            type: string
            description: |
              Symbol of the virtual asset to be transferred.
            example: ETH
        - name: network
          in: query
          schema:
            type: string
            description: >
              The network of the virtual asset to be transferred.   The network
              field can be implemented conditionally. Valid values for this
              field can be found here.  
                
              **Conditional Use of 'network' Field:**  
                When the Beneficiary VASP requires the network field:  
                If the Originating VASP does not provide a network value in the request, the response will include: result as **DENIED** and reason as **UNKNOWN-NETWORK**.  
                  
                When the Beneficiary VASP makes the network field optional:  
                Even if the Originating VASP omits the network value, the Beneficiary VASP can infer the network based on the symbol and return the verification result.
            example: Ethereum
        - name: txHash
          in: query
          schema:
            type: string
            description: |
              Unique identifier of the transaction.
            example: 8a54d58ca4100112a5430818776d74898f2232770bae03046862575cb851a042
        - name: result
          in: query
          schema:
            type: string
            enum:
              - VERIFIED
              - DENIED
              - ERROR
            description: |
              Result of User Account Verification or User Verification.
            example: VERIFIED
        - name: actionType
          in: query
          schema:
            type: string
            enum:
              - SEND
              - RECEIVE
            description: >
              A field that defines the transaction action of the VASP.   When
              the VASP sends virtual assets, the value is set to "SEND". When
              the VASP receives virtual assets, the value is set to "RECEIVE".
            example: SEND
        - name: oppositeVaspId
          in: query
          schema:
            type: string
            description: >
              A unique identifier used to distinguish the counterpart VASP
              during user verification.
            example: "27372039731940175"
        - name: originatorAccountNumber
          in: query
          schema:
            type: string
            description: |
              Wallet address of teh Originator.
            example: "0x1234567890123456789012345678901234567890"
        - name: beneficiaryAccountNumber
          in: query
          schema:
            type: string
            description: |
              Wallet address of teh Beneficiary.
            example: "0x1234567890123456789012345678901234567890"
        - name: page
          in: query
          schema:
            type: number
            description: |
              Number of the page.
            example: 1
        - name: rpp
          in: query
          schema:
            type: number
            description: |
              Number of the records.
            example: 10
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                  - page
                  - rpp
                  - verifications
                properties:
                  count:
                    type: number
                    description: |
                      Total number of items.
                    example: 25
                  page:
                    type: number
                    description: |
                      The page number in the paginated response.
                    example: 1
                  rpp:
                    type: number
                    description: |
                      The number of records per page in the paginated response.
                    example: 10
                  verifications:
                    type: array
                    items:
                      type: object
                      required:
                        - verificationUuid
                        - assetInfo
                        - txHash
                        - originatingVaspId
                        - originatorAccountNumber
                        - ivms101Originator
                        - ivms101OriginatingVasp
                        - beneficiaryVaspId
                        - beneficiaryAccountNumber
                        - ivms101Beneficiary
                        - ivms101BeneficiaryVasp
                        - verifiedAt
                        - orderedAt
                        - createdAt
                      properties:
                        verificationId:
                          type: string
                          description: |
                            Unique Identifier of User Verification Result.
                          example: "12345"
                        verificationUuid:
                          type: string
                          description: >
                            A unique identifier for the User Verification
                            request.  

                            The format of **verificationUuid** must follow the
                            UUID v4 standard.
                          example: 4bc03a8f-5679-4358-815c-906aae5557f4
                        result:
                          type: string
                          enum:
                            - VERIFIED
                            - DENIED
                            - ERROR
                          description: >
                            Result of User Account Verification or User
                            Verification.
                          example: VERIFIED
                        reason:
                          type: string
                          enum:
                            - UNKNOWN-SYMBOL
                            - UNKNOWN-NETWORK
                            - UNKNOWN-ADDRESS
                            - MISMATCHED-NAME
                            - UNDEFINED-ERROR
                            - BLACKLISTED
                            - UNVERIFIED-KYC
                          description: >
                            Error codes indicating the reason for verification
                            failure.
                          example: UNKNOWN-ADDRESS
                        assetInfo:
                          type: object
                          required:
                            - symbol
                            - amount
                            - isExceedingThreshold
                            - tradePrice
                            - tradeCurrency
                            - tradeISODateTime
                          description: Asset information
                          properties:
                            symbol:
                              type: string
                              description: |
                                Symbol of the virtual asset to be transferred.
                              example: ETH
                            network:
                              type: string
                              description: >
                                The network of the virtual asset to be
                                transferred.   The network field can be
                                implemented conditionally. Valid values for this
                                field can be found here.  
                                  
                                **Conditional Use of 'network' Field:**  
                                  When the Beneficiary VASP requires the network field:  
                                  If the Originating VASP does not provide a network value in the request, the response will include: result as **DENIED** and reason as **UNKNOWN-NETWORK**.  
                                    
                                  When the Beneficiary VASP makes the network field optional:  
                                  Even if the Originating VASP omits the network value, the Beneficiary VASP can infer the network based on the symbol and return the verification result.
                              example: Ethereum
                            amount:
                              type: string
                              description: >
                                The amount of the virtual asset to be
                                transferred.
                              example: "0.024"
                            isExceedingThreshold:
                              type: boolean
                              description: >
                                A boolean field to check whether the
                                fiat-converted amount of the virtual asset to be
                                transferred exceeds the legal threshold.   If
                                the value is false, User Verification for the
                                transaction is not mandatory.   (Legal
                                threshold: 1,000 USD or 1,000,000 KRW.)
                              example: true
                            tradePrice:
                              type: string
                              description: >
                                The amount of virtual assets to be transferred,
                                converted into fiat currency.
                              example: "2439800"
                            tradeCurrency:
                              type: string
                              description: >
                                The code of the fiat currency into which the
                                virtual asset is converted.
                              example: KRW
                            tradeISODateTime:
                              type: string
                              description: >
                                The timestamp used as the exchange rate
                                reference when converting the virtual asset to
                                fiat currency.   This field must follow the UTC
                                ISO 8601 datetime representation standard.  
                                  
                                **Recommendations**  
                                  
                                To ensure consistency across systems, we
                                strongly recommend using the extended format
                                "YYYY-MM-DDThh:mm:ss.sssZ", which includes
                                milliseconds and clearly specifies the UTC
                                timezone.   Other ISO 8601 Acceptable Formats:  
                                  - Basic format("YYYYMMDDThhmmss.sssZ")    
                                  - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")    

                                  
                                **Implementation Note**  
                                  
                                While the extended format is recommended, your
                                implementation should account for requests from
                                external VASPs that may use the other two
                                formats. Ensure your system can handle and
                                correctly interpret all three formats to
                                maintain compatibility.
                              example: 2024-11-25T15:30:00.000Z
