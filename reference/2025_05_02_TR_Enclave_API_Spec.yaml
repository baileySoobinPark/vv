  /v1/verifications/tx/inquiry:
    post:
      summary: Check Transaction Status API
      description: >
        ### Check Transaction Status API

        This API is called by the Beneficiary VASP when it cannot confirm the
        results of the Report Transaction Result or Report Error API for a
        verified user within a certain timeframe.


        **Implementation Guide**
          1. When the Beneficiary VASP detects an incoming deposit, it should first call the Verification Result Lookup API with the txHash filter to check for any matching verification records.
          2. If no matching txHash is found, the Beneficiary VASP can wait for a certain period for the Originating VASP to call the Transaction Report API.
          3. After this waiting period, if no transaction report has been received from the Originating VASP, the Beneficiary VASP can use the Verification Result Lookup API to identify potential candidate verifications.
          4. To narrow down the candidates, search using the deposit’s detected from address and to address as the originatorAccountNumber and beneficiaryAccountNumber, respectively.
          5. For the filtered candidate verifications, the Beneficiary VASP can then call the Check Transaction Status API for each to match the transaction ID information.
      operationId: enclave_checkTransactionStatus
      tags:
        - Enclave API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - verificationUuid
              properties:
                verificationUuid:
                  type: string
                  description: >
                    A unique identifier for the User Verification request.  

                    The format of **verificationUuid** must follow the UUID v4
                    standard.
                  example: 4bc03a8f-5679-4358-815c-906aae5557f4
            examples:
              requestexamples:
                value:
                  verificationUuid: 8557f2b2-985e-431f-8d52-75c2e5a01e46
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - verificationUuid
                  - transactionStatus
                properties:
                  verificationUuid:
                    type: string
                    description: >
                      A unique identifier for the User Verification request.  

                      The format of **verificationUuid** must follow the UUID v4
                      standard.
                    example: 4bc03a8f-5679-4358-815c-906aae5557f4
                  transactionStatus:
                    type: string
                    enum:
                      - PENDING
                      - PROCESSING
                      - WAIT-CONFIRM
                      - CONFIRMED
                      - CANCELED
                    description: >
                      Current status of the virtual asset transaction.  
                        
                      Details of each state:  
                        **PENDING**: The Originating VASP has not yet executed the virtual asset transaction.  
                        
                        **PROCESSING**:The virtual asset transaction has been initiated and is awaiting mining.  
                                      
                        **WAIT-CONFIR**: The transaction has been mined but the block containing it has not achieved finality.  
                        
                        **CONFIRMED**: The virtual asset transaction has been mined, and the block containing the transaction has achieved finality.  
                        
                        **CANCELED**: The Originating VASP has permanently canceled the transaction for a specific reason.
                    example: PROCESSING
                  txHash:
                    type: string
                    description: |
                      Unique identifier of the transaction.
                    example: 8a54d58ca4100112a5430818776d74898f2232770bae03046862575cb851a042
                  vout:
                    type: string
                    description: |
                      Index of the output in a Bitcoin blockchain transaction.
                    example: "2"
              examples:
