  /v1/risk-assessment/chainalysis-sanction:
    post:
      summary: Risk Assessment Via Chainalysis Sanction API
      description: >
        This API provides risk level assessment of wallet addresses by
        leveraging the Chainalysis Sanction API. It enables VASPs to evaluate
        the potential risks associated with the wallet addresses they handle,
        helping to prevent unauthorized or high-risk transactions.


        ### What is the Chainalysis Sanction API?
          The Chainalysis Sanction API is a free service provided by [Chainalysis](https://www.chainalysis.com/) that assesses the risk associated with cryptocurrency wallet addresses. It allows organizations, including VASPs, to quickly identify high-risk addresses, such as those flagged for sanctions or other regulatory concerns. This API supports efficient compliance with anti-money laundering (AML) and sanction screening requirements, enhancing the security and reliability of virtual asset transactions.
            - To use the API, you must first obtain an API key by registering via the following link: [Chainalysis Public Sanction API Sign-Up](https://go.chainalysis.com/crypto-sanctions-screening.html).
            - For detailed information about the API, including usage guidelines, refer to the official documentation: [Chainalysis Public Sanction API Reference](https://public.chainalysis.com/docs/index.html)

        ### How to Use the Sanction API
          Before calling the Sanction API, the User Verification API (POST /verifications) must be completed. The Sanction API can be used in various scenarios, such as:
            - `By the Originating VASP`: After verifying the user via the User Verification API, the Originating VASP can evaluate the risk level of the Beneficiary's wallet address using the Sanction API before initiating an asset transfer.
            - `By the Beneficiary VASP`: The Beneficiary VASP can assess the risk associated with the Originator's wallet address to identify potential threats and take necessary precautions.

          ### Perparation Requirements
            1. **Enclave Environment Variable Configuration**: Set `VEGA_CHAINALYSIS_SANCTION_API_KEY` variable with the API key issued during the registration process.
            2. **Database Table Setup**: 
              - The Enclave database must include a table to store Chainalysis Sanction API call results.
              - Refer to the Chainalysis Sanction Results Table definition for implementation details.
      operationId: Screening_performRiskAssessmentViaChainalysisSanction
      tags:
        - Screening API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - verificationUuid
              properties:
                verificationUuid:
                  type: string
                  description: >
                    A unique identifier for the User Verification request.  

                    The format of **verificationUuid** must follow the UUID v4
                    standard.
                  example: 4bc03a8f-5679-4358-815c-906aae5557f4
            examples:
              requestexamples:
                value:
                  verificationUuid: 8557f2b2-985e-431f-8d52-75c2e5a01e46
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - chainalysisSanction
                properties:
                  chainalysisSanction:
                    type: object
                    required:
                      - requestId
                      - counterpartyVaspId
                      - direction
                      - address
                      - status
                      - createdAt
                    properties:
                      requestId:
                        type: string
                        description: >
                          A unique identifier used to distinguish the request
                          for risk assessment.
                        example: 398ace46-6baf-4488-a9f2-ee43680b413e
                      counterpartyVaspId:
                        type: string
                        description: |
                          Unique identifer of the counterparty VASP.
                        example: "15952089931162059995"
                      direction:
                        type: string
                        enum:
                          - OUTGOING
                          - INCOMING
                        description: >
                          A field indicating the direction of virtual asset
                          movement.  

                          **OUTGOING** is used for withdrawals, and INCOMING is
                          used for deposits.
                        example: OUTGOING
                      address:
                        type: string
                        description: |
                          Account address.
                        example: "0xBb3fd383d1C5540E52EF0A7bcb9433375793aEAF"
                      status:
                        type: string
                        description: |
                          Result of risk assessment.
                        example: NOHIT
                      createdAt:
                        type: string
                        description: >
                          The timestamp when the user verification was
                          requested.   This field must follow the UTC ISO 8601
                          datetime representation standard.  
                            
                          **Recommendations**  

                          To ensure consistency across systems, we strongly
                          recommend using the extended format
                          "YYYY-MM-DDThh:mm:ss.sssZ", which includes
                          milliseconds and clearly specifies the UTC timezone.  
                            
                          Other ISO 8601 Acceptable Formats:  
                            - Basic format("YYYYMMDDThhmmss.sssZ")  
                            - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")  

                            
                          **Implementation Note**  
                            
                          While the extended format is recommended, your
                          implementation should account for requests from
                          external VASPs that may use the other two formats.
                          Ensure your system can handle and correctly interpret
                          all three formats to maintain compatibility.
                        example: 2024-11-25T15:30:00.000Z
              examples:
                successfulExample:
                  value:
                    chainalysisSanction:
                      requestId: 398ace46-6baf-4488-a9f2-ee43680b413e
                      counterpartyVaspId: "15952089931162059995"
                      direction: OUTGOING
                      address: "0xBb3fd383d1C5540E52EF0A7bcb9433375793aEAF"
                      status: NOHIT
                      createdAt: 2023-05-26T13:34:23.053Z
        "400":
          description: 400 Bad Request Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.   - Invalid input parameters - Missing
