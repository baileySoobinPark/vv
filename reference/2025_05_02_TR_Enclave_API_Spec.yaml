  /v1/verifications/tx:
    post:
      summary: Report Transaction Result API
      description: >
        This API is used by the Originating VASP to report the txHash or txId of
        a blockchain transaction to the Beneficiary VASP after executing the
        asset transfer transaction on the blockchain.

        ### Implementation Policy
          1. Only transactions for which User Verification has been completed should be executed, and the txHash or txId must be reported via calling this API.
          2. As soon as the transaction hash is generated, this API must be called immediately to send the information to the VerifyVASP Central server.
          3. If the transaction's finality is not secured and the virtual asset transfer fails, the Report Error API must be executed immediately to report the error to the VerifyVASP Central server.
      operationId: enclave_reportTransactionResult
      tags:
        - Enclave API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - verificationUuid
                - txHash
              properties:
                verificationUuid:
                  type: string
                  description: >
                    A unique identifier for the User Verification request.  

                    The format of **verificationUuid** must follow the UUID v4
                    standard.
                  example: 4bc03a8f-5679-4358-815c-906aae5557f4
                txHash:
                  type: string
                  description: |
                    Unique identifier of the transaction.
                  example: 8a54d58ca4100112a5430818776d74898f2232770bae03046862575cb851a042
                vout:
                  type: string
                  description: |
                    Index of the output in a Bitcoin blockchain transaction.
                  example: "2"
            examples:
              requestexamples:
                value:
                  verificationUuid: 8557f2b2-985e-431f-8d52-75c2e5a01e46
                  txHash: 8a54d58ca4100112a5430818776d74898f2232770bae03046862575cb851a042
                  vout: "2"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    type: boolean
                    description: |
                      A boolean indicating the verification result.  
                        
                      true represents that the result is **VERIFIED**.
                    example: true
              examples:
                successfulExample:
                  value:
                    result: true
        "400":
          description: 400 Bad Request Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.   - Invalid input parameters - Missing
                      Required Parameters - Inactive VASP
                    example: MISSING-VERIFICATION-UUID
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in code
                    example: verificationUuid is required.
              examples:
                400Errorexample:
                  value:
                    code: MISSING-REQUIRED-BENEFICIARY-INFO
                    message: "`requiredBeneficiaryInfo` is required."
        "404":
          description: 404 Resource Not Found Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.   It could be returned in the following
                      cases:   - When request with a non-existent resources is
                      provided.
                    example: VERIFICATION-NOT-FOUND
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in CODE.
                    example: Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not found
              examples:
                404Errorexample:
                  value:
                    code: VERIFICATION-NOT-FOUND
                    message: Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not found
        "408":
          description: 408 Request Timeout Error response
          content:
