  /v1/verifications/{uuid}:
    get:
      summary: Get Verification Result API
      description: >
        This API retrieves the result of a specific verification request using
        its unique verification UUID.
      operationId: enclave_getVerificationResult
      tags:
        - Enclave API
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            description: >
              Unique identifier of User Verification.   The format of **uuid**
              must follow UUID V4 standard.
            example: 4615aa9d-ac64-4997-a9e6-0e772c57c7ef
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - verificationUuid
                  - assetInfo
                  - txHash
                  - originatingVaspId
                  - originatorAccountNumber
                  - ivms101Originator
                  - ivms101OriginatingVasp
                  - beneficiaryVaspId
                  - beneficiaryAccountNumber
                  - ivms101Beneficiary
                  - ivms101BeneficiaryVasp
                  - verifiedAt
                  - orderedAt
                  - createdAt
                properties:
                  verificationUuid:
                    type: string
                    description: >
                      A unique identifier for the User Verification request.  

                      The format of **verificationUuid** must follow the UUID v4
                      standard.
                    example: 4bc03a8f-5679-4358-815c-906aae5557f4
                  result:
                    type: string
                    enum:
                      - VERIFIED
                      - DENIED
                      - ERROR
                    description: |
                      Result of User Account Verification or User Verification.
                    example: VERIFIED
                  reason:
                    type: string
                    enum:
                      - UNKNOWN-SYMBOL
                      - UNKNOWN-NETWORK
                      - UNKNOWN-ADDRESS
                      - MISMATCHED-NAME
                      - UNDEFINED-ERROR
                      - BLACKLISTED
                      - UNVERIFIED-KYC
                    description: >
                      Error codes indicating the reason for verification failure.
                    example: UNKNOWN-ADDRESS
                  assetInfo:
                    type: object
                    required:
                      - symbol
                      - amount
                      - isExceedingThreshold
                      - tradePrice
                      - tradeCurrency
                      - tradeISODateTime
                    description: Asset information
                    properties:
                      symbol:
                        type: string
                        description: |
                          Symbol of the virtual asset to be transferred.
                        example: ETH
                      network:
                        type: string
                        description: >
                          The network of the virtual asset to be
                          transferred.   The network field can be implemented
                          conditionally. Valid values for this field can be
                          found here.  
                            
                          **Conditional Use of 'network' Field:**  
                            When the Beneficiary VASP requires the network field:  
                            If the Originating VASP does not provide a network value in the request, the response will include: result as **DENIED** and reason as **UNKNOWN-NETWORK**.  
                              
                            When the Beneficiary VASP makes the network field optional:  
                            Even if the Originating VASP omits the network value, the Beneficiary VASP can infer the network based on the symbol and return the verification result.
                        example: Ethereum
                      amount:
                        type: string
                        description: |
                          The amount of the virtual asset to be transferred.
                        example: "0.024"
                      isExceedingThreshold:
                        type: boolean
                        description: >
                          A boolean field to check whether the fiat-converted
                          amount of the virtual asset to be transferred exceeds
                          the legal threshold.   If the value is false, User
                          Verification for the transaction is not
                          mandatory.   (Legal threshold: 1,000 USD or 1,000,000
                          KRW.)
                        example: true
                      tradePrice:
                        type: string
                        description: >
                          The amount of virtual assets to be transferred,
                          converted into fiat currency.
                        example: "2439800"
                      tradeCurrency:
                        type: string
                        description: >
                          The code of the fiat currency into which the virtual
                          asset is converted.
                        example: KRW
                      tradeISODateTime:
                        type: string
                        description: >
                          The timestamp used as the exchange rate reference when
                          converting the virtual asset to fiat currency.   This
                          field must follow the UTC ISO 8601 datetime
                          representation standard.  
                            
                          **Recommendations**  
                            
                          To ensure consistency across systems, we strongly
                          recommend using the extended format
                          "YYYY-MM-DDThh:mm:ss.sssZ", which includes
                          milliseconds and clearly specifies the UTC
                          timezone.   Other ISO 8601 Acceptable Formats:  
                            - Basic format("YYYYMMDDThhmmss.sssZ")    
                            - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")    

                            
                          **Implementation Note**  
                            
                          While the extended format is recommended, your
                          implementation should account for requests from
                          external VASPs that may use the other two formats.
                          Ensure your system can handle and correctly interpret
                          all three formats to maintain compatibility.
                        example: 2024-11-25T15:30:00.000Z
                  txHash:
                    type: string
                    description: |
                      Unique identifier of the transaction.
                    example: 8a54d58ca4100112a5430818776d74898f2232770bae03046862575cb851a042
                  vout:
                    type: string
                    description: |
                      Index of the output in a Bitcoin blockchain transaction.
                    example: "2"
                  originatingVaspId:
                    type: string
                    description: |
                      Unique identifier of Originating VASP.
                    example: "123456789098765"
                  originatorAccountNumber:
                    type: string
                    description: |
                      Account Address of Originator.
                    example: "0x5811001506550d8356a215be229c15b6ef371a9a"
                  ivms101Originator:
                    type: string
                    description: |
                      Originator Type written in IVMS101 format.
                    example: '{"originatorPersons":[{"naturalPerson":{"name":{"nameIdentifier":[{"primaryIdentifier":"Taylor","nameIdentifierType":"LEGL"}]},"geographicAddress":[{"addressType":"test","buildingName":"123","townName":"Yeoksam-dong","country":"KR"}]}}]}'
                  ivms101OriginatingVasp:
                    type: string
                    description: |
                      OriginatingVASP Type written in IVMS101 format.
                    example: '{"legalPerson":{"name":{"nameIdentifier":[{"legalPersonName":"perftest1","legalPersonNameIdentifierType":"LEGL"}]},"geographicAddress":[{"addressType":"GEOG","postcode":"13525","townName":"Yeoksam-dong","addressLine":["Gangnam-gu",
                      "Gangbuck-do","abc"],"country":"AF"}],"nationalIdentification":{"nationalIdentifier":"983746561","nationalIdentifierType":"RAID","registrationAuthority":"RA000025"}}}'
                  beneficiaryVaspId:
                    type: string
                    description: |
                      Unique identifier of Beneficiary VASP.
                    example: "27372039731940770"
                  beneficiaryAccountNumber:
                    type: string
                    description: |
                      Account Address of Beneficiary.
                    example: "0x5811001506550d8356a215be229c15b6ef371a9a"
                  ivms101Beneficiary:
                    type: string
                    description: |
                      Beneficiary Type written in IVMS101 format.
                    example: '{"beneficiaryPersons":[{"naturalPerson":{"name":{"nameIdentifier":[{"primaryIdentifier":"Taylor","secondaryIdentifier":"Robbins","nameIdentifierType":"LEGL"}]}}}],"accountNumber":["1G3qCGKP5dQtQ7secCPTCDPU9Wfjp9x3Hb"]}'
                  ivms101BeneficiaryVasp:
                    type: string
                    description: |
                      BeneficiaryVASP Type written in IVMS101 format.
                    example: '{"legalPerson":{"name":{"nameIdentifier":[{"legalPersonName":"perftest2","legalPersonNameIdentifierType":"LEGL"}]},"geographicAddress":[{"addressType":"GEOG","postcode":"13525","townName":"Yeoksam-dong","addressLine":["14",
                      "Teheran-ro",
                      "4-gil","Gangnam-gu"],"country":"AF"}],"nationalIdentification":{"nationalIdentifier":"7612873123","nationalIdentifierType":"RAID","registrationAuthority":"RA000073"}}}'
                  verifiedAt:
                    type: string
                    description: >
                      The timestamp when the verification was completed.  
                        
                      This field must follow the UTC ISO 8601 datetime
                      representation standard.
                        
                      **Recommendations**  
                        
                      To ensure consistency across systems, we strongly
                      recommend using the extended format
                      "YYYY-MM-DDThh:mm:ss.sssZ", which includes milliseconds
                      and clearly specifies the UTC timezone.   Other ISO 8601
                      Acceptable Formats:  
                        - Basic format("YYYYMMDDThhmmss.sssZ")  
                        - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")  

                        
                      **Implementation Note**  
                        
                      While the extended format is recommended, your
                      implementation should account for requests from external
                      VASPs that may use the other two formats. Ensure your
                      system can handle and correctly interpret all three
                      formats to maintain compatibility.
                    example: 2024-11-25T15:30:00.000Z
                  orderedAt:
                    type: string
                    description: >
                      Timestamp indicating when the transaction hash was
                      reported.  

                      This field must follow the UTC ISO 8601 datetime
                      representation standard.  

                      Recommendations:  
                        
                      To ensure consistency across systems, we strongly
                      recommend using the extended format
                      "YYYY-MM-DDThh:mm:ss.sssZ", which includes milliseconds
                      and clearly specifies the UTC timezone.  
                        
                      Other ISO 8601 Acceptable Formats:  
                        - Basic format("YYYYMMDDThhmmss.sssZ")  
                        - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")  

                      **Implementation Note**  
                        
                      While the extended format is recommended, your
                      implementation should account for requests from external
                      VASPs that may use the other two formats. Ensure your
                      system can handle and correctly interpret all three
                      formats to maintain compatibility.
                    example: 2024-11-25T15:30:00.000Z
                  createdAt:
                    type: string
                    description: >
                      The timestamp when the user verification was
                      requested.   This field must follow the UTC ISO 8601
                      datetime representation standard.  
                        
                      **Recommendations**  

                      To ensure consistency across systems, we strongly
                      recommend using the extended format
                      "YYYY-MM-DDThh:mm:ss.sssZ", which includes milliseconds
                      and clearly specifies the UTC timezone.  
                        
                      Other ISO 8601 Acceptable Formats:  
                        - Basic format("YYYYMMDDThhmmss.sssZ")  
                        - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")  

                        
                      **Implementation Note**  
                        
                      While the extended format is recommended, your
                      implementation should account for requests from external
                      VASPs that may use the other two formats. Ensure your
                      system can handle and correctly interpret all three
                      formats to maintain compatibility.
                    example: 2024-11-25T15:30:00.000Z
              examples:
                successfulExample:
                  value:
                    verificationId: "12345"
                    verificationUuid: 4615aa9d-ac64-4997-a9e6-0e772c57c7ef
                    result: VERIFIED
                    reason: OK
                    assetInfo:
