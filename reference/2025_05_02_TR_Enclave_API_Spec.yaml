      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - requestId
                properties:
                  requestId:
                    type: string
                    description: >
                      A unique identifier used to distinguish the request for
                      risk assessment.
                    example: 398ace46-6baf-4488-a9f2-ee43680b413e
              examples:
                successfulExample:
                  value:
                    requestId: 398ace46-6baf-4488-a9f2-ee43680b413e
        "400":
          description: 400 Bad Request Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.   - Invalid input parameters - Missing
                      Required Parameters - Inactive VASP
                    example: MISSING-VERIFICATION-UUID
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in code
                    example: verificationUuid is required.
              examples:
                400Errorexample:
                  value:
                    code: MISSING-REQUIRED-BENEFICIARY-INFO
                    message: "`requiredBeneficiaryInfo` is required."
        "401":
          description: 401 Unauthorized Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.   It could be returned in the following
                      case   - Invalid API Key(Unauthorized)
                    example: UNKNOWN-ERROR-CODE
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in code.
                    example: Invalid API Key
              examples:
                401Errorexample:
                  value:
                    code: UNKNOWN-ERROR-CODE
                    message: Invalid API Key
        "404":
          description: 404 Resource Not Found Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.   It could be returned in the following
                      cases:   - When request with a non-existent resources is
                      provided.
                    example: VERIFICATION-NOT-FOUND
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in CODE.
                    example: Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not found
              examples:
                404Errorexample:
                  value:
                    code: VERIFICATION-NOT-FOUND
                    message: Verification(9faab87c-54a6-4145-baa9-7a3a42d7410c) is not found
        "408":
          description: 408 Request Timeout Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      Error message.   It could be returned in the following
                      cases:   When a timeout occurs during the processing of a
                      request.
                    example: REQUEST-TIMEOUT
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in code.
                    example: timeout of 5000ms exceeded
              examples:
                408Errorexample:
                  value:
                    code: REQUEST-TIMEOUT
                    message: timeout of 5000ms exceeded
