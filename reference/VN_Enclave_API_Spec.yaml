            application/json:
              schema:
                type: object
                properties:
                  transaction_status:
                    type: string
                    enum:
                      - PENDING
                      - PROCESSING
                      - WAIT-CONFIRM
                      - CONFIRMED
                      - CANCELED
                    description: >
                      Current status of the virtual asset transaction.


                      Details of each state:

                      - **PENDING**: The Originating VASP has not yet executed
                      the virtual asset transaction.

                      - **PROCESSING**:The virtual asset transaction has been
                      initiated and is awaiting mining.

                      - **WAIT-CONFIRM**: The transaction has been mined but the
                      block containing it has not achieved finality.

                      - **CONFIRMED**: The virtual asset transaction has been
                      mined, and the block containing the transaction has
                      achieved finality.

                      - **CANCELED**: The Originating VASP has permanently
                      canceled the transaction for a specific reason.
                    example: PROCESSING
                  request_id:
                    type: string
                    description: >
                      A unique identifier for the Owner Verification request.


                      The format of `request_id` must follow the UUID v4
                      standard.
                    example: 4615aa9d-ac64-4997-a9e6-0e772c57c7ef
