  /v2/owner-verification/{request_id}:
    get:
      summary: Get Owner Verification Result API
      description: >
        This API retrieves the result of a specific owner verification request
        using its unique request_id.


        When the verification result is DENIED or ERROR, the reason field in the
        response provides a code that explains the reason for the verification
        result. The following table lists the codes available in the reason
        field along with their descriptions.


        | Reason Code                              | Description |

        |-------------------------------------------|-------------|

        | MISMATCH-TICKER                           | Used with
        `verification_result: DENIED` when the owner verification result for the
        `ticker` field is `MISMATCHED` and the transaction is not sent. |

        | MISMATCH-NETWORK                          | Used with
        `verification_result: DENIED` when the owner verification result for the
        `network` field is `MISMATCHED` and the transaction is not sent. |

        | MISMATCH-ADDRESS                          | Used with
        `verification_result: DENIED` when the owner verification result for the
        `address` field is `MISMATCHED` and the transaction is not sent. |

        | MISMATCH-NAME                             | Used with
        `verification_result: DENIED` when the owner verification result for the
        `name` field is `MISMATCHED` and the transaction is not sent. |

        | MISMATCH-DTI                              | Used with
        `verification_result: DENIED` when the owner verification result for the
        `dti` field is `MISMATCHED` and the transaction is not sent. |

        | MISMATCH-DATE-OF-INCORPORATION            | Used with
        `verification_result: DENIED` when the owner verification result for the
        `date_of_incorporation` field is `MISMATCHED` and the transaction is not
        sent. |

        | MISMATCH-BIRTH-DATE                       | Used with
        `verification_result: DENIED` when the owner verification result for the
        `birth_date` field is `MISMATCHED` and the transaction is not sent. |

        | MISMATCH-ORGANISATION-IDENTIFICATION      | Used with
        `verification_result: DENIED` when the owner verification result for the
        `organisation_identification` field is `MISMATCHED` and the transaction
        is not sent. |

        | TRANSFER-ERROR                            | Used with
        `verification_result: ERROR` when a transaction transfer fails. |

        | UNDEFINED-ERROR                           | Used with
        `verification_result: ERROR` when an unexpected error occurs that is not
        covered by the above reason codes. |
