openapi: 3.0.1
info:
  title: VN Integration Steps
  version: 1.0.0
servers:
  - url: https://<enclave-endpoint>
paths:
  /v2/vasps:
    get:
      operationId: verifyName-List-VASP
      summary: List VASP API
      tags:
        - VN Enclave API
      x-readme:
        explorer-enabled: false
      parameters:
        - name: protocol
          in: query
          schema:
            type: string
            enum:
              - TRAVEL-RULE
              - VERIFY-NAME
            description: >
              Name of the protocol. "TRAVEL-RULE", "VERIFY-NAME" can input in
              this field.
            example: VERIFY-NAME
      responses:
        '200':
          description: 200 Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  vasps:
                    type: array
                    items:
                      type: object
                      required:
                        - health
                        - vaspId
                        - vaspName
                        - protocol
                        - vendor
                        - vaspStatus
                      properties:
                        health:
                          type: string
                          enum:
                            - UP
                            - DOWN
                          description: >
                            Current operational health status of the VASP
                            Enclave server.
                          example: UP
                        vaspId:
                          type: string
                          description: >
                            Unique identifier of VASP that supporting
                            VerifyName.
                          example: '15952089931162060684'
                        vaspName:
                          type: string
                          description: |
                            Name of the VASP.
                          example: A Exchange
                        protocol:
                          type: array
                          items:
                            type: string
                            enum:
                              - TRAVEL-RULE
                              - VERIFY-NAME
                          description: |
                            The protocol of the VASP.
                        legalName:
                          type: string
                          description: |
                            The legal entity name of the VASP.
                          example: A Exchange
                        jurisdiction:
                          type: string
                          description: >
                            The country or region where the legal entity is
                            established (jurisdiction of incorporation).
                          example: Singapore
                        country:
                          type: string
                          description: >
                            The name of the country where the VASP is
                            established.
                          example: Singapore
                        countryCode:
                          type: string
                          description: >
                            The ISO 3166-1 alpha-2 code of the country where the
                            VASP is incorporated.
                          example: SG
                        vendor:
                          type: string
                          enum:
                            - VERIFYVASP
                            - CODE
                          description: >
                            The TravelRule Protocol used by the VASP. 


                            Allowed values:

                            - **VERIFYVASP**: Indicates that the VASP is a
                            member of the VerifyVASP Alliance.

                            - **CODE**: Indicates that the VASP is a member of
                            the CODE Alliance.
                          example: VERIFYVASP
                        licensedStatus:
                          type: string
                          enum:
                            - Regulated
                            - Unregulated
                          description: |
                            The VA License acquisition status of the VASP.
                          example: Regulated
                        vaspStatus:
                          type: string
                          enum:
                            - UNVERIFIED
                            - VERIFIED
                            - VERIFIED-MEMBER
                            - INTEROPERATED
                          description: >
                            The status of the VASP on VerifyVASP.   Allowed
                            values:  
                              **VERIFIED-MEMBER**: A member of the VerifyVASP Alliance with the Enclave server properly running, enabling transactions.  

                              **VERIFIED**: Registered with VerifyVASP but not approved as an Alliance member, or an Alliance member without an installed Enclave server. 

                              **UNVERIFIED**: Not registered with VerifyVASP.  

                              **INTEROPERATED**: A member of another Travel Rule Protocol.
                          example: VERIFIED-MEMBER
              examples:
                Successful Example:
                  value:
                    vasps:
                      - health: UP
                        vaspId: '15952089931162060684'
                        vaspName: A Exchange
                        protocol:
                          - TRAVEL-RULE
                        legalName: A Exchange
                        jurisdiction: Republic Of Korea
                        country: Republic Of Korea
                        licensedStatus: Regulated
                        countryCode: KR
                        vendor: VERIFYVASP
                        vaspStatus: VERIFIED-MEMBER
                      - vaspId: '15952089931162060683'
                        vaspName: B Exchange
                        protocol:
                          - VERIFY-NAME
                        legalName: B Exchange
                        jurisdiction: Singapore
                        country: Singapore
                        licensedStatus: Regulated
                        countryCode: SG
                        vendor: CODE
                        vaspStatus: INTEROPERATED
        '400':
          description: 400 Bad Request Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: |
                      400 Error message.  
                      It could be returned in the following cases.  
                        1. Invalid input parameters.  
                        2. Missing Required Parameters.
                    example: INVALID-PROTOCOL
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in **code**.
                    example: >-
                      `protocol` is invalid value. The allowed protocols
                      [TRAVEL-RULE, VERIFY-NAME]
              examples:
                400 Error Example:
                  value:
                    code: INVALID-PROTOCOL
                    message: >-
                      `protocol` is invalid value. The allowed protocols
                      [TRAVEL-RULE, VERIFY-NAME]
        '408':
          description: 408 Request Timeout Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      408 Error message.  

                      It could be returned in the following cases.   When a
                      timeout occurs during the processing of a request.
                    example: REQUEST-TIMEOUT
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in **code**.
                    example: timeout of 5000ms exceeded
              examples:
                408 Error Example:
                  value:
                    code: REQUEST-TIMEOUT
                    message: timeout of 5000ms exceeded
  /v1/vasps/self:
    get:
      summary: Get VASP ID API
      tags:
        - VN Enclave API
      operationId: verifyname-get-Vasp-Id
      x-readme:
        explorer-enabled: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  vaspId:
                    type: string
                    description: |
                      Unique identifier of VASP that supporting VerifyName.
                    example: '15952089931162060684'
              examples:
                Successful Example:
                  value:
                    vaspId: '15952089931162058999'
        '408':
          description: 408 Request Timeout Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      408 Error message.  

                      It could be returned in the following cases.   When a
                      timeout occurs during the processing of a request.
                    example: REQUEST-TIMEOUT
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in **code**.
                    example: timeout of 5000ms exceeded
              examples:
                408 Error Example:
                  value:
                    code: REQUEST-TIMEOUT
                    message: timeout of 5000ms exceeded
  /v2/owner-verifications:
    post:
      operationId: verifyname-owner-verification
      summary: Request Owner Verification API
      tags:
        - VN Enclave API
      x-readme:
        explorer-enabled: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - supplementary_data
              properties:
                supplementary_data:
                  type: object
                  required:
                    - envelope
                  properties:
                    envelope:
                      type: object
                      required:
                        - key_type
                        - vasp_id
                        - type
                        - ticker
                        - address
                      properties:
                        key_type:
                          type: string
                          enum:
                            - PerVasp
                            - PerAddress
                            - PerVerification
                          description: "The type of Public Key to be used for encrypting personal information.\n\nThe default value is\_**PerVasp**. PerAddress and PerVerification can also be entered.\n\nThe Beneficiary VASP must provide the Public Key corresponding to the Key Type specified by the Originating VASP in this field.\n\nExplanation of allowed values:\n- **PerVasp**: A single key shared across all verifications for a VASP.\n- **PerAddress**: A unique key is generated for each beneficiary address.\n- **PerVerification**: A new key is generated for every verification request.\n"
                          example: PerVasp
                        vasp_id:
                          type: string
                          description: |
                            Unique identifier of counterparty VASP.
                          example: '15952089931162060684'
                        type:
                          type: string
                          enum:
                            - VerifyOriginator
                            - VerifyBeneficiary
                          description: "Indication of verification type.\nAcceptable type values are one of\_**VerifyOriginator**,\_**VerifyBeneficiary**.\n"
                          example: VerifyOriginator
                        ticker:
                          type: string
                          description: |
                            The symbol of the virtual asset to be transferred.
                          example: ETH
                        network:
                          type: string
                          description: >
                            The network of the virtual asset to be transferred.
                            The network field can be implemented conditionally.
                          example: ETHEREUM
                        address:
                          type: string
                          description: |
                            The address of the wallet.
                          example: '0xBb3fd383d1C5540E52EF0A7bcb9433375793aEAF'
                        tag:
                          type: string
                          description: >
                            The wallet address tag(secondary address such as
                            XRP, XLM, EOS, etc...), regardless VerifyOriginator
                            or VerifyBeneficiary.
                          example: '3256697931'
                        dti:
                          type: string
                          description: >
                            Digital Token Identifier (DTI) based on the ISO
                            24165 standard.
                          example: 4H95J0R2X
                        tx_hash:
                          type: string
                          description: >
                            Unique identifier of the transaction. If the value
                            of **type** is **VerifyOriginator**, this field must
                            be required.
                          example: >-
                            8a54d58ca4100112a5430818776d74898f2232770bae03046862575cb851a042
                        creditor:
                          type: object
                          description: >
                            An object containing information about the Owner's
                            information when the type is **VerifyBeneficiary**.
                          required:
                            - name
                            - identification
                          properties:
                            name:
                              type: string
                              description: |
                                The name of the Owner.
                            supplementary_data:
                              type: object
                              properties:
                                name:
                                  type: object
                                  required:
                                    - first_name
                                  properties:
                                    first_name:
                                      type: string
                                      description: |
                                        The first name of the Owner.
                                      example: JOHN
                                    last_name:
                                      type: string
                                      description: |
                                        The last name of the Owner.
                                      example: DOE
                            identification:
                              type: object
                              description: >
                                An object containing information about the
                                Owner's identification.
                              properties:
                                private_identification:
                                  type: object
                                  properties:
                                    date_and_place_of_birth:
                                      type: object
                                      required:
                                        - birth_date
                                      properties:
                                        birth_date:
                                          type: string
                                          description: |
                                            Date of Birth.
                                          example: '2025-01-01'
                                organisation_identification:
                                  type: object
                                  description: >
                                    An object containing information about the
                                    legal organisation identification.
                                  required:
                                    - supplementary_data
                                  properties:
                                    supplementary_data:
                                      type: object
                                      required:
                                        - envelope
                                      properties:
                                        envelope:
                                          type: object
                                          required:
                                            - date_of_incorporation
                                          properties:
                                            date_of_incorporation:
                                              type: string
                                              description: |
                                                Date of incorporation.
                                              example: '2025-01-01'
                                    lei:
                                      type: string
                                      description: |
                                        Legal Entity Identifier (LEI).
                                      example: 506700GE1G29325QX363
                                    bic:
                                      type: string
                                      description: >
                                        Business Identifier Code (BIC). A code
                                        defined in accordance with the ISO 9362
                                        standard for identifying financial and
                                        non-financial institutions.

                                        - also known as a SWIFT code, is an 8-11
                                        character code used to identify banks
                                        and their branches globally.
                                      example: HBUKGB4B
                                    other:
                                      type: object
                                      description: >
                                        MATCHED is returned only if both the
                                        provided identification and issuer
                                        exactly match the values stored in the
                                        Enclave server.
                                      required:
                                        - identification
                                        - issuer
                                      properties:
                                        identification:
                                          type: string
                                          description: |
                                            Business Registration Number.
                                          example: 5493001KJTIIGC8Y1R12
                                        issuer:
                                          type: string
                                          description: >
                                            Issuing Authority for the Business
                                            Registration Number
                                          example: ISO17442
                        debtor:
                          type: object
                          description: >
                            An object containing information about the Owner's
                            information when the type is **VerifyOriginator**.
                          required:
                            - name
                            - identification
                          properties:
                            name:
                              type: string
                              description: |
                                The name of the Owner.
                            supplementary_data:
                              type: object
                              properties:
                                name:
                                  type: object
                                  required:
                                    - first_name
                                  properties:
                                    first_name:
                                      type: string
                                      description: |
                                        The first name of the Owner.
                                      example: JOHN
                                    last_name:
                                      type: string
                                      description: |
                                        The last name of the Owner.
                                      example: DOE
                            identification:
                              type: object
                              description: >
                                An object containing information about the
                                Owner's identification.
                              properties:
                                private_identification:
                                  type: object
                                  properties:
                                    date_and_place_of_birth:
                                      type: object
                                      required:
                                        - birth_date
                                      properties:
                                        birth_date:
                                          type: string
                                          description: |
                                            Date of Birth.
                                          example: '2025-01-01'
                                organisation_identification:
                                  type: object
                                  description: >
                                    An object containing information about the
                                    legal organisation identification.
                                  required:
                                    - supplementary_data
                                  properties:
                                    supplementary_data:
                                      type: object
                                      required:
                                        - envelope
                                      properties:
                                        envelope:
                                          type: object
                                          required:
                                            - date_of_incorporation
                                          properties:
                                            date_of_incorporation:
                                              type: string
                                              description: |
                                                Date of incorporation.
                                              example: '2025-01-01'
                                    lei:
                                      type: string
                                      description: |
                                        Legal Entity Identifier (LEI).
                                      example: 506700GE1G29325QX363
                                    bic:
                                      type: string
                                      description: >
                                        Business Identifier Code (BIC). A code
                                        defined in accordance with the ISO 9362
                                        standard for identifying financial and
                                        non-financial institutions.

                                        - also known as a SWIFT code, is an 8-11
                                        character code used to identify banks
                                        and their branches globally.
                                      example: HBUKGB4B
                                    other:
                                      type: object
                                      description: >
                                        MATCHED is returned only if both the
                                        provided identification and issuer
                                        exactly match the values stored in the
                                        Enclave server.
                                      required:
                                        - identification
                                        - issuer
                                      properties:
                                        identification:
                                          type: string
                                          description: |
                                            Business Registration Number.
                                          example: 5493001KJTIIGC8Y1R12
                                        issuer:
                                          type: string
                                          description: >
                                            Issuing Authority for the Business
                                            Registration Number
                                          example: ISO17442
            examples:
              Request Example:
                value:
                  supplementary_data:
                    envelope:
                      vasp_id: '15952089931162060684'
                      type: VerifyBeneficiary
                      ticker: ETH
                      network: ETH
                      address: '0x5811001506550d8356a215be229c15b6ef371a9b'
                  creditor:
                    name: HONG KIL DONG
                    supplementary_data:
                      envelope:
                        name:
                          first_name: GIL DONG
                          last_name: HONG
                        identification:
                          private_identification:
                            date_and_place_of_birth:
                              birth_date: '2025-01-01'
      responses:
        '200':
          description: 200 Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - request_id
                  - verification_results
                  - verified_at
                properties:
                  request_id:
                    type: string
                    description: >
                      A unique identifier for the Owner Verification request.


                      The format of `request_id` must follow the UUID v4
                      standard.
                    example: 4615aa9d-ac64-4997-a9e6-0e772c57c7ef
                  verification_results:
                    type: object
                    properties:
                      ticker:
                        type: string
                        description: |
                          The result of the Ticker verification.
                        example: MATCHED
                      network:
                        type: string
                        description: |
                          The result of the Network verification.
                        example: MATCHED
                      address:
                        type: string
                        description: |
                          The result of the Address verification.
                        example: MATCHED
                      tx_hash:
                        type: string
                        description: |
                          The result of the Tx_Hash verification.
                        example: MATCHED
                      dti:
                        type: string
                        description: |
                          The result of the DTI verification.
                        example: MATCHED
                      name:
                        type: string
                        description: |
                          The result of the name verification.
                        example: MATCHED
                      birth_date:
                        type: string
                        description: |
                          The result of the Date of Birth verification.
                        example: SKIPPED
                      date_of_incorporation:
                        type: string
                        description: |
                          The result of the Date of Incorporation verification.
                        example: SKIPPED
                      organisation_identification:
                        type: string
                        description: >
                          The result of the Organisation Identification
                          verification.
                        example: 'SKIPPED '
                  verified_at:
                    type: string
                    description: >
                      Timestamp of the completion of the Owner Verification.

                      This field must follow the UTC ISO 8601 datetime
                      representation standard.
                    example: '2025-04-21T04:16:01.339Z'
              examples:
                Successful Example:
                  value:
                    request_id: 5be3c01e-2f3f-4536-a662-6c58f0465c57
                    verification_results:
                      ticker: MATCHED
                      network: MATCHED
                      address: MATCHED
                      tx_hash: MATCHED
                      dti: SKIPPED
                      name: MATCHED
                      birth_date: MATCHED
                      date_of_incorporation: SKIPPED
                      organisation_identification: SKIPPED
                    verified_at: '2022-03-03T12:45:34.085Z'
        '400':
          description: Error Response of Verification API
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: |
                      400 Error message.  
                      It could be returned in the following cases.  
                        1. Invalid input parameters.  
                        2. Missing Required Parameters.
                    example: INVALID-PROTOCOL
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in **code**.
                    example: >-
                      `protocol` is invalid value. The allowed protocols
                      [TRAVEL-RULE, VERIFY-NAME]
              examples:
                Invalid Parameter Example:
                  value:
                    code: MISSING-ORG-OTHER-ISSUER
                    message: organisation_identification.other.issuer is required.
        '408':
          description: 408 Request Timeout Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: >
                      408 Error message.  

                      It could be returned in the following cases.   When a
                      timeout occurs during the processing of a request.
                    example: REQUEST-TIMEOUT
                  message:
                    type: string
                    description: |
                      Explanation about the error that is returned in **code**.
                    example: timeout of 5000ms exceeded
              examples:
                408 Error Example:
                  value:
                    code: REQUEST-TIMEOUT
                    message: timeout of 5000ms exceeded
    get:
      operationId: verifyname-list-owner-verification
      tags:
        - VN Enclave API
      x-readme:
        explorer-enabled: false
      summary: List Owner Verification Result API
      parameters:
        - name: from_date
          in: query
          required: false
          schema:
            type: string
            description: >
              The start date for querying a specific point in time.   The format
              of from_date must follow ISO 8601(YYYY-MM-DD) standard.
            example: '2022-01-01'
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            description: >
              The end date for querying a specific point in time.   The format
              of from_date must follow ISO 8601(YYYY-MM-DD) standard.
            example: '2022-01-01'
        - name: ticker
          in: query
          schema:
            type: string
            description: |
              The symbol of the virtual asset to be transferred.
            example: ETH
        - name: network
          in: query
          schema:
            type: string
            description: >
              The network of the virtual asset to be transferred. The network
              field can be implemented conditionally. Valid values for this
              field can be found [here]().
            example: ETHEREUM
        - name: tx_hash
          in: query
          schema:
            type: string
            description: |
              Unique identifier of the transaction.
            example: 8a54d58ca4100112a5430818776d74898f2232770bae03046862575cb851a042
        - name: address
          in: query
          schema:
            type: string
            description: |
              The address of the wallet storing the virtual asset.
            example: '0xBb3fd383d1C5540E52EF0A7bcb9433375793aEAF'
        - name: request_vasp_id
          in: query
          required: false
          schema:
            type: string
            description: |
              The Vasp ID for the Owner Verification request.
            example: '17624187478910414848'
        - name: response_vasp_id
          in: query
          required: false
          schema:
            type: string
            description: |
              The Vasp ID for the Owner Verification response.
            example: '17624187478910414848'
        - name: request_id
          in: query
          schema:
            type: string
            description: |
              A unique identifier for the Owner Verification request.
              The format of `request_id` must follow the UUID v4 standard.
            example: 4615aa9d-ac64-4997-a9e6-0e772c57c7ef
        - name: tag
          in: query
          schema:
            type: string
            description: >
              The wallet address tag(secondary address such as XRP, XLM, EOS,
              etc...), regardless VerifyOriginator or VerifyBeneficiary.
            example: '3256697931'
        - name: dti
          in: query
          schema:
            type: string
            description: |
              Digital Token Identifier (DTI) based on the ISO 24165 standard.
            example: 4H95J0R2X
        - name: vout
          in: query
          schema:
            type: string
            description: >
              In cases where multiple transfers can be included in a single
              transaction, such as Bitcoin, an index value indicating which
              transfer corresponds to within a single transaction
            example: '0'
        - name: result
          in: query
          required: false
          schema:
            type: string
            description: |
              The result of the verification.
            enum:
              - VERIFIED
              - DENIED
              - ERROR
            example: VERIFIED
        - name: type
          in: query
          schema:
            type: string
            enum:
              - VerifyOriginator
              - VerifyBeneficiary
            description: "Indication of verification type.\nAcceptable type values are one of\_**VerifyOriginator**,\_**VerifyBeneficiary**.\n"
            example: VerifyOriginator
        - name: status
          in: query
          required: false
          schema:
            type: string
            description: |
              The status of the Owner Verification.
            enum:
              - REQUESTED
              - REPORTED
              - INQUIRED
              - ERROR
            example: PENDING
        - name: page
          in: query
          required: false
          schema:
            type: integer
            description: |
              The page number of the response.   The default value is 1.
            example: 1
        - name: rpp
          in: query
          required: false
          schema:
            type: integer
            description: |
              The number of records per page.   The default value is 10.
            example: 10
      responses:
        '200':
          description: 200 Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                  - page
                  - rpp
                  - owner_verifications
                properties:
                  count:
                    type: integer
                    description: |
                      The total number of the results.
                    example: 1
                  page:
                    type: integer
                    description: |
                      The page number of the response.  
                      The default value is 1.
                    example: 1
                  rpp:
                    type: integer
                    description: |
                      The number of records per page.  
                      The default value is 10.
                    example: 1
                  owner_verifications:
                    type: array
                    items:
                      type: object
                      required:
                        - request_id
                        - type
                        - request_vasp_id
                        - response_vasp_id
                        - results
                        - reported_result
                        - reason
                        - message
                        - tx_hash
                        - vout
                        - ticker
                        - network
                        - address
                        - tag
                        - dti
                        - status
                        - verified_at
                        - ordered_at
                        - updated_at
                        - created_at
                      properties:
                        request_id:
                          type: string
                          description: >
                            A unique identifier for the Owner Verification
                            request.


                            The format of `request_id` must follow the UUID v4
                            standard.
