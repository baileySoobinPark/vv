openapi: 3.0.1
info:
  title: TR Integration Steps KR
  version: '1.0'
  description: Management of VerifyVASP API Spec.
servers:
  - url: https://{vasp-endpoint}
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Bearer <VEGA_VERIFICATION_AUTHORIZATION_TOKEN>
paths:
  /VASP_CUSTOM_PATH_VERIFY_USER_ACCOUNT:
    post:
      summary: Verify User Account API
      description: ''
      security:
        - ApiKeyAuth: []
      operationId: travelrule-User-Account-Verification
      tags:
        - VASP Verification API
      x-readme:
        explorer-enabled: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - originatingVaspId
                - symbol
                - version
                - ivms101
              properties:
                originatingVaspId:
                  type: string
                  description: |
                    Unique identifier of Originating VASP.
                  example: '123456789098765'
                symbol:
                  type: string
                  description: |
                    Symbol of the virtual asset.
                  example: ETH
                network:
                  type: string
                  description: >
                    The network of the virtual asset. Conditionally required by
                    the Beneficiary VASP.
                      
                    **Conditional Use of 'network' Field:**  
                      1. If the Beneficiary VASP requires network field:  
                      Beneficary VASP could return **DENIED** and **UNKNOWN-NETWORK** if the Originating VASP does not provide a network value in the request.  
                        
                      2. If the Beneficiary VASP does not require network field:  
                      Beneficiary VASP can infer the network based on the symbol and return the verification result.
                  example: Ethereum
                version:
                  type: string
                  description: |
                    The version of the IVMS101 messaging protocol being used.
                  example: '1.0'
                ivms101:
                  type: object
                  description: >
                    An object with IVMS101-formatted data containing information
                    about the Originator, OriginatingVASP, Beneficiary, and
                    BeneficiaryVASP.
                  required:
                    - beneficiary
                  properties:
                    beneficiary:
                      type: object
                      description: |
                        An object containing Beneficiary information.
                      required:
                        - accountNumber
                      properties:
                        accountNumber:
                          type: array
                          description: |
                            An array containing wallet addresses.
                          items:
                            type: string
            examples:
              requestexamples:
                value:
                  originatingVaspId: '15952089931162060684'
                  symbol: ETH
                  network: Ethereum
                  version: '1.0'
                  ivms101:
                    beneficiary:
                      accountNumber:
                        - '0x5811001506550d8356a215be229c15b6ef371a9b'
      responses:
        '200':
          description: Successful verification response
          content:
            application/json:
              schema:
                type: object
                required:
                  - accountVerificationResult
                  - verifiedAt
                properties:
                  accountVerificationResult:
                    type: string
                    enum:
                      - VERIFIED
                      - DENIED
                    description: >
                      Result of User Account Verification:  

                      If the result is **DENIED**, the reason field should
                      provide the specific reason.
                    example: VERIFIED
                  reason:
                    type: string
                    enum:
                      - UNKNOWN-SYMBOL
                      - UNKNOWN-NETWORK
                      - UNKNOWN-ADDRESS
                      - MISMATCHED-NAME
                      - UNDEFINED-ERROR
                      - BLACKLISTED
                      - UNVERIFIED-KYC
                    description: |
                      This field provides the reason for verification failure.
                    example: UNKNOWN-ADDRESS
                  verifiedAt:
                    type: string
                    description: >
                      The timestamp when the verification was completed.  
                        
                      This field must follow the UTC ISO 8601 datetime
                      representation standard.
                        
                      **Recommendations**  
                        
                      To ensure consistency across systems, we strongly
                      recommend using the extended format
                      "YYYY-MM-DDThh:mm:ss.sssZ", which includes milliseconds
                      and clearly specifies the UTC timezone.   Other ISO 8601
                      Acceptable Formats:  
                        - Basic format("YYYYMMDDThhmmss.sssZ")  
                        - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")
                    example: '2024-11-25T15:30:00.000Z'
              examples:
                Successful Example:
                  value:
                    accountVerificationResult: VERIFIED
                    verifiedAt: '2022-03-03T12:45:34.085Z'
  /VASP_CUSTOM_PATH_VERIFY_USER:
    post:
      summary: Verify User API
      description: ''
      security:
        - ApiKeyAuth: []
      operationId: travelrule-User-Verification
      tags:
        - VASP Verification API
      x-readme:
        explorer-enabled: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - verificationUuid
                - assetInfo
                - requiredBeneficiaryInfo
                - originatingVaspId
                - version
                - ivms101
              properties:
                verificationUuid:
                  type: string
                  description: >
                    A unique identifier for the User Verification request.  

                    The format of **verificationUuid** must follow the UUID v4
                    standard.
                  example: 4bc03a8f-5679-4358-815c-906aae5557f4
                assetInfo:
                  type: object
                  required:
                    - symbol
                    - amount
                    - isExceedingThreshold
                    - tradePrice
                    - tradeCurrency
                    - tradeISODateTime
                  description: The object of asset information
                  properties:
                    symbol:
                      type: string
                      description: |
                        Symbol of the virtual asset.
                      example: ETH
                    network:
                      type: string
                      description: >
                        The network of the virtual asset.   The network field
                        can be implemented conditionally. 
                          
                        **Conditional Use of 'network' Field:**  
                          1. If the network field is required by the Beneficiary VASP:  
                          If the Originating VASP does not provide a network value in the request, it could be returned as **DENIED** and **UNKNOWN-NETWORK**.  
                            
                          2. If the network field is optional by the Beneficiary VASP:  
                          if the Originating VASP omits the network value, the Beneficiary VASP can infer the network based on the symbol and return the verification result.
                      example: Ethereum
                    amount:
                      type: string
                      description: |
                        The amount of the virtual asset to be transferred.
                      example: '0.024'
                    isExceedingThreshold:
                      type: boolean
                      description: >
                        A boolean field to check whether the fiat-converted
                        amount of the virtual asset to be transferred exceeds
                        the legal threshold.  

                        If the value is false, User Verification for the
                        transaction is not mandatory.   (Legal threshold: 1,000
                        USD or 1,000,000 KRW.)
                      example: true
                    tradePrice:
                      type: string
                      description: >
                        The amount of virtual assets to be transferred,
                        converted into fiat currency.
                      example: '2439800'
                    tradeCurrency:
                      type: string
                      description: >
                        The code of the fiat currency into which the virtual
                        asset is converted.
                      example: KRW
                    tradeISODateTime:
                      type: string
                      description: >
                        The timestamp used as the exchange rate reference when
                        converting the virtual asset to fiat currency.   This
                        field must follow the UTC ISO 8601 datetime
                        representation standard.  
                          
                        **Recommendations**  
                          
                        To ensure consistency across systems, we strongly
                        recommend using the extended format
                        "YYYY-MM-DDThh:mm:ss.sssZ", which includes milliseconds
                        and clearly specifies the UTC timezone.   Other ISO 8601
                        Acceptable Formats:  
                          - Basic format("YYYYMMDDThhmmss.sssZ")    
                          - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")
                      example: '2024-11-25T15:30:00.000Z'
                requiredBeneficiaryInfo:
                  type: string
                  description: >
                    The list of personal information codes required by the
                    Originating VASP to verify the Beneficiary.  

                    The Beneficiary VASP must return the requested Beneficiary
                    personal information using the provided personal information
                    codes in the IVMS101 format.
                  example: NATURAL_PERSON_NAME,ACCOUNT_NUMBER
                originatingVaspId:
                  type: string
                  description: |
                    Unique identifier of Originating VASP.
                  example: '123456789098765'
                version:
                  type: string
                  description: |
                    The version of the IVMS101 messaging protocol being used.
                  example: '1.0'
                ivms101:
                  type: object
                  description: >
                    An object with IVMS101-formatted data that may include
                    information about the Originator, Originating VASP,
                    Beneficiary, and Beneficiary VASP for sending the request.
                  required:
                    - originator
                    - beneficiary
                  properties:
                    originator:
                      type: object
                      required:
                        - originatorPersons
                        - accountNumber
                      description: |
                        An object containing the Originator information.
                      properties:
                        originatorPersons:
                          type: array
                          description: >
                            An array containing the Originator's personal
                            information.
                          items:
                            type: object
                            required:
                              - naturalPerson
                            description: >
                              An object containing details about the natural
                              person.
                            properties:
                              naturalPerson:
                                type: object
                                required:
                                  - name
                                description: >
                                  An object containing details about the natural
                                  person.
                                properties:
                                  name:
                                    type: object
                                    required:
                                      - nameIdentifier
                                    description: |
                                      An object with name details.
                                    properties:
                                      nameIdentifier:
                                        type: array
                                        description: >-
                                          An array containing the name
                                          information.
                                        items:
                                          type: object
                                          required:
                                            - primaryIdentifier
                                            - nameIdentifierType
                                          properties:
                                            primaryIdentifier:
                                              type: string
                                              description: >
                                                The basic representation of a last
                                                name.  

                                                By default, this field is used to enter
                                                the last name. However, if separating
                                                the last name and first name is not
                                                feasible, the full name can be entered
                                                in this field.
                                              example: James
                                            secondaryIdentifier:
                                              type: string
                                              description: >
                                                The basic representation of a first
                                                name.  

                                                This field is primarily used to enter
                                                the first name. If a middle name also
                                                needs to be included, it can be combined
                                                with the first name in this field.
                                              example: James || Jeffry James
                                            nameIdentifierType:
                                              type: string
                                              enum:
                                                - ALIA
                                                - BIRT
                                                - MAID
                                                - LEGL
                                                - MISC
                                              description: >
                                                The type of name identifier.  
                                                  
                                                Refer to the details below for
                                                information about each type of name
                                                identifier:   The following values can
                                                be included:  
                                                  **ALIA**: An alias name, commonly known apart from the legal name.  

                                                  **BIRT**: A birth name.  

                                                  **MAID**: The original name used before a surname change due to marriage.  

                                                  **LEGL**: A legally or officially registered name.  

                                                  **MISC**: Other names that do not fall under the above categories.
                                          example: LEGL
                        accountNumber:
                          type: array
                          description: |
                            An array containing wallet addresses.
                          items:
                            type: string
                    beneficiary:
                      type: object
                      description: |
                        An object containing Beneficiary information.
                      required:
                        - beneficiaryPersons
                        - accountNumber
                      properties:
                        beneficiaryPersons:
                          type: array
                          description: >
                            An array for personal information of Beneficiary.  
                              
                            Name, address, etc. information for individuals or
                            corporations are included.
                          items:
                            type: object
                            required:
                              - naturalPerson
                            description: >
                              An object containing details about the natural
                              person.
                            properties:
                              naturalPerson:
                                type: object
                                required:
                                  - name
                                description: >
                                  An object containing details about the natural
                                  person.
                                properties:
                                  name:
                                    type: object
                                    required:
                                      - nameIdentifier
                                    description: |
                                      An object with name details.
                                    properties:
                                      nameIdentifier:
                                        type: array
                                        description: >-
                                          An array containing the name
                                          information.
                                        items:
                                          type: object
                                          required:
                                            - primaryIdentifier
                                            - nameIdentifierType
                                          properties:
                                            primaryIdentifier:
                                              type: string
                                              description: >
                                                The basic representation of a last
                                                name.  

                                                By default, this field is used to enter
                                                the last name. However, if separating
                                                the last name and first name is not
                                                feasible, the full name can be entered
                                                in this field.
                                              example: James
                                            secondaryIdentifier:
                                              type: string
                                              description: >
                                                The basic representation of a first
                                                name.  

                                                This field is primarily used to enter
                                                the first name. If a middle name also
                                                needs to be included, it can be combined
                                                with the first name in this field.
                                              example: James || Jeffry James
                                            nameIdentifierType:
                                              type: string
                                              enum:
                                                - ALIA
                                                - BIRT
                                                - MAID
                                                - LEGL
                                                - MISC
                                              description: >
                                                The type of name identifier.  
                                                  
                                                Refer to the details below for
                                                information about each type of name
                                                identifier:   The following values can
                                                be included:  
                                                  **ALIA**: An alias name, commonly known apart from the legal name.  

                                                  **BIRT**: A birth name.  

                                                  **MAID**: The original name used before a surname change due to marriage.  

                                                  **LEGL**: A legally or officially registered name.  

                                                  **MISC**: Other names that do not fall under the above categories.
                                          example: LEGL
                        accountNumber:
                          type: array
                          description: |
                            An array containing wallet addresses.
                          items:
                            type: string
            examples:
              requestexamples:
                summary: example of a verification request
                description: >
                  A complete example of a request for user account verification,
                  including asset information, originating VASP details, and
                  IVMS101 data.
                value:
                  verificationUuid: 4bc03a8f-5679-4358-815c-906aae5557f4
                  assetInfo:
                    symbol: ETH
                    network: Ethereum
                    amount: '0.024'
                    isExceedingThreshold: true
                    tradePrice: '2193200'
                    tradeCurrency: KRW
                    tradeISODatetime: '2022-02-06T23:13:43.513Z'
                  requiredBeneficiaryInfo: ACCOUNT_NUMBER,NATURAL_PERSON_NAME
                  originatingVaspId: '123456789098765'
                  version: '1.0'
                  ivms101:
                    originator:
                      originatorPersons:
                        - naturalPerson:
                            name:
                              nameIdentifier:
                                - primaryIdentifier: James
                                  secondaryIdentifier: Din
                                  nameIdentifierType: LEGL
                      accountNumber:
                        - '0x5811001506550d8356a215be229c15b6ef371a9a'
                    beneficiary:
                      beneficiaryPersons:
                        - naturalPerson:
                            name:
                              nameIdentifier:
                                - primaryIdentifier: James
                                  nameIdentifierType: LEGL
                      accountNumber:
                        - '0xb0bFf9721871e22653358956cf59a5FdBF3D752F'
      responses:
        '200':
          description: Successful verification response
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                  - reason
                  - version
                  - ivms101
                properties:
                  result:
                    type: string
                    enum:
                      - VERIFIED
                      - DENIED
                      - ERROR
                    description: |
                      Result of User Account Verification or User Verification.
                    example: VERIFIED
                  reason:
                    type: string
                    enum:
                      - OK
                      - UNKNOWN-SYMBOL
                      - UNKNOWN-NETWORK
                      - UNKNOWN-ADDRESS
                      - MISMATCHED-NAME
                      - LACK-OF-INFORMATION
                      - UNAVAILABLE-INFORMATION
                      - BLACKLISTED
                      - UNVERIFIED-KYC
                      - NOT-ALLOWED
                      - UNDEFINED-ERROR
                    description: >
                      This field provides a detailed explanation of the reason
                      for verification failure.
                    example: UNKNOWN-ADDRESS
                  message:
                    type: string
                    description: |
                      Additional information about the verification result.
                    example: An unidentifiable wallet address.
                  version:
                    type: string
                    description: |
                      The version of the IVMS101 messaging protocol being used.
                    example: '1.0'
                  ivms101:
                    type: object
                    description: >
                      An object containing IVMS101-formatted data, which may
                      include information about the Originator, Originating
                      VASP, Beneficiary, and Beneficiary VASP.
                    required:
                      - beneficiary
                    properties:
                      beneficiary:
                        type: object
                        description: |
                          An object containing Beneficiary information.
                        required:
                          - beneficiaryPersons
                          - accountNumber
                        properties:
                          beneficiaryPersons:
                            type: array
                            description: >
                              Array for personal information of Beneficiary.  
                                
                              Name, address, etc. information for individuals or
                              corporations are included.
                            items:
                              type: object
                              description: >
                                An object containing details about the natural
                                person.
                              properties:
                                naturalPerson:
                                  type: object
                                  description: >
                                    An object containing details about the
                                    natural person.
                                  properties:
                                    name:
                                      type: object
                                      required:
                                        - nameIdentifier
                                      description: |
                                        An object with name details.
                                      properties:
                                        nameIdentifier:
                                          type: array
                                          description: >-
                                            An array containing the name
                                            information.
                                          items:
                                            type: object
                                            required:
                                              - primaryIdentifier
                                              - nameIdentifierType
                                            properties:
                                              primaryIdentifier:
                                                type: string
                                                description: >
                                                  The basic representation of a last
                                                  name.  

                                                  By default, this field is used to enter
                                                  the last name. However, if separating
                                                  the last name and first name is not
                                                  feasible, the full name can be entered
                                                  in this field.
                                                example: James
                                              secondaryIdentifier:
                                                type: string
                                                description: >
                                                  The basic representation of a first
                                                  name.  

                                                  This field is primarily used to enter
                                                  the first name. If a middle name also
                                                  needs to be included, it can be combined
                                                  with the first name in this field.
                                                example: James || Jeffry James
                                              nameIdentifierType:
                                                type: string
                                                enum:
                                                  - ALIA
                                                  - BIRT
                                                  - MAID
                                                  - LEGL
                                                  - MISC
                                                description: >
                                                  The type of name identifier.  
                                                    
                                                  Refer to the details below for
                                                  information about each type of name
                                                  identifier:   The following values can
                                                  be included:  
                                                    **ALIA**: An alias name, commonly known apart from the legal name.  

                                                    **BIRT**: A birth name.  

                                                    **MAID**: The original name used before a surname change due to marriage.  

                                                    **LEGL**: A legally or officially registered name.  

                                                    **MISC**: Other names that do not fall under the above categories.
                                            example: LEGL
                                    geographicAddress:
                                      type: array
                                      description: >

                                        An array containing address
                                        information.  

                                        To use this field, at least one of the
                                        following conditions must be met:  
                                        Required conditions  
                                          1. At least one addressLinemust be present.  
                                          
                                          2. Both streetName and buildingName must be present.  
                                          
                                          3. Both streetName and buildingNumber must be present.  
                                        </details>
                                      items:
                                        type: object
                                        properties:
                                          addressType:
                                            type: string
                                            enum:
                                              - HOME
                                              - BIZZ
                                              - GEOG
                                            description: >
                                              The type of geographic address.  
                                              Allowed values:  
                                                HOME: Home address.  
                                                BIZZ: Business address.  
                                                GEOG: Geographic address.
                                            example: GEOG
                                          townName:
                                            type: string
                                            description: |

                                              The name of the town or district.
                                            example: Yeoksam-dong
                                          addressLine:
                                            type: array
                                            items:
                                              type: string
                                            description: >

                                              A free-form address that identifies a
                                              specific location.   If dividing the
                                              address into components (e.g., province,
                                              city, street name) is difficult, the
                                              full address can be entered as a single
                                              string in addressLine.
                                            example:
                                              - 14 Teheran-ro 4-gil
                                              - Gangnam-gu
                                              - 4th floor
                                          country:
                                            type: string
                                            description: >
                                              The country code of the country of
                                              residence (ISO 3166-1 alpha-2 format).
                                            example: KR
                                    nationalIdentification:
                                      type: object
                                      description: >
                                        An object containing National
                                        Identification information.
                                      properties:
                                        nationalIdentifier:
                                          type: string
                                          description: |
                                            National Identification Number.
                                          example: 12345-67890
                                        nationalIdentifierType:
                                          type: string
                                          enum:
                                            - ARNU
                                            - CCPT
                                            - RAID
                                            - DRLC
                                            - FIIN
                                            - TXID
                                            - SOCS
                                            - IDCD
                                            - LEIX
                                            - MISC
                                          description: >
                                            Type of National Identification.  
                                            Allowed values:  
                                              **ARNU**: Alien Registration Number (assigned to foreigners by the state).  
                                              **CCPT**: Passport Number.  
                                              **RAID**: (For corporations only) Corporate registration number (e.g., business registration number).  
                                              **DRLC**: Driver's License Number.  
                                              **FIIN**: Foreign Investor Identification Number.  
                                              **TXID**: Tax Identification Number (assigned by tax authorities).  
                                              **SOCS**: Social Security or Resident Registration Number.  
                                              **IDCD**: ID Card Number (assigned by a national authority).  
                                              **LEIX**: (For corporations only) Legal Entity Identifier (global identifier under ISO 17442).  
                                              **MISC**: Other types of national identification numbers not defined above.  

                                              Further details can be found in the [IVMS Guide](https://kr-verifyvasp.gitbook.io/verifyvasp/4SIXfxCm5FxXbkiB9pkY/references/ivms101-guide#nationalidentification-type).
                                      example: IDCD
                                    customerIdentification:
                                      type: string
                                      description: |

                                        Customer number of individual.
                                      example: '1234569999'
                                    dateAndPlaceOfBirth:
                                      type: object
                                      properties:
                                        dateOfBirth:
                                          type: string
                                          description: |
                                            Date of birth.  
                                            Allowed format: ISO 8601 ("YYYY-MM-DD").
                                          example: '1985-03-14'
                                        placeOfBirth:
                                          type: string
                                          description: |
                                            Place of birth.
                                          example: Nonsan
                                    countryOfResidence:
                                      type: string
                                      description: >
                                        The country code of the country of
                                        residence.
                                      example: KR
                          accountNumber:
                            type: array
                            description: |
                              An array containing wallet addresses.
                            items:
                              type: string
              examples:
                Successful Example:
                  summary: example of a successful verification response
                  description: >
                    A complete example of a successful verification response
                    including IVMS101 beneficiary data.
                  value:
                    result: VERIFIED
                    reason: OK
                    message: ''
                    version: '1.0'
                    ivms101:
                      beneficiary:
                        beneficiaryPersons:
                          - naturalPerson:
                              name:
                                nameIdentifier:
                                  - primaryIdentifier: James
                                    nameIdentifierType: LEGL
                                localNameIdentifier:
                                  - primaryIdentifier: 김재원
                                    nameIdentifierType: LEGL
                              geographicAddress:
                                - addressType: GEOG
                                  townName: Yeoksam-dong
                                  addressLine:
                                    - 14 Teheran-ro 4-gil, Gangnam-gu
                                    - 4th floor
                                  country: KR
                              nationalIdentification:
                                nationalIdentifier: 12345-67890
                                nationalIdentifierType: IDCD
                              customerIdentification: '1234569999'
                              dateAndPlaceOfBirth:
                                dateOfBirth: '1985-03-14'
                                placeOfBirth: Nonsan
                              countryOfResidence: KR
                        accountNumber:
                          - '0xb0bFf9721871e22653358956cf59a5FdBF3D752F'
  /VASP_CUSTOM_PATH_TRANSACTION_CHECK:
    post:
      summary: Check Trasnaction Status API
      description: ''
      security:
        - ApiKeyAuth: []
      operationId: travelrule-check-Transaction-Status
      tags:
        - VASP Transaction API
      x-readme:
        explorer-enabled: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - verificationUuid
              properties:
                verificationUuid:
                  type: string
                  description: >
                    A unique identifier for the User Verification request.  

                    The format of **verificationUuid** must follow the UUID v4
                    standard.
                  example: 4bc03a8f-5679-4358-815c-906aae5557f4
            examples:
              requestexamples:
                value:
                  originatingVaspId: '15952089931162060684'
      responses:
        '200':
          description: Successful CheckTransactionStatus response
          content:
            application/json:
              schema:
                type: object
                required:
                  - verificationUuid
                  - transactionStatus
                properties:
                  verificationUuid:
                    type: string
                    description: >
                      A unique identifier for the User Verification request.  

                      The format of **verificationUuid** must follow the UUID v4
                      standard.
                    example: 4bc03a8f-5679-4358-815c-906aae5557f4
                  transactionStatus:
                    type: string
                    enum:
                      - PENDING
                      - PROCESSING
                      - WAIT-CONFIRM
                      - CONFIRMED
                      - CANCELED
                    description: |
                      Current status of the virtual asset transaction.  
                        
                      Details of each state:  
                        **PENDING**: The Originating VASP has not yet executed the virtual asset transaction.  
                        
                        **PROCESSING**:The virtual asset transaction has been initiated and is awaiting mining.  
                                      
                        **WAIT-CONFIR**: The transaction has been mined but the block containing it has not achieved finality.  
                        
                        **CONFIRMED**: The virtual asset transaction has been mined, and the block containing the transaction has achieved finality.  
                        
                        **CANCELED**: The Originating VASP has permanently canceled the transaction for a specific reason.
                    example: PROCESSING
                  txHash:
                    type: string
                    description: |
                      Unique identifier of the transaction.
                    example: >-
                      8a54d58ca4100112a5430818776d74898f2232770bae03046862575cb851a042
                  vout:
                    type: string
                    description: |
                      Index of the output in a Bitcoin blockchain transaction.
                    example: '2'
              examples:
                Successful Example:
                  value:
                    originatingVaspId: '15952089931162060684'
                    transactionStatus: PROCESSING
                    txHash: >-
                      8a54d58ca4100112a5430818776d74898f2232770bae03046862575cb851a042
                    vout: '2'
  /VASP_CUSTOM_PATH_CALLBACK:
    post:
      summary: Callback API
      description: ''
      security:
        - ApiKeyAuth: []
      operationId: travelrule-callback
      tags:
        - VASP Callback API
      x-readme:
        explorer-enabled: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - callbackType
                - data
              properties:
                callbackType:
                  type: string
                  enum:
                    - VERIFICATION_RESULT
                    - TX_REPORT
                    - ERROR_REPORT
                    - CHAINALYSIS_KYT_RESULT
                    - REFINITIV_WCO_RESULT
                  description: >
                    A type used to identify a callback request.  

                    For request body examples by callbackType, refer to the
                    Functional Requirements section above.
                  example: VERIFICATION_RESULT
                data:
                  type: object
                  description: |
                    An object containing Callback Data.
                  properties:
                    verificationUuid:
                      type: string
                      description: >
                        A unique identifier for the User Verification request.  

                        The format of **verificationUuid** must follow the UUID
                        v4 standard.
                      example: 4bc03a8f-5679-4358-815c-906aae5557f4
                    verificationResult:
                      type: string
                      enum:
                        - VERIFIED
                        - DENIED
                      description: >
                        Result of User Account Verification:  

                        If the result is **DENIED**, the reason field should
                        provide the specific reason.
                      example: VERIFIED
                    reason:
                      type: string
                      enum:
                        - OK
                        - UNKNOWN-SYMBOL
                        - UNKNOWN-NETWORK
                        - UNKNOWN-ADDRESS
                        - MISMATCHED-NAME
                        - LACK-OF-INFORMATION
                        - UNAVAILABLE-INFORMATION
                        - BLACKLISTED
                        - UNVERIFIED-KYC
                        - NOT-ALLOWED
                        - UNDEFINED-ERROR
                        - BENEFICIARY-ACCOUNT-NOT-MATCHED
                        - REQUEST-TIMEOUT
                      description: |
                        This field provides the reason for verification failure.
                      example: UNKNOWN-ADDRESS
                    message:
                      type: string
                      description: |
                        Additional information about the verification result.
                      example: An unidentifiable wallet address.
                    ivms101:
                      type: object
                      description: >
                        An object containing IVMS101-formatted data, which may
                        include information about the Originator, Originating
                        VASP, Beneficiary, and Beneficiary VASP.
                      required:
                        - beneficiary
                      properties:
                        beneficiary:
                          type: object
                          description: |
                            An object containing Beneficiary information.
                          required:
                            - beneficiaryPersons
                            - accountNumber
                          properties:
                            beneficiaryPersons:
                              type: array
                              description: >
                                Array for personal information of Beneficiary.  
                                  
                                Name, address, etc. information for individuals
                                or corporations are included.
                              items:
                                type: object
                                description: >
                                  An object containing details about the natural
                                  person.
                                properties:
                                  naturalPerson:
                                    type: object
                                    description: >
                                      An object containing details about the
                                      natural person.
                                    properties:
                                      name:
                                        type: object
                                        required:
                                          - nameIdentifier
                                        description: |
                                          An object with name details.
                                        properties:
                                          nameIdentifier:
                                            type: array
                                            description: >-
                                              An array containing the name
                                              information.
                                            items:
                                              type: object
                                              required:
                                                - primaryIdentifier
                                                - nameIdentifierType
                                              properties:
                                                primaryIdentifier:
                                                  type: string
                                                  description: >
                                                    The basic representation of a last
                                                    name.  

                                                    By default, this field is used to enter
                                                    the last name. However, if separating
                                                    the last name and first name is not
                                                    feasible, the full name can be entered
                                                    in this field.
                                                  example: James
                                                secondaryIdentifier:
                                                  type: string
                                                  description: >
                                                    The basic representation of a first
                                                    name.  

                                                    This field is primarily used to enter
                                                    the first name. If a middle name also
                                                    needs to be included, it can be combined
                                                    with the first name in this field.
                                                  example: James || Jeffry James
                                                nameIdentifierType:
                                                  type: string
                                                  enum:
                                                    - ALIA
                                                    - BIRT
                                                    - MAID
                                                    - LEGL
                                                    - MISC
                                                  description: >
                                                    The type of name identifier.  
                                                      
                                                    Refer to the details below for
                                                    information about each type of name
                                                    identifier:   The following values can
                                                    be included:  
                                                      **ALIA**: An alias name, commonly known apart from the legal name.  

                                                      **BIRT**: A birth name.  

                                                      **MAID**: The original name used before a surname change due to marriage.  

                                                      **LEGL**: A legally or officially registered name.  

                                                      **MISC**: Other names that do not fall under the above categories.
                                              example: LEGL
                                      geographicAddress:
                                        type: array
                                        description: >

                                          An array containing address
                                          information.  

                                          To use this field, at least one of the
                                          following conditions must be met:  
                                          Required conditions  
                                            1. At least one addressLinemust be present.  
                                            
                                            2. Both streetName and buildingName must be present.  
                                            
                                            3. Both streetName and buildingNumber must be present.  
                                          </details>
                                        items:
                                          type: object
                                          properties:
                                            addressType:
                                              type: string
                                              enum:
                                                - HOME
                                                - BIZZ
                                                - GEOG
                                              description: >
                                                The type of geographic address.  
                                                Allowed values:  
                                                  HOME: Home address.  
                                                  BIZZ: Business address.  
                                                  GEOG: Geographic address.
                                              example: GEOG
                                            townName:
                                              type: string
                                              description: |

                                                The name of the town or district.
                                              example: Yeoksam-dong
                                            addressLine:
                                              type: array
                                              items:
                                                type: string
                                              description: >

                                                A free-form address that identifies a
                                                specific location.   If dividing the
                                                address into components (e.g., province,
                                                city, street name) is difficult, the
                                                full address can be entered as a single
                                                string in addressLine.
                                              example:
                                                - 14 Teheran-ro 4-gil
                                                - Gangnam-gu
                                                - 4th floor
                                            country:
                                              type: string
                                              description: >
                                                The country code of the country of
                                                residence (ISO 3166-1 alpha-2 format).
                                              example: KR
                                      nationalIdentification:
                                        type: object
                                        description: >
                                          An object containing National
                                          Identification information.
                                        properties:
                                          nationalIdentifier:
                                            type: string
                                            description: |
                                              National Identification Number.
                                            example: 12345-67890
                                          nationalIdentifierType:
                                            type: string
                                            enum:
                                              - ARNU
                                              - CCPT
                                              - RAID
                                              - DRLC
                                              - FIIN
                                              - TXID
                                              - SOCS
                                              - IDCD
                                              - LEIX
                                              - MISC
                                            description: >
                                              Type of National Identification.  
                                              Allowed values:  
                                                **ARNU**: Alien Registration Number (assigned to foreigners by the state).  
                                                **CCPT**: Passport Number.  
                                                **RAID**: (For corporations only) Corporate registration number (e.g., business registration number).  
                                                **DRLC**: Driver's License Number.  
                                                **FIIN**: Foreign Investor Identification Number.  
                                                **TXID**: Tax Identification Number (assigned by tax authorities).  
                                                **SOCS**: Social Security or Resident Registration Number.  
                                                **IDCD**: ID Card Number (assigned by a national authority).  
                                                **LEIX**: (For corporations only) Legal Entity Identifier (global identifier under ISO 17442).  
                                                **MISC**: Other types of national identification numbers not defined above.  

                                                Further details can be found in the [IVMS Guide](https://kr-verifyvasp.gitbook.io/verifyvasp/4SIXfxCm5FxXbkiB9pkY/references/ivms101-guide#nationalidentification-type).
                                        example: IDCD
                                      customerIdentification:
                                        type: string
                                        description: |

                                          Customer number of individual.
                                        example: '1234569999'
                                      dateAndPlaceOfBirth:
                                        type: object
                                        properties:
                                          dateOfBirth:
                                            type: string
                                            description: |
                                              Date of birth.  
                                              Allowed format: ISO 8601 ("YYYY-MM-DD").
                                            example: '1985-03-14'
                                          placeOfBirth:
                                            type: string
                                            description: |
                                              Place of birth.
                                            example: Nonsan
                                      countryOfResidence:
                                        type: string
                                        description: >
                                          The country code of the country of
                                          residence.
                                        example: KR
                            accountNumber:
                              type: array
                              description: |
                                An array containing wallet addresses.
                              items:
                                type: string
            examples:
              requestexamples:
                value:
                  callbackType: VERIFICATION_RESULT
                  data:
                    verificationUuid: 64ab871b-14a3-47df-9b80-368e29fe8180
                    verificationResult: VERIFIED
                    reason: OK
                    message: ''
                    ivms101:
                      beneficiary:
                        beneficiaryPersons:
                          - naturalPerson:
                              name:
                                nameIdentifier:
                                  - primaryIdentifier: James
                                    nameIdentifierType: LEGL
                                localNameIdentifier:
                                  - primaryIdentifier: 김재원
                                    nameIdentifierType: LEGL
                              geographicAddress:
                                - addressType: GEOG
                                  townName: Yeoksam-dong
                                  addressLine:
                                    - 14 Teheran-ro 4-gil, Gangnam-gu
                                    - 4th floor
                                  country: KR
                              nationalIdentification:
                                nationalIdentifier: 12345-67890
                                nationalIdentifierType: IDCD
                              customerIdentification: '1234569999'
                              dateAndPlaceOfBirth:
                                dateOfBirth: '1985-03-14'
                                placeOfBirth: Nonsan
                              countryOfResidence: KR
                        accountNumber:
                          - '0xb0bFf9721871e22653358956cf59a5FdBF3D752F'
      responses:
        '200':
          description: Successful Callback response
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    type: boolean
                    description: >
                      A static result field for callback response. Return
                      **true** always.
                    example: true
              examples:
                success:
                  summary: Successful response
                  value:
                    result: true
  /VASP_CUSTOM_PATH_DECRYPT_DB_ENCKEY:
    post:
      summary: Database Management API
      description: ''
      security:
        - ApiKeyAuth: []
      operationId: travelrule-get-Decrypted-EncKey
      tags:
        - VASP Database Management API
      x-readme:
        explorer-enabled: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - inputKey
              properties:
                inputKey:
                  type: string
                  description: >
                    The Base64-encoded value of **VEGA_ENCRYPTION_KEY_BASE64**,
                    as defined in the Enclave environment variables.
                  example: Y9uIJCLAkzVi2XYZrUDmBYJp3szXlJIUwfLfbLsVeHU=
            examples:
              requestexamples:
                value:
                  inputKey: Y9uIJCLAkzVi2XYZrUDmBYJp3szXlJIUwfLfbLsVeHU=
      responses:
        '200':
          description: Successful Callback response
          content:
            application/json:
              schema:
                type: object
                properties:
                  outputKey:
                    type: string
                    description: |
                      The Base64-encoded database encryption key.
                    example: d0odhtb/jD9qWWTA59koPGgw2jj0ptov56A3b3dfohY=
              examples:
                Successful Example:
                  value:
                    outputKey: d0odhtb/jD9qWWTA59koPGgw2jj0ptov56A3b3dfohY=
