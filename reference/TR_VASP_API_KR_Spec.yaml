  /VASP_DEFINED_PATH_DECRYPT_DB_ENCKEY:
    post:
      summary: Database Management API
      description: |
        ## Get Database Encryption Key API
          This API provides an optional mechanism for securely managing the symmetric key used to encrypt data in the Enclave database. Instead of storing PII like sensitive data in plain text, the Enclave encrypts it using symmetric key encryption before storing it to the database. The symmetric key used for encryption must be generated by your VASP and configured as an environment variable for the Enclave. However, exposing the encryption key directly in the environment file poses a security threat.
          To address this, it is recommended to use a reference value—such as an encrypted encryption key, key ID, or resource name—in the environment variable instead of the actual encryption key. 

          By implementing this API and providing its endpoint, the Enclave can use the reference value to securely retrieve or decrypt the actual key at runtime, loading it into memory only when needed. This approach ensures that the encryption key remains protected while maintaining secure access for the Enclave.

        ## How Enclave works
          When `VEGA_ENCRYPTION_KEY_BASE64` environment variable is set and `VEGA_DECRYPT_API_ENDPOINT` is not set,

          Enclave loads the DB encryption key from the `VEGA_ENCRYPTION_KEY_BASE64` environment as it is, and use the key to encrypt sensitive data before storing.

          When `VEGA_ENCRYPTION_KEY_BASE64` environment variable is set and `VEGA_DECRYPT_API_ENDPOINT` is also set,

          The Enclave retrieves the reference value from the `VEGA_ENCRYPTION_KEY_BASE64` environment variable and calls this API, available at the `VEGA_DECRYPT_API_ENDPOINT`, to retrieve the exact encryption key.

          When calling this API, the Enclave sets the inputKey field in the request body to the reference value.

          Upon receiving the response, the Enclave uses the value of outputKey to encrypt sensitive data.

        ## Functional Requirements
          ### 1. Non-API Requirements: Key Generation & Management
          Your VASP must generate an symmetric encryption key for database encryption and prepare a secure mechanism to manage it. This can include using own encryption module, or leveraging a Key Management System (KMS).

          ### 2. API Requirements
          The API must use the reference value received in the inputKey field of the request to retrieve the actual encryption key. This process can involve either decrypting an encrypted key represented by the reference value or using the reference value (e.g., a key indicator) to securely fetch the key from a Key Management System (KMS) or other secure source.

          Once the actual encryption key is retrieved, the API must return it in the outputKey field of the response. This key will be used by the Enclave for database encryption.

        ## Recommendations
          Avoid configuring the database encryption key in plain text directly in the `VEGA_ENCRYPTION_KEY_BASE64` environment variable, as it poses significant security risks.

          It is strongly recommended to integrate a third-party key management service (KMS) to handle key management securely and implement the API.

          For example, when using a service like AWS KMS, you can set `VEGA_ENCRYPTION_KEY_BASE64` to the AWS ARN of the encryption key. 

          Then, configure `VEGA_DECRYPT_API_ENDPOINT` to point to a server that wraps AWS KMS. This server can retrieve the encryption key from AWS KMS using the ARN and provide it for decryption purposes.

        ## Environment Variable Configuration
          Set the following environment variables as per the guide to integrate the implemented API with the Enclave. For a complete list of Enclave environment variables, [click here](ref:travelrule-enclave-setup).
          - `VEGA_DECRYPT_API_ENDPOINT`: Implement this API at the desired path({VASP_DEFINED_PATH_DECRYPT_DB_ENCKEY}) and set the path in the variable.
          - `VEGA_ENCRYPTION_KEY_BASE64`: Set the reference value for encryption key to this variable.
      security:
        - ApiKeyAuth: []
      operationId: travelrule-get-Decrypted-EncKey
      tags:
        - VASP Database Management API
      x-readme:
        explorer-enabled: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - inputKey
              properties:
                inputKey:
                  type: string
                  description: >
                    The Base64-encoded value of **VEGA_ENCRYPTION_KEY_BASE64**,
                    as defined in the Enclave environment variables.
                  example: Y9uIJCLAkzVi2XYZrUDmBYJp3szXlJIUwfLfbLsVeHU=
            examples:
              requestexamples:
                value:
                  inputKey: Y9uIJCLAkzVi2XYZrUDmBYJp3szXlJIUwfLfbLsVeHU=
      responses:
        '200':
          description: Successful Callback response
          content:
            application/json:
              schema:
                type: object
                properties:
                  outputKey:
                    type: string
                    description: |
                      The Base64-encoded database encryption key.
                    example: d0odhtb/jD9qWWTA59koPGgw2jj0ptov56A3b3dfohY=
              examples:
                Successful Example:
                  value:
                    outputKey: d0odhtb/jD9qWWTA59koPGgw2jj0ptov56A3b3dfohY=
  /VASP_CUSTOM_PATH_VERIFY_USER_ACCOUNT:
    post:
      summary: Verify User Account API
      description: ''
      security:
        - ApiKeyAuth: []
      operationId: travelrule-User-Account-Verification
      tags:
        - VASP Verification API
      x-readme:
        explorer-enabled: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - originatingVaspId
                - symbol
                - version
                - ivms101
              properties:
                originatingVaspId:
                  type: string
                  description: |
                    Unique identifier of Originating VASP.
                  example: '123456789098765'
                symbol:
                  type: string
                  description: |
                    Symbol of the virtual asset.
                  example: ETH
                network:
                  type: string
                  description: >
                    The network of the virtual asset. Conditionally required by
                    the Beneficiary VASP.
                      
                    **Conditional Use of 'network' Field:**  
                      1. If the Beneficiary VASP requires network field:  
                      Beneficary VASP could return **DENIED** and **UNKNOWN-NETWORK** if the Originating VASP does not provide a network value in the request.  
                        
                      2. If the Beneficiary VASP does not require network field:  
                      Beneficiary VASP can infer the network based on the symbol and return the verification result.
                  example: Ethereum
                version:
                  type: string
                  description: |
                    The version of the IVMS101 messaging protocol being used.
                  example: '1.0'
                ivms101:
                  type: object
                  description: >
                    An object with IVMS101-formatted data containing information
                    about the Originator, OriginatingVASP, Beneficiary, and
                    BeneficiaryVASP.
                  required:
                    - beneficiary
                  properties:
                    beneficiary:
                      type: object
                      description: |
                        An object containing Beneficiary information.
                      required:
                        - accountNumber
                      properties:
                        accountNumber:
                          type: array
                          description: |
                            An array containing wallet addresses.
                          items:
                            type: string
            examples:
              requestexamples:
                value:
                  originatingVaspId: '15952089931162060684'
                  symbol: ETH
                  network: Ethereum
                  version: '1.0'
                  ivms101:
                    beneficiary:
                      accountNumber:
                        - '0x5811001506550d8356a215be229c15b6ef371a9b'
      responses:
        '200':
          description: Successful verification response
          content:
            application/json:
              schema:
                type: object
                required:
                  - accountVerificationResult
                  - verifiedAt
                properties:
                  accountVerificationResult:
                    type: string
                    enum:
                      - VERIFIED
                      - DENIED
                    description: >
                      Result of User Account Verification:  

                      If the result is **DENIED**, the reason field should
                      provide the specific reason.
                    example: VERIFIED
                  reason:
                    type: string
                    enum:
                      - UNKNOWN-SYMBOL
                      - UNKNOWN-NETWORK
                      - UNKNOWN-ADDRESS
                      - MISMATCHED-NAME
                      - UNDEFINED-ERROR
                      - BLACKLISTED
                      - UNVERIFIED-KYC
                    description: |
                      This field provides the reason for verification failure.
                    example: UNKNOWN-ADDRESS
                  verifiedAt:
                    type: string
                    description: >
                      The timestamp when the verification was completed.  
                        
                      This field must follow the UTC ISO 8601 datetime
                      representation standard.
                        
                      **Recommendations**  
                        
                      To ensure consistency across systems, we strongly
                      recommend using the extended format
                      "YYYY-MM-DDThh:mm:ss.sssZ", which includes milliseconds
                      and clearly specifies the UTC timezone.   Other ISO 8601
                      Acceptable Formats:  
                        - Basic format("YYYYMMDDThhmmss.sssZ")  
                        - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")
                    example: '2024-11-25T15:30:00.000Z'
              examples:
                Successful Example:
                  value:
                    accountVerificationResult: '15952089931162060684'
                    verifiedAt: '2022-03-03T12:45:34.085Z'
