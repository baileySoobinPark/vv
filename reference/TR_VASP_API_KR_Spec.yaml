openapi: 3.0.1
info:
  title: TR Integration Steps KR
  version: '1.0'
  description: Management of VerifyVASP API Spec.
servers:
  - url: https://{vasp-endpoint}
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Bearer <VEGA_VERIFICATION_AUTHORIZATION_TOKEN>
paths:
  /VASP_DEFINED_PATH_VERIFY_USER:
    post:
      summary: Verify User API
      description: >
        This API must be implemented by your VASP to fulfill its role as a
        Beneficiary VASP. Its primary purpose is to verify the consistency of
        the originator user provided Beneficiary's personal information against
        the Beneficiary VASP managing data, while ensuring compliance with
        KYC/AML and sanction screening requirements.

        By providing this endpoint, your VASP allows the Enclave to delegate
        verification tasks. The Enclave will invoke this API upon receiving
        verification requests from the Originating VASP.


        ### Functional Requirements

        **1. Personal Information Verification**

          - The API must validate whether the personal information provided by the Originating VASP matches the data managed by the Beneficiary VASP.
          - Fields to be matched include:
              - Name: Verify that the Beneficiary's name matches the existing records.
              - Address: Verify that the account number or wallet address matches the existing records.


        **2. Compliance Assurance**

          The verification process must ensure regulatory compliance by performing the following checks and validations for the Beneficiary:
          - **KYC Validation**: Check if the Beneficiary has completed Know Your Customer (KYC) authentication.
          - **AML Validation**: Confirm the Beneficiary complies with Anti-Money Laundering (AML) requirements.
          - **STR Monitoring and Sanction Screening**: Perform Suspicious Transaction Reporting (STR) analysis and sanction screening for the Originator.
          - **Additional Filtering**: Your VASP may conduct extra filtering or verification of the provided personal information for both the Originator and Beneficiary


        **3. Responding to Originating VASP Data Requests**

          Your VASP (Beneficiary VASP) must provide all information requested by the Originating VASP in the requiredBeneficiaryInfo object during the verification process, by filling and returning the ivms101 object with the data.
          - If your VASP does not have or cannot provide the requested information, the API must set verificationResult to `DENIED` and reason to `UNAVAILABLE-INFORMATION`.
          - Only the information explicitly requested in requiredBeneficiaryInfo should be filled. Any fields not requested by the Originating VASP must remain empty.
          - The beneficiary account number (or wallet address) must be returned without modification. Altering the wallet address may result in incorrect deposits. If the deposit address is invalid or incorrect, the API must set verificationResult to `DENIED`.


        **4. Responding with Additional Beneficiary Information and Verification
        Results**

          The API must return the verification result.
          * After verifying both the Originator and Beneficiary information (including addresses and personal details), the API must return the result field as `VERIFIED` if the provided data matches the beneficiary side records and there are no exceptional reasons to deny the asset transfer.
          * If the provided information is insufficient or does not match the details on the Beneficiary's side, or if the account address or its owner is considered high-risk for asset transfer, the API must return the result field as `DENIED`.
          
          Upon successful user verification, the API must return additional personal information about the Beneficiary in the IVMS101 messaging format.


        **5. Failure Reason Specification**

          When the result field is set to `DENIED`, the reason field in the response must specify the reason for the failure. The allowed values for this field are as follows:

        | Reason Code             | Message                            |
        Description |

        |-------------------------|-------------------------------------|-------------|

        | `UNKNOWN-SYMBOL`        | `"ETH"`                             | Error
        code returned when the virtual asset symbol entered by the Originating
        VASP is not supported by the Beneficiary VASP. |

        | `UNKNOWN-NETWORK`       | `"Ethereum"`                        | Error
        code returned when the network entered by the Originating VASP is either
        not supported by the Beneficiary VASP or contains insufficient network
        information. <br>This error is also returned if the asset symbol matches
        but the network does not (e.g., sending `USDT` with `ETH` network when
        only `USDT` on Tron is supported). |

        | `UNKNOWN-ADDRESS`       | `"0x... is not registered."`        | Error
        code returned when the wallet address entered by the Originating VASP
        does not belong to a wallet managed by the Beneficiary VASP. |

        | `LACK-OF-INFORMATION`   | `"ACCOUNT_NUMBER"`                  | Error
        code returned when the information about the Originator is insufficient
        for the Beneficiary VASP to perform verification. |

        | `UNAVAILABLE-INFORMATION` | `"ACCOUNT_NUMBER"`               | Error
        code returned when the Beneficiary VASP does not possess or cannot
        provide certain personal information requested by the Originating VASP.
        |

        | `BLACKLISTED`           | `"0x.. is listed on the blacklist."` | Error
        code returned when the sanction screening results for the Originator
        indicate a compliance issue. |

        | `UNVERIFIED-KYC`        | `"0x.. is unverified KYC"`          | Error
        code returned when the Beneficiary has not completed the KYC
        verification process with the Beneficiary VASP.|

        | `MISMATCHED-NAME`       | `"Name is not matched."`            | Error
        code returned when the Beneficiary's name does not match the name
        provided by the Originating VASP. |

        | `NOT-ALLOWED`           | `"This user is locked by internal policy."`
        | Error code returned when the Beneficiary VASP rejects the user
        verification for any reason. |

        | `UNDEFINED-ERROR`       | `"Undefined Error is occurred."`    | Error
        code returned when an error occurs that is not defined in the specified
        cases. |

        ### Constraints


        - This API **must respond within 5 seconds**.


        ### Recommendations


        Virtual asset transfers **below the threshold set by regulations** are
        **not subject to the Travel Rule**, and **beneficiary name verification
        is not mandatory**.

        - **We highly recommend using the TravelRule Protocol for all
        transactions**, regardless of differing thresholds across jurisdictions,
        to ensure secure and compliant transfers reduce operational resources.


        - If the `isExceedingThreshold` field in the Originating VASP's request
        is set to `false` the transfer **is not subject to the Travel Rule**,
        and **User verification is not mandatory** in such cases, the virtual
        asset **can be transferred without further verification**.


        ### Environment Variable Configuration


        Set the following environment variables as per the integration guide to
        connect the implemented API with the Enclave.  

        For a complete list of Enclave environment variables, [click
        here](ref:travelrule-enclave-setup).


        - `VEGA_VERIFICATION_API_PATH`  
          Implement this API at the desired path (`{VASP_DEFINED_PATH_VERIFY_USER}`) and set the path in the variable.

        - `VEGA_VERIFICATION_AUTHORIZATION_TOKEN`  
          Set this variable to the **API key provided during your VerifyVASP onboarding process**.
      security:
        - ApiKeyAuth: []
      operationId: travelrule-User-Verification
      tags:
        - VASP Verification API
      x-readme:
        explorer-enabled: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - verificationUuid
                - assetInfo
                - requiredBeneficiaryInfo
                - originatingVaspId
                - version
                - ivms101
              properties:
                verificationUuid:
                  type: string
                  description: >
                    A unique identifier for the User Verification request.  

                    The format of **verificationUuid** must follow the UUID v4
                    standard.
                  example: 4bc03a8f-5679-4358-815c-906aae5557f4
                assetInfo:
                  type: object
                  required:
                    - symbol
                    - amount
                    - isExceedingThreshold
                    - tradePrice
                    - tradeCurrency
                    - tradeISODateTime
                  description: The object of asset information
                  properties:
                    symbol:
                      type: string
                      description: |
                        Symbol of the virtual asset.
                      example: ETH
                    network:
                      type: string
                      description: >
                        The network of the virtual asset.   The network field
                        can be implemented conditionally. 
                          
                        **Conditional Use of 'network' Field:**  
                          1. If the network field is required by the Beneficiary VASP:  
                          If the Originating VASP does not provide a network value in the request, it could be returned as **DENIED** and **UNKNOWN-NETWORK**.  
                            
                          2. If the network field is optional by the Beneficiary VASP:  
                          if the Originating VASP omits the network value, the Beneficiary VASP can infer the network based on the symbol and return the verification result.
                      example: Ethereum
                    amount:
                      type: string
                      description: |
                        The amount of the virtual asset to be transferred.
                      example: '0.024'
                    isExceedingThreshold:
                      type: boolean
                      description: >
                        A boolean field to check whether the fiat-converted
                        amount of the virtual asset to be transferred exceeds
                        the legal threshold.  

                        If the value is false, User Verification for the
                        transaction is not mandatory.   (Legal threshold: 1,000
                        USD or 1,000,000 KRW.)
                      example: true
                    tradePrice:
                      type: string
                      description: >
                        The amount of virtual assets to be transferred,
                        converted into fiat currency.
                      example: '2439800'
                    tradeCurrency:
                      type: string
                      description: >
                        The code of the fiat currency into which the virtual
                        asset is converted.
                      example: KRW
                    tradeISODateTime:
                      type: string
                      description: >
                        The timestamp used as the exchange rate reference when
                        converting the virtual asset to fiat currency.   This
                        field must follow the UTC ISO 8601 datetime
                        representation standard.  
                          
                        **Recommendations**  
                          
                        To ensure consistency across systems, we strongly
                        recommend using the extended format
                        "YYYY-MM-DDThh:mm:ss.sssZ", which includes milliseconds
                        and clearly specifies the UTC timezone.   Other ISO 8601
                        Acceptable Formats:  
                          - Basic format("YYYYMMDDThhmmss.sssZ")    
                          - Format with desiganted timezone("YYYY-MM-DDThh:mm:ss±hh:mm")
                      example: '2024-11-25T15:30:00.000Z'
                requiredBeneficiaryInfo:
                  type: string
                  description: >
                    The list of personal information codes required by the
                    Originating VASP to verify the Beneficiary.  

                    The Beneficiary VASP must return the requested Beneficiary
                    personal information using the provided personal information
                    codes in the IVMS101 format.
                  example: NATURAL_PERSON_NAME,ACCOUNT_NUMBER
                originatingVaspId:
                  type: string
                  description: |
                    Unique identifier of Originating VASP.
                  example: '123456789098765'
                version:
                  type: string
                  description: |
                    The version of the IVMS101 messaging protocol being used.
                  example: '1.0'
                ivms101:
                  type: object
                  description: >
                    An object with IVMS101-formatted data that may include
                    information about the Originator, Originating VASP,
                    Beneficiary, and Beneficiary VASP for sending the request.
                  required:
                    - originator
                    - beneficiary
                  properties:
                    originator:
                      type: object
                      required:
                        - originatorPersons
                        - accountNumber
                      description: |
                        An object containing the Originator information.
                      properties:
                        originatorPersons:
                          type: array
                          description: >
                            An array containing the Originator's personal
                            information.
                          items:
                            type: object
                            required:
                              - naturalPerson
                            description: >
                              An object containing details about the natural
                              person.
                            properties:
                              naturalPerson:
                                type: object
                                required:
                                  - name
                                description: >
                                  An object containing details about the natural
                                  person.
                                properties:
                                  name:
                                    type: object
                                    required:
                                      - nameIdentifier
                                    description: |
                                      An object with name details.
                                    properties:
                                      nameIdentifier:
                                        type: array
                                        description: >-
                                          An array containing the name
                                          information.
                                        items:
                                          type: object
                                          required:
                                            - primaryIdentifier
                                            - nameIdentifierType
                                          properties:
                                            primaryIdentifier:
                                              type: string
                                              description: >
                                                The basic representation of a last
                                                name.  

                                                By default, this field is used to enter
                                                the last name. However, if separating
                                                the last name and first name is not
                                                feasible, the full name can be entered
                                                in this field.
                                              example: James
                                            secondaryIdentifier:
                                              type: string
                                              description: >
                                                The basic representation of a first
                                                name.  

                                                This field is primarily used to enter
                                                the first name. If a middle name also
                                                needs to be included, it can be combined
                                                with the first name in this field.
                                              example: James || Jeffry James
                                            nameIdentifierType:
                                              type: string
                                              enum:
                                                - ALIA
                                                - BIRT
                                                - MAID
                                                - LEGL
                                                - MISC
                                              description: >
                                                The type of name identifier.  
                                                  
                                                Refer to the details below for
                                                information about each type of name
                                                identifier:   The following values can
                                                be included:  
                                                  **ALIA**: An alias name, commonly known apart from the legal name.  

                                                  **BIRT**: A birth name.  

                                                  **MAID**: The original name used before a surname change due to marriage.  

                                                  **LEGL**: A legally or officially registered name.  

                                                  **MISC**: Other names that do not fall under the above categories.
                                          example: LEGL
                        accountNumber:
                          type: array
                          description: |
                            An array containing wallet addresses.
                          items:
                            type: string
                    beneficiary:
                      type: object
                      description: |
                        An object containing Beneficiary information.
                      required:
                        - beneficiaryPersons
                        - accountNumber
                      properties:
                        beneficiaryPersons:
                          type: array
                          description: >
                            An array for personal information of Beneficiary.  
                              
                            Name, address, etc. information for individuals or
                            corporations are included.
                          items:
                            type: object
                            required:
                              - naturalPerson
                            description: >
                              An object containing details about the natural
                              person.
                            properties:
                              naturalPerson:
                                type: object
                                required:
                                  - name
                                description: >
                                  An object containing details about the natural
                                  person.
                                properties:
                                  name:
                                    type: object
                                    required:
                                      - nameIdentifier
                                    description: |
                                      An object with name details.
                                    properties:
                                      nameIdentifier:
                                        type: array
                                        description: >-
                                          An array containing the name
                                          information.
                                        items:
                                          type: object
                                          required:
                                            - primaryIdentifier
                                            - nameIdentifierType
                                          properties:
                                            primaryIdentifier:
                                              type: string
                                              description: >
                                                The basic representation of a last
                                                name.  

                                                By default, this field is used to enter
                                                the last name. However, if separating
                                                the last name and first name is not
                                                feasible, the full name can be entered
                                                in this field.
                                              example: James
                                            secondaryIdentifier:
                                              type: string
                                              description: >
                                                The basic representation of a first
                                                name.  

                                                This field is primarily used to enter
                                                the first name. If a middle name also
                                                needs to be included, it can be combined
                                                with the first name in this field.
                                              example: James || Jeffry James
                                            nameIdentifierType:
                                              type: string
                                              enum:
                                                - ALIA
                                                - BIRT
                                                - MAID
                                                - LEGL
                                                - MISC
                                              description: >
                                                The type of name identifier.  
                                                  
                                                Refer to the details below for
                                                information about each type of name
                                                identifier:   The following values can
                                                be included:  
                                                  **ALIA**: An alias name, commonly known apart from the legal name.  

                                                  **BIRT**: A birth name.  

                                                  **MAID**: The original name used before a surname change due to marriage.  

                                                  **LEGL**: A legally or officially registered name.  

                                                  **MISC**: Other names that do not fall under the above categories.
                                          example: LEGL
                        accountNumber:
                          type: array
                          description: |
                            An array containing wallet addresses.
                          items:
                            type: string
            examples:
              requestexamples:
                summary: example of a verification request
                description: >
                  A complete example of a request for user account verification,
                  including asset information, originating VASP details, and
                  IVMS101 data.
                value:
                  verificationUuid: 4bc03a8f-5679-4358-815c-906aae5557f4
                  assetInfo:
                    symbol: ETH
                    network: Ethereum
                    amount: '0.024'
                    isExceedingThreshold: true
                    tradePrice: '2193200'
                    tradeCurrency: KRW
                    tradeISODatetime: '2022-02-06T23:13:43.513Z'
                  requiredBeneficiaryInfo: ACCOUNT_NUMBER,NATURAL_PERSON_NAME
                  originatingVaspId: '123456789098765'
                  version: '1.0'
                  ivms101:
                    originator:
                      originatorPersons:
                        - naturalPerson:
                            name:
                              nameIdentifier:
                                - primaryIdentifier: James
                                  secondaryIdentifier: Din
                                  nameIdentifierType: LEGL
                      accountNumber:
                        - '0x5811001506550d8356a215be229c15b6ef371a9a'
                    beneficiary:
                      beneficiaryPersons:
                        - naturalPerson:
                            name:
                              nameIdentifier:
                                - primaryIdentifier: James
                                  nameIdentifierType: LEGL
                      accountNumber:
                        - '0xb0bFf9721871e22653358956cf59a5FdBF3D752F'
      responses:
        '200':
          description: Successful verification response
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                  - reason
                  - version
                  - ivms101
                properties:
                  result:
                    type: string
                    enum:
                      - VERIFIED
                      - DENIED
                      - ERROR
                    description: |
                      Result of User Account Verification or User Verification.
                    example: VERIFIED
                  reason:
                    type: string
                    enum:
                      - OK
                      - UNKNOWN-SYMBOL
                      - UNKNOWN-NETWORK
                      - UNKNOWN-ADDRESS
                      - MISMATCHED-NAME
                      - LACK-OF-INFORMATION
                      - UNAVAILABLE-INFORMATION
                      - BLACKLISTED
                      - UNVERIFIED-KYC
                      - NOT-ALLOWED
                      - UNDEFINED-ERROR
                    description: >
                      This field provides a detailed explanation of the reason
                      for verification failure.
                    example: UNKNOWN-ADDRESS
                  message:
                    type: string
                    description: |
                      Additional information about the verification result.
                    example: An unidentifiable wallet address.
                  version:
                    type: string
                    description: |
                      The version of the IVMS101 messaging protocol being used.
                    example: '1.0'
                  ivms101:
                    type: object
                    description: >
                      An object containing IVMS101-formatted data, which may
                      include information about the Originator, Originating
                      VASP, Beneficiary, and Beneficiary VASP.
                    required:
                      - beneficiary
                    properties:
                      beneficiary:
                        type: object
                        description: |
                          An object containing Beneficiary information.
                        required:
                          - beneficiaryPersons
                          - accountNumber
                        properties:
                          beneficiaryPersons:
                            type: array
                            description: >
                              Array for personal information of Beneficiary.  
                                
                              Name, address, etc. information for individuals or
                              corporations are included.
                            items:
                              type: object
                              description: >
                                An object containing details about the natural
                                person.
                              properties:
                                naturalPerson:
                                  type: object
                                  description: >
                                    An object containing details about the
                                    natural person.
                                  properties:
                                    name:
                                      type: object
                                      required:
                                        - nameIdentifier
                                      description: |
                                        An object with name details.
                                      properties:
                                        nameIdentifier:
                                          type: array
                                          description: >-
                                            An array containing the name
                                            information.
                                          items:
                                            type: object
                                            required:
                                              - primaryIdentifier
                                              - nameIdentifierType
                                            properties:
                                              primaryIdentifier:
                                                type: string
                                                description: >
                                                  The basic representation of a last
                                                  name.  

                                                  By default, this field is used to enter
                                                  the last name. However, if separating
                                                  the last name and first name is not
                                                  feasible, the full name can be entered
                                                  in this field.
                                                example: James
                                              secondaryIdentifier:
                                                type: string
                                                description: >
                                                  The basic representation of a first
                                                  name.  

                                                  This field is primarily used to enter
                                                  the first name. If a middle name also
                                                  needs to be included, it can be combined
                                                  with the first name in this field.
                                                example: James || Jeffry James
                                              nameIdentifierType:
                                                type: string
                                                enum:
                                                  - ALIA
                                                  - BIRT
                                                  - MAID
                                                  - LEGL
                                                  - MISC
                                                description: >
                                                  The type of name identifier.  
                                                    
                                                  Refer to the details below for
                                                  information about each type of name
                                                  identifier:   The following values can
                                                  be included:  
                                                    **ALIA**: An alias name, commonly known apart from the legal name.  

                                                    **BIRT**: A birth name.  

                                                    **MAID**: The original name used before a surname change due to marriage.  

                                                    **LEGL**: A legally or officially registered name.  

                                                    **MISC**: Other names that do not fall under the above categories.
                                            example: LEGL
                                    geographicAddress:
                                      type: array
                                      description: >

                                        An array containing address
                                        information.  

                                        To use this field, at least one of the
                                        following conditions must be met:  
                                        Required conditions  
                                          1. At least one addressLinemust be present.  
                                          
                                          2. Both streetName and buildingName must be present.  
                                          
                                          3. Both streetName and buildingNumber must be present.  
                                        </details>
                                      items:
                                        type: object
                                        properties:
                                          addressType:
                                            type: string
                                            enum:
                                              - HOME
                                              - BIZZ
                                              - GEOG
                                            description: >
                                              The type of geographic address.  
                                              Allowed values:  
                                                HOME: Home address.  
                                                BIZZ: Business address.  
                                                GEOG: Geographic address.
                                            example: GEOG
                                          townName:
                                            type: string
                                            description: |

                                              The name of the town or district.
                                            example: Yeoksam-dong
                                          addressLine:
                                            type: array
                                            items:
                                              type: string
                                            description: >

                                              A free-form address that identifies a
                                              specific location.   If dividing the
                                              address into components (e.g., province,
                                              city, street name) is difficult, the
                                              full address can be entered as a single
                                              string in addressLine.
                                            example:
                                              - 14 Teheran-ro 4-gil
                                              - Gangnam-gu
                                              - 4th floor
                                          country:
                                            type: string
                                            description: >
                                              The country code of the country of
                                              residence (ISO 3166-1 alpha-2 format).
                                            example: KR
                                    nationalIdentification:
                                      type: object
                                      description: >
                                        An object containing National
                                        Identification information.
                                      properties:
                                        nationalIdentifier:
                                          type: string
                                          description: |
                                            National Identification Number.
                                          example: 12345-67890
                                        nationalIdentifierType:
                                          type: string
                                          enum:
                                            - ARNU
                                            - CCPT
                                            - RAID
                                            - DRLC
                                            - FIIN
                                            - TXID
                                            - SOCS
                                            - IDCD
                                            - LEIX
                                            - MISC
                                          description: >
                                            Type of National Identification.  
                                            Allowed values:  
                                              **ARNU**: Alien Registration Number (assigned to foreigners by the state).  
                                              **CCPT**: Passport Number.  
                                              **RAID**: (For corporations only) Corporate registration number (e.g., business registration number).  
                                              **DRLC**: Driver's License Number.  
                                              **FIIN**: Foreign Investor Identification Number.  
                                              **TXID**: Tax Identification Number (assigned by tax authorities).  
                                              **SOCS**: Social Security or Resident Registration Number.  
                                              **IDCD**: ID Card Number (assigned by a national authority).  
                                              **LEIX**: (For corporations only) Legal Entity Identifier (global identifier under ISO 17442).  
                                              **MISC**: Other types of national identification numbers not defined above.  

                                              Further details can be found in the [IVMS Guide](https://kr-verifyvasp.gitbook.io/verifyvasp/4SIXfxCm5FxXbkiB9pkY/references/ivms101-guide#nationalidentification-type).
                                      example: IDCD
                                    customerIdentification:
                                      type: string
                                      description: |

                                        Customer number of individual.
                                      example: '1234569999'
                                    dateAndPlaceOfBirth:
                                      type: object
                                      properties:
                                        dateOfBirth:
                                          type: string
                                          description: |
                                            Date of birth.  
                                            Allowed format: ISO 8601 ("YYYY-MM-DD").
                                          example: '1985-03-14'
                                        placeOfBirth:
                                          type: string
                                          description: |
                                            Place of birth.
                                          example: Nonsan
                                    countryOfResidence:
                                      type: string
                                      description: >
                                        The country code of the country of
                                        residence.
                                      example: KR
                          accountNumber:
                            type: array
                            description: |
                              An array containing wallet addresses.
                            items:
                              type: string
              examples:
                Successful Example:
                  summary: example of a successful verification response
                  description: >
                    A complete example of a successful verification response
                    including IVMS101 beneficiary data.
                  value:
                    result: VERIFIED
                    reason: OK
                    message: ''
                    version: '1.0'
                    ivms101:
                      beneficiary:
                        beneficiaryPersons:
                          - naturalPerson:
                              name:
                                nameIdentifier:
                                  - primaryIdentifier: James
                                    nameIdentifierType: LEGL
                                localNameIdentifier:
                                  - primaryIdentifier: 김재원
                                    nameIdentifierType: LEGL
                              geographicAddress:
                                - addressType: GEOG
                                  townName: Yeoksam-dong
                                  addressLine:
                                    - 14 Teheran-ro 4-gil, Gangnam-gu
                                    - 4th floor
                                  country: KR
                              nationalIdentification:
                                nationalIdentifier: 12345-67890
                                nationalIdentifierType: IDCD
                              customerIdentification: '1234569999'
                              dateAndPlaceOfBirth:
                                dateOfBirth: '1985-03-14'
                                placeOfBirth: Nonsan
                              countryOfResidence: KR
                        accountNumber:
                          - '0xb0bFf9721871e22653358956cf59a5FdBF3D752F'
  /VASP_DEFINED_PATH_TRANSACTION_CHECK:
    post:
      summary: Check Trasnaction Status API
      description: >
        This API must be implemented by your VASP to fulfill its role as a
        Originating VASP. Its primary purpose is to retrieve and return the
        current status of a transfer transaction submitted by the Originator on
        the blockchain. This API is typically called by the Beneficiary VASP
        when asynchronous status updates from the Originating VASP are delayed
        or missing. 

        The Enclave will invoke this API upon receiving transaction status
        checking requests from the Beneficiary VASP.


        ### Functional Requirements

        **1. Mapping Verification UUID to the Corresponding Transaction Hash**

        Your VASP, acting as the Originating VASP, must map the verificationUuid
        (received in response to a previous 'Verify User API' request) to the
        transaction hash of the on-chain transfer submitted following the
        verification result.


        **2. Retrieving and Responding On-Chain Transaction Status**

        Using the transaction hash, retrieve the current status of the on-chain
        transaction. The transaction status must be returned in the
        transactionStatus field, which supports the following allowed values:
          * **PENDING**: The transaction is awaiting submission to the blockchain for any reason.
          * ** PROCESSING**: The transaction has been submitted to the blockchain and is waiting to be mined.
          * **WAIT-CONFIRM**: The transaction has been mined, but finality has not yet been achieved.
          * **CONFIRMED**: The transaction has been mined and has achieved finality.
          * **CANCELED**: The transaction was either canceled before submission or permanently canceled after submission.

        ### Contraints 

        * This API must respond within 1 second.


        ### Recommendations

        To simplify the management of the verificationUuid and transaction hash
        pair, it is strongly recommended to leverage the Enclave APIs: Report
        Transaction Result API and Get Verification Result API. 
          * Ensure Prompt Transaction Reporting
            * Immediately after submitting the blockchain transaction and obtaining the transaction hash, call the Report Transaction Result API. This ensures you can:
              * Notify the Beneficiary VASP of the transaction result.
              * Store the transaction hash corresponding to the verificationUuid in the Enclave.
          * Retrieving the Transaction Hash From Enclave
            * If the Beneficiary VASP later calls the Check Transaction Status API, use the Enclave's Get Verification Result API to retrieve the previously stored transaction hash. 
            * This transaction hash can then be used to query the real-time status of the blockchain transaction and respond to the Beneficiary VASP.

        Leveraging this implementation allows your VASP to efficiently manage
        verificationUuid and transaction hash mapping without a dedicated
        database, simplifying implementation while ensuring accurate and timely
        status handling.


        ### Environment Variable Configuration

        Set the following environment variables as per the guide to integrate
        the implemented API with the Enclave.
          * `VEGA_VERIFICATION_TRANSACTION_API_PATH`: Implement this API at the desired path({VASP_DEFINED_PATH_TRANSACTION_CHECK}) and set the path in the variable.
          * `VEGA_VERIFICATION_AUTHORIZATION_TOKEN`: Set this variable to the API key provided during your VerifyVASP onboarding process.

        For a complete list of Enclave environment variables, [click
        here.](ref:travelrule-enclave-setup).
      security:
        - ApiKeyAuth: []
      operationId: travelrule-check-Transaction-Status
      tags:
        - VASP Transaction API
      x-readme:
        explorer-enabled: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - verificationUuid
              properties:
                verificationUuid:
                  type: string
                  description: >
                    A unique identifier for the User Verification request.  

                    The format of **verificationUuid** must follow the UUID v4
                    standard.
                  example: 4bc03a8f-5679-4358-815c-906aae5557f4
            examples:
              requestexamples:
                value:
                  originatingVaspId: '15952089931162060684'
      responses:
        '200':
          description: Successful CheckTransactionStatus response
          content:
            application/json:
              schema:
                type: object
                required:
                  - verificationUuid
                  - transactionStatus
                properties:
                  verificationUuid:
                    type: string
                    description: >
                      A unique identifier for the User Verification request.  

                      The format of **verificationUuid** must follow the UUID v4
                      standard.
                    example: 4bc03a8f-5679-4358-815c-906aae5557f4
                  transactionStatus:
                    type: string
                    enum:
                      - PENDING
                      - PROCESSING
                      - WAIT-CONFIRM
                      - CONFIRMED
                      - CANCELED
                    description: |
                      Current status of the virtual asset transaction.  
                        
                      Details of each state:  
                        **PENDING**: The Originating VASP has not yet executed the virtual asset transaction.  
                        
                        **PROCESSING**:The virtual asset transaction has been initiated and is awaiting mining.  
                                      
                        **WAIT-CONFIR**: The transaction has been mined but the block containing it has not achieved finality.  
                        
                        **CONFIRMED**: The virtual asset transaction has been mined, and the block containing the transaction has achieved finality.  
                        
                        **CANCELED**: The Originating VASP has permanently canceled the transaction for a specific reason.
                    example: PROCESSING
                  txHash:
                    type: string
                    description: |
                      Unique identifier of the transaction.
                    example: >-
                      8a54d58ca4100112a5430818776d74898f2232770bae03046862575cb851a042
                  vout:
                    type: string
                    description: |
                      Index of the output in a Bitcoin blockchain transaction.
                    example: '2'
              examples:
                Successful Example:
                  value:
                    originatingVaspId: '15952089931162060684'
                    transactionStatus: PROCESSING
                    txHash: >-
                      8a54d58ca4100112a5430818776d74898f2232770bae03046862575cb851a042
                    vout: '2'
  /VASP_DEFINED_PATH_CALLBACK:
    post:
      summary: Callback API
      description: >
        The Callback API serves as a common interface for handling various
        asynchronous flows. Depending on the callbackType, it may be invoked
        when your VASP acts as either the Originating VASP or the Beneficiary
        VASP. Your implementation must function correctly in all possible cases.
        The Enclave will invoke this API when a counterparty VASP triggers a
        Report APIs.


        ### Functional Requirements

        ** 1. Callback Type Support**

        The implementation must route the request to appropriate business logic
        for each callbackType values. The following are the possible values for
        the callbackType field and the scenarios in which they are used:
          - **VERIFICATION_RESULT**: callbackType for Originating VASP role. This callback is triggered by Enclave when it the user verification process is terminated and result is delivered to the Enclave asynchronously.
          - **TX_REPORT**: callbackType for Beneficiary VASP role. This callback is triggered by Enclave when the Originating VASP sends a transaction result report.
          - **ERROR_REPORT**: callbackType for Beneficiary VASP role. This callback is triggered by Enclave when the Originating VASP sends an error report.
        `VERIFICATION_RESULT`, `TX_REPORT`, and `ERROR_REPORT` types must be
        implemented as mandatory processing logic.
          - **CHAINALYSIS_KYT_RESULT**: This callback is triggered by Enclave when a risk assessment result is delivered from the Chainalysis KYT request.
          - **REFINITIV_WCO_RESULT**: This callback is triggered by Enclave when a risk assessment result is delivered from the Refinitiv WCO request.
        `CHAINALYSIS_KYT_RESULT` and `REFINITIV_WCO_RESULT` types are optional
        and can be implemented only if the corresponding screening APIs are in
        use.


        ** 2. VERIFICATION_RESULT Callback Type Handling (as Originating VASP)**

        When a verification result is received, your VASP must perform further
        required actions in accordance with the verification result. For
        example,
          - For successful verification, proceed with either initiating beneficiary verification on the Originating VASP side or executing the on-chain transaction.
          - For failed verification, cancel the associated asset transfer and notify the originator user of the failure with proper message. data.reason field can be refered to generate the failure messages.

        <details>
          <summary>Example of Request Body for `VERIFICATION_RESULT` callback type with `VERIFIED` result</summary>

          ``` json
            {
              "callbackType": "VERIFICATION_RESULT",
              "data": {
                "result": "VERIFIED",
                "verificationUuid": "ecb457e3-2307-4e72-8a42-16a3774e154b"
              }
            }
          ```
        </details>


        <details>
          <summary>Example of Request Body for `VERIFICATION_RESULT` callback type with `DENIED` result</summary>

          ``` json
            {
              "callbackType":"VERIFICATION_RESULT",
              "data":{
                  "verificationUuid":"64ab871b-14a3-47df-9b80-368e29fe8180",
                  "verificationResult":"DENIED",
                  "reason":"UNKNOWN-ADDRESS",
                  "ivms101":{
                    "originator":{
                        "originatorPersons":[
                          {
                              "naturalPerson":{
                                "name":{
                                    "nameIdentifier":[
                                      {
                                          "primaryIdentifier":"James",
                                          "secondaryIdentifier":"Din",
                                          "nameIdentifierType":"LEGL"
                                      }
                                    ]
                                }
                              }
                          }
                        ],
                        "accountNumber":[
                          "0x5811001506550d8356a215be229c15b6ef371a9a"
                        ]
                    },
                    "beneficiary":{
                        "beneficiaryPersons":[
                          {
                              "naturalPerson":{
                                "name":{
                                    "nameIdentifier":[
                                      {
                                          "primaryIdentifier":"Taylor",
                                          "secondaryIdentifier":"Robbins",
                                          "nameIdentifierType":"LEGL"
                                      }
                                    ]
                                }
                              }
                          }
                        ],
                        "accountNumber":[
                          "0xb0bFf9721871e22653358956cf59a5FdBF3D752F"
                        ]
                    },
                    "originatingVASP":{
                        "legalPerson":{
                          "name":{
                              "nameIdentifier":[
                                {
                                    "legalPersonName":"Lambda256",
                                    "legalPersonNameIdentifierType":"LEGL"
                                }
                              ]
                          },
                          "geographicAddress":[
                              {
                                "addressType":"GEOG",
                                "postcode":"123123c",
                                "townName":"Yeoksam-dong",
                                "addressLine":[
                                    "sechogu street",
                                    "100-100"
                                ],
                                "country":"KR"
                              }
                          ],
                          "nationalIdentification":{
                              "nationalIdentifier":"KR0001",
                              "nationalIdentifierType":"RAID",
                              "registrationAuthority":"RA000151"
                          }
                        }
                    },
                    "beneficiaryVASP":{
                        "legalPerson":{
                          "name":{
                              "nameIdentifier":[
                                {
                                    "legalPersonName":"Lambda256 Exchange",
                                    "legalPersonNameIdentifierType":"LEGL"
                                }
                              ]
                          },
                          "geographicAddress":[
                              {
                                "addressType":"GEOG",
                                "postcode":"234234",
                                "townName":"Yeoksam-dong",
                                "addressLine":[
                                    "sechogu street",
                                    "100-100"
                                ],
                                "country":"KR"
                              }
                          ],
                          "nationalIdentification":{
